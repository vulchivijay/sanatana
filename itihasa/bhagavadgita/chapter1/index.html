ght for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 14\",\"Gita 1.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 14\",\"description\":\"Bhagavad Gita Chapter 1 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ | माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः ||१-१४||\",\"verse\":{\"sanskrit\":\"ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ | माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः ||१-१४||\",\"translation\":\"1.14. Then, also, Madhava (Krishna) and the son of Pandu (Arjuna), seated in the magnificent chariot, yoked with white horses, blew divine conches.\",\"transliteration\":\"tataḥ śvetairhayairyukte mahati syandane sthitau . mādhavaḥ pāṇḍavaścaiva divyau śaṅkhau pradadhmatuḥ ||1-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 15\",\"description\":\"Bhagavad Gita Chapter 1 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 15\",\"description\":\"Bhagavad Gita Chapter 1 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 15\",\"Gita 1.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 15\",\"description\":\"Bhagavad Gita Chapter 1 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"पाञ्चजन्यं हृषीकेशो देवदत्तं धनञ्जयः | पौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः ||१-१५||\",\"verse\":{\"sanskrit\":\"पाञ्चजन्यं हृषीकेशो देवदत्तं धनञ्जयः | पौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः ||१-१५||\",\"translation\":\"1.15. Hrishikesha blew the Panchajanya and Arjuna blew the Devadatta and Bhima (the wolf-bellied), the doer of terrible deeds, blew the great conch Paundra.\",\"transliteration\":\"pāñcajanyaṃ hṛṣīkeśo devadattaṃ dhanañjayaḥ . pauṇḍraṃ dadhmau mahāśaṅkhaṃ bhīmakarmā vṛkodaraḥ ||1-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 16\",\"description\":\"Bhagavad Gita Chapter 1 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 16\",\"description\":\"Bhagavad Gita Chapter 1 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 16\",\"Gita 1.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"K a Chapter 1 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"काश्यश्च परमेष्वासः शिखण्डी च महारथः | धृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः ||१-१७||\",\"verse\":{\"sanskrit\":\"काश्यश्च परमेष्वासः शिखण्डी च महारथः | धृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः ||१-१७||\",\"translation\":\"1.17. The king of Kasi, an exellent archer, Sikhandi, the mighty car-warrior, Dhrishtadyumna and Virata and Satyaki, the unconered.\",\"transliteration\":\"kāśyaśca parameṣvāsaḥ śikhaṇḍī ca mahārathaḥ . dhṛṣṭadyumno virāṭaśca sātyakiścāparājitaḥ ||1-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 18\",\"description\":\"Bhagavad Gita Chapter 1 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 18\",\"description\":\"Bhagavad Gita Chapter 1 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 18\",\"Gita 1.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 18\",\"description\":\"Bhagavad Gita Chapter 1 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते | सौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक् ||१-१८||\",\"verse\":{\"sanskrit\":\"द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते | सौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक् ||१-१८||\",\"translation\":\"1.18. Drupada and the sons of Draupadi, O Lord of the earth, and the son of Subhadra, the mighty-armed, blew their conches separately.\",\"transliteration\":\"drupado draupadeyāśca sarvaśaḥ pṛthivīpate . saubhadraśca mahābāhuḥ śaṅkhāndadhmuḥ pṛthakpṛthak ||1-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 19\",\"description\":\"Bhagavad Gita Chapter 1 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 19\",\"description\":\"Bhagavad Gita Chapter 1 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 19\",\"Gita 1.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 19\",\"description\":\"Bhagavad Gita Chapter 1 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत् | नभश्च पृथिवीं चैव तुमुलोऽभ्यनुनादयन् (or लोव्यनु) ||१-१९||\",\"verse\":{\"sanskrit\":\"स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत् | नभश्च पृथिवीं चैव तुमुलोऽभ्यनुनादयन् (or लोव्यनु) ||१-१९||\",\"translation\":\"1.19. That tumultuous sound rent the hearts of (the members of) Dhritarashtra's party, making both the heaven and the earth resound.\",\"transliteration\":\"sa ghoṣo dhārtarāṣṭrāṇāṃ hṛdayāni vyadārayat . nabhaśca pṛthivīṃ caiva tumulo.abhyanunādayan (lo vyanu)||1-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 2\",\"description\":\"Bhagavad Gita Chapter 1 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 2\",\"description\":\"Bhagavad Gita Chapter 1 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 2\",\"Gita 1.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 2\",\"description\":\"Bhagavad Gita Chapter 1 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"सञ्जय उवाच | दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा | आचार्यमुपसंगम्य राजा वचनमब्रवीत् ||१-२||\",\"verse\":{\"sanskrit\":\"सञ्जय उवाच | दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा | आचार्यमुपसंगम्य राजा वचनमब्रवीत् ||१-२||\",\"translation\":\"1.2. Sanjaya said Having seen the army of the Pandavas drawn up in battle-array, King Duryodhana then approached his teacher (Drona) and spoke these words.\",\"transliteration\":\"sañjaya uvāca . dṛṣṭvā tu pāṇḍavānīkaṃ vyūḍhaṃ duryodhanastadā . ācāryamupasaṃgamya rājā vacanamabravīt ||1-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 20\",\"description\":\"Bhagavad Gita Chapter 1 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 20\",\"description\":\"Bhagavad Gita Chapter 1 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 20\",\"Gita 1.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 20\",\"description\":\"Bhagavad Gita Chapter 1 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"अथ व्यवस्थितान्दृष्ट्वा धार्तराष्ट्रान् कपिध्वजः | प्रवृत्ते शस्त्रसम्पाते धनुरुद्यम्य पाण्डवः | हृषीकेशं तदा वाक्यमिदमाह महीपते ||१-२०||\",\"verse\":{\"sanskrit\":\"अथ व्यवस्थितान्दृष्ट्वा धार्तराष्ट्रान् कपिध्वजः | प्रवृत्ते शस्त्रसम्पाते धनुरुद्यम्य पाण्डवः | हृषीकेशं तदा वाक्यमिदमाह महीपते ||१-२०||\",\"translation\":\"1.20. Then, seeing the people of Dhritarashtra’s party standing arrayed and the discharge of weapons about to begin, Arjuna, the son of Pandu, whose ensign was a monkey, took up his bow and said the following to Krishna, O Lord of the earth.\",\"transliteration\":\"atha vyavasthitāndṛṣṭvā dhārtarāṣṭrān kapidhvajaḥ . pravṛtte śastrasampāte dhanurudyamya pāṇḍavaḥ ||1-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 21\",\"description\":\"Bhagavad Gita Chapter 1 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 21\",\"description\":\"Bhagavad Gita Chapter 1 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 21\",\"Gita 1.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 21\",\"description\":\"Bhagavad Gita Chapter 1 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"अर्जुन उवाच | सेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत ||१-२१||\",\"verse\":{\"sanskrit\":\"अर्जुन उवाच | सेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत ||१-२१||\",\"translation\":\"1.21 Arjuna said In the middle between the two armies, place my chariot, O krishna, so that I may behold those who stand here desirous to fight, and know with whom I must fight, when the battle is about to commence.\",\"transliteration\":\"hṛṣīkeśaṃ tadā vākyamidamāha mahīpate . arjuna uvāca . senayorubhayormadhye rathaṃ sthāpaya me.acyuta ||1-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 22\",\"description\":\"Bhagavad Gita Chapter 1 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 22\",\"description\":\"Bhagavad Gita Chapter 1 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 22\",\"Gita 1.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 22\",\"description\":\"Bhagavad Gita Chapter 1 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान् | कैर्मया सह योद्धव्यमस्मिन् रणसमुद्यमे ||१-२२||\",\"verse\":{\"sanskrit\":\"यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान् | कैर्मया सह योद्धव्यमस्मिन् रणसमुद्यमे ||१-२२||\",\"translation\":\"1.22. Arjuna said In the middle between the two armies, place my chariot, O krishna, so that I may behold those who stand here desirous to fight, and know with whom I must fight, when the battle is about to commence.\",\"transliteration\":\"yāvadetānnirikṣe.ahaṃ yoddhukāmānavasthitān . kairmayā saha yoddhavyamasmin raṇasamudyame ||1-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 23\",\"description\":\"Bhagavad Gita Chapter 1 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 23\",\"description\":\"Bhagavad Gita Chapter 1 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 23\",\"Gita 1.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 23\",\"description\":\"Bhagavad Gita Chapter 1 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः | धार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः ||१-२३||\",\"verse\":{\"sanskrit\":\"योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः | धार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः ||१-२३||\",\"translation\":\"1.23. For I desire to observe those who are assembled here to fight, wishing to please in battle the evil-minded Duryodhana (the son of Dhritarashtra).\",\"transliteration\":\"yotsyamānānavekṣe.ahaṃ ya ete.atra samāgatāḥ . dhārtarāṣṭrasya durbuddheryuddhe priyacikīrṣavaḥ ||1-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 24\",\"description\":\"Bhagavad Gita Chapter 1 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 24\",\"description\":\"Bhagavad Gita Chapter 1 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 24\",\"Gita 1.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 24\",\"description\":\"Bhagavad Gita Chapter 1 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"सञ्जय उवाच | एवमुक्तो हृषीकेशो गुडाकेशेन भारत | सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम् ||१-२४||\",\"verse\":{\"sanskrit\":\"सञ्जय उवाच | एवमुक्तो हृषीकेशो गुडाकेशेन भारत | सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम् ||१-२४||\",\"translation\":\"1.24. Sanjaya said Thus addressed by Arjuna, Krishna, having stationed that best of chariots, O Dhritarashtra, in the midst of the two armies.\",\"transliteration\":\"sañjaya uvāca . evamukto hṛṣīkeśo guḍākeśena bhārata . senayorubhayormadhye sthāpayitvā rathottamam ||1-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 25\",\"description\":\"Bhagavad Gita Chapter 1 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 25\",\"description\":\"Bhagavad Gita Chapter 1 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 25\",\"Gita 1.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 25\",\"description\":\"Bhagavad Gita Chapter 1 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम् | उवाच पार्थ पश्यैतान्समवेतान्कुरूनिति ||१-२५||\",\"verse\":{\"sanskrit\":\"भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम् | उवाच पार्थ पश्यैतान्समवेतान्कुरूनिति ||१-२५||\",\"translation\":\"1.25. In front of Bhishma and Drona, and all the rulers of the earth, said: \\\"O Arjuna (son of Pritha), behold these Kurus gathered together.\\\"\",\"transliteration\":\"bhīṣmadroṇapramukhataḥ sarveṣāṃ ca mahīkṣitām . uvāca pārtha paśyaitānsamavetānkurūniti ||1-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 26\",\"description\":\"Bhagavad Gita Chapter 1 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 26\",\"description\":\"Bhagavad Gita Chapter 1 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 26\",\"Gita 1.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 26\",\"description\":\"Bhagavad Gita Chapter 1 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"तत्रापश्यत्स्थितान्पार्थः पितॄनथ पितामहान् | आचार्यान्मातुलान्भ्रातॄन्पुत्रान्पौत्रान्सखींस्तथा ||१-२६||\",\"verse\":{\"sanskrit\":\"तत्रापश्यत्स्थितान्पार्थः पितॄनथ पितामहान् | आचार्यान्मातुलान्भ्रातॄन्पुत्रान्पौत्रान्सखींस्तथा ||१-२६||\",\"translation\":\"1.26. Then, Arjuna (son of Pritha) saw there (in the armies) stationed, fathers and grandfathers, teachers, maternal uncles, brothers, sons, grandsons and friends too.\",\"transliteration\":\"tatrāpaśyatsthitānpārthaḥ pitṝnatha pitāmahān . ācāryānmātulānbhrātṛnputrānpautrānsakhīṃstathā ||1-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 27\",\"description\":\"Bhagavad Gita Chapter 1 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 27\",\"description\":\"Bhagavad Gita Chapter 1 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 27\",\"Gita 1.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 27\",\"description\":\"Bhagavad Gita Chapter 1 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि | तान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान् ||१-२७||\",\"verse\":{\"sanskrit\":\"श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि | तान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान् ||१-२७||\",\"translation\":\"1.27. (He saw) fathers-in-law and friends also in both the armies. The son of Kunti, Arjuna, seeing all those kinsmen thus standing arrayed, spoke this, sorrowfully filled with deep pity.\",\"transliteration\":\"śvaśurānsuhṛdaścaiva senayorubhayorapi . tānsamīkṣya sa kaunteyaḥ sarvānbandhūnavasthitān ||1-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 28\",\"description\":\"Bhagavad Gita Chapter 1 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 28\",\"description\":\"Bhagavad Gita Chapter 1 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 28\",\"Gita 1.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 28\",\"description\":\"Bhagavad Gita Chapter 1 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"कृपया परयाविष्टो विषीदन्निदमब्रवीत् | अर्जुन उवाच | दृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम् ||१-२८||\",\"verse\":{\"sanskrit\":\"कृपया परयाविष्टो विषीदन्निदमब्रवीत् | अर्जुन उवाच | दृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम् ||१-२८||\",\"translation\":\"1.28. Arjuna said Seeing these, my kinsmen, O krishna, arrayed, eager to fight.\",\"transliteration\":\"kṛpayā parayāviṣṭo viṣīdannidamabravīt . arjuna uvāca . dṛṣṭvemaṃ svajanaṃ kṛṣṇa yuyutsuṃ samupasthitam ||1-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 29\",\"description\":\"Bhagavad Gita Chapter 1 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 29\",\"description\":\"Bhagavad Gita Chapter 1 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 29\",\"Gita 1.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 29\",\"description\":\"Bhagavad Gita Chapter 1 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"सीदन्ति मम गात्राणि मुखं च परिशुष्यति | वेपथुश्च शरीरे मे रोमहर्षश्च जायते ||१-२९||\",\"verse\":{\"sanskrit\":\"सीदन्ति मम गात्राणि मुखं च परिशुष्यति | वेपथुश्च शरीरे मे रोमहर्षश्च जायते ||१-२९||\",\"translation\":\"1.29. My limbs fail and my mouth is parched, my body ivers and my hair stands on end.\",\"transliteration\":\"sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati . vepathuśca śarīre me romaharṣaśca jāyate ||1-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 3\",\"description\":\"Bhagavad Gita Chapter 1 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 3\",\"description\":\"Bhagavad Gita Chapter 1 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 3\",\"Gita 1.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 3\",\"description\":\"Bhagavad Gita Chapter 1 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम् | व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता ||१-३||\",\"verse\":{\"sanskrit\":\"पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम् | व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता ||१-३||\",\"translation\":\"1.3. \\\"Behold, O Teacher! this mighty army of the sons of Pandu, arrayed by the son of Drupada, thy wise disciple.\",\"transliteration\":\"paśyaitāṃ pāṇḍuputrāṇāmācārya mahatīṃ camūm . vyūḍhāṃ drupadaputreṇa tava śiṣyeṇa dhīmatā ||1-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 30\",\"description\":\"Bhagavad Gita Chapter 1 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 30\",\"description\":\"Bhagavad Gita Chapter 1 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 30\",\"Gita 1.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 30\",\"description\":\"Bhagavad Gita Chapter 1 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते | न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः ||१-३०||\",\"verse\":{\"sanskrit\":\"गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते | न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः ||१-३०||\",\"translation\":\"1.30. The (bow) Gandiva slips from my hand, and also my skins burns all over; I am unable even to stand and my mind is reeling, as it were.\",\"transliteration\":\"gāṇḍīvaṃ sraṃsate hastāttvakcaiva paridahyate . na ca śaknomyavasthātuṃ bhramatīva ca me manaḥ ||1-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 31\",\"description\":\"Bhagavad Gita Chapter 1 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 31\",\"description\":\"Bhagavad Gita Chapter 1 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 31\",\"Gita 1.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 31\",\"description\":\"Bhagavad Gita Chapter 1 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"निमित्तानि च पश्यामि विपरीतानि केशव | न च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे ||१-३१||\",\"verse\":{\"sanskrit\":\"निमित्तानि च पश्यामि विपरीतानि केशव | न च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे ||१-३१||\",\"translation\":\"1.31. And I see adverse omens, O Kesava. I do not see any good in killing my kinsmen in battle.\",\"transliteration\":\"nimittāni ca paśyāmi viparītāni keśava . na ca śreyo.anupaśyāmi hatvā svajanamāhave ||1-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 32\",\"description\":\"Bhagavad Gita Chapter 1 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 32\",\"description\":\"Bhagavad Gita Chapter 1 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 32\",\"Gita 1.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 32\",\"description\":\"Bhagavad Gita Chapter 1 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च | किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा ||१-३२||\",\"verse\":{\"sanskrit\":\"न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च | किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा ||१-३२||\",\"translation\":\"1.32. I desire not victory, O Krishna, nor kingdom, nor pleasures. Of what avail is dominion to us, O Krishna, or pleasures or even life?\",\"transliteration\":\"na kāṅkṣe vijayaṃ kṛṣṇa na ca rājyaṃ sukhāni ca . kiṃ no rājyena govinda kiṃ bhogairjīvitena vā ||1-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 33\",\"description\":\"Bhagavad Gita Chapter 1 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 33\",\"description\":\"Bhagavad Gita Chapter 1 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-33\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 33\",\"Gita 1.33\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-33\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 33\",\"description\":\"Bhagavad Gita Chapter 1 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-33\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च | त इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च ||१-३३||\",\"verse\":{\"sanskrit\":\"येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च | त इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च ||१-३३||\",\"translation\":\"1.33. Those for whose sake we desire kingdom, enjoyments and pleasures, stand here in battle, having renounced life and wealth.\",\"transliteration\":\"yeṣāmarthe kāṅkṣitaṃ no rājyaṃ bhogāḥ sukhāni ca . ta ime.avasthitā yuddhe prāṇāṃstyaktvā dhanāni ca ||1-33||\"}}},\"verse34\":{\"verse34\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 34\",\"description\":\"Bhagavad Gita Chapter 1 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 34\",\"description\":\"Bhagavad Gita Chapter 1 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-34\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 34\",\"Gita 1.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 34\",\"description\":\"Bhagavad Gita Chapter 1 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"आचार्याः पितरः पुत्रास्तथैव च पितामहाः | मातुलाः श्वशुराः पौत्राः श्यालाः सम्बन्धिनस्तथा ||१-३४||\",\"verse\":{\"sanskrit\":\"आचार्याः पितरः पुत्रास्तथैव च पितामहाः | मातुलाः श्वशुराः पौत्राः श्यालाः सम्बन्धिनस्तथा ||१-३४||\",\"translation\":\"1.34. Teachers, fathers, sons and also grandfathers, maternal uncles, fathers-in-law, grandsons, brothers-in-law and other relatives,-\",\"transliteration\":\"ācāryāḥ pitaraḥ putrāstathaiva ca pitāmahāḥ . mātulāḥ śvaśurāḥ pautrāḥ śyālāḥ sambandhinastathā ||1-34||\"}}},\"verse35\":{\"verse35\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 35\",\"description\":\"Bhagavad Gita Chapter 1 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 35\",\"description\":\"Bhagavad Gita Chapter 1 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-35\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 35\",\"Gita 1.35\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-35\"},\"introduction\":\"$55\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 35\",\"description\":\"Bhagavad Gita Chapter 1 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-35\"},\"philosophical_explanation\":\"$56\",\"scripture_text\":\"एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन | अपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते ||१-३५||\",\"verse\":{\"sanskrit\":\"एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन | अपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते ||१-३५||\",\"translation\":\"1.35. These I do not wish to kill, though they kill me, O Krishna, even for the sake of dominion over the three worlds; leave alone killing them for the sake of the earth.\",\"transliteration\":\"etānna hantumicchāmi ghnato.api madhusūdana . api trailokyarājyasya hetoḥ kiṃ nu mahīkṛte ||1-35||\"}}},\"verse36\":{\"verse36\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 36\",\"description\":\"Bhagavad Gita Chapter 1 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 36\",\"description\":\"Bhagavad Gita Chapter 1 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-36\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 36\",\"Gita 1.36\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-36\"},\"introduction\":\"$57\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 36\",\"description\":\"Bhagavad Gita Chapter 1 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-36\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन | पापमेवाश्रयेदस्मान्हत्वैतानाततायिनः ||१-३६||\",\"verse\":{\"sanskrit\":\"निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन | पापमेवाश्रयेदस्मान्हत्वैतानाततायिनः ||१-३६||\",\"translation\":\"1.36. By killing these sons of Dhritarashtra, what pleasure can be ours, O Janardana? Only sin will accrue to us from killing these felons.\",\"transliteration\":\"nihatya dhārtarāṣṭrānnaḥ kā prītiḥ syājjanārdana . pāpamevāśrayedasmānhatvaitānātatāyinaḥ ||1-36||\"}}},\"verse37\":{\"verse37\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 37\",\"description\":\"Bhagavad Gita Chapter 1 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 37\",\"description\":\"Bhagavad Gita Chapter 1 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-37\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 37\",\"Gita 1.37\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-37\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 37\",\"description\":\"Bhagavad Gita Chapter 1 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-37\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान् | स्वजनं हि कथं हत्वा सुखिनः स्याम माधव ||१-३७||\",\"verse\":{\"sanskrit\":\"तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान् | स्वजनं हि कथं हत्वा सुखिनः स्याम माधव ||१-३७||\",\"translation\":\"1.37. Therefore, we should not kill the sons of Dhritarashtra, our relatives; for how can we be happy by killing our own people, O Madhava (Krishna)?\",\"transliteration\":\"tasmānnārhā vayaṃ hantuṃ dhārtarāṣṭrānsvabāndhavān . svajanaṃ hi kathaṃ hatvā sukhinaḥ syāma mādhava ||1-37||\"}}},\"verse38\":{\"verse38\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 38\",\"description\":\"Bhagavad Gita Chapter 1 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 38\",\"description\":\"Bhagavad Gita Chapter 1 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-38\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 38\",\"Gita 1.38\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-38\"},\"introduction\":\"$5b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 38\",\"description\":\"Bhagavad Gita Chapter 1 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-38\"},\"philosophical_explanation\":\"$5c\",\"scripture_text\":\"यद्यप्येते न पश्यन्ति लोभोपहतचेतसः | कुलक्षयकृतं दोषं मित्रद्रोहे च पातकम् ||१-३८||\",\"verse\":{\"sanskrit\":\"यद्यप्येते न पश्यन्ति लोभोपहतचेतसः | कुलक्षयकृतं दोषं मित्रद्रोहे च पातकम् ||१-३८||\",\"translation\":\"1.38. Though they, with intelligence overpowered by greed, see no evil in the destruction of families, and no sin in hostility to friends,\",\"transliteration\":\"yadyapyete na paśyanti lobhopahatacetasaḥ . kulakṣayakṛtaṃ doṣaṃ mitradrohe ca pātakam ||1-38||\"}}},\"verse39\":{\"verse39\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 39\",\"description\":\"Bhagavad Gita Chapter 1 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 39\",\"description\":\"Bhagavad Gita Chapter 1 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-39\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 39\",\"Gita 1.39\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-39\"},\"introduction\":\"$5d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 39\",\"description\":\"Bhagavad Gita Chapter 1 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-39\"},\"philosophical_explanation\":\"$5e\",\"scripture_text\":\"कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम् | कुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन ||१-३९||\",\"verse\":{\"sanskrit\":\"कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम् | कुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन ||१-३९||\",\"translation\":\"1.39. Why should not we who clearly see evil in the destruction of families, learn to turn away from this sin, O Janardana (Krishna)?\",\"transliteration\":\"kathaṃ na jñeyamasmābhiḥ pāpādasmānnivartitum . kulakṣayakṛtaṃ doṣaṃ prapaśyadbhirjanārdana ||1-39||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 4\",\"description\":\"Bhagavad Gita Chapter 1 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 4\",\"description\":\"Bhagavad Gita Chapter 1 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 4\",\"Gita 1.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-4\"},\"introduction\":\"$5f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 4\",\"description\":\"Bhagavad Gita Chapter 1 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-4\"},\"philosophical_explanation\":\"$60\",\"scripture_text\":\"अत्र शूरा महेष्वासा भीमार्जुनसमा युधि | युयुधानो विराटश्च द्रुपदश्च महारथः ||१-४||\",\"verse\":{\"sanskrit\":\"अत्र शूरा महेष्वासा भीमार्जुनसमा युधि | युयुधानो विराटश्च द्रुपदश्च महारथः ||१-४||\",\"translation\":\"1.4. Here are heroes, mighty archers, eal in battle to Bhima and Arjuna, Yoyudhana (Satyaki), Virata and Drupada, of the great car (mighty warriors).\",\"transliteration\":\"atra śūrā maheṣvāsā bhīmārjunasamā yudhi . yuyudhāno virāṭaśca drupadaśca mahārathaḥ ||1-4||\"}}},\"verse40\":{\"verse40\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 40\",\"description\":\"Bhagavad Gita Chapter 1 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 40\",\"description\":\"Bhagavad Gita Chapter 1 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-40\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 40\",\"Gita 1.40\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-40\"},\"introduction\":\"$61\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 40\",\"description\":\"Bhagavad Gita Chapter 1 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-40\"},\"philosophical_explanation\":\"$62\",\"scripture_text\":\"कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः | धर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत ||१-४०||\",\"verse\":{\"sanskrit\":\"कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः | धर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत ||१-४०||\",\"translation\":\"1.40. In the destruction of a family, the immemorial religious rites of that family perish; on the destruction of spirituality, impiety, indeed, overcomes the whole family.\",\"transliteration\":\"kulakṣaye praṇaśyanti kuladharmāḥ sanātanāḥ . dharme naṣṭe kulaṃ kṛtsnamadharmo.abhibhavatyuta ||1-40||\"}}},\"verse41\":{\"verse41\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 41\",\"description\":\"Bhagavad Gita Chapter 1 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 41\",\"description\":\"Bhagavad Gita Chapter 1 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-41\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 41\",\"Gita 1.41\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-41\"},\"introduction\":\"$63\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 41\",\"description\":\"Bhagavad Gita Chapter 1 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-41\"},\"philosophical_explanation\":\"$64\",\"scripture_text\":\"अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः | स्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः ||१-४१||\",\"verse\":{\"sanskrit\":\"अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः | स्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः ||१-४१||\",\"translation\":\"1.41. By the prevalence of impiety, O Krishna, the women of the family become corrupt; and , women being corrupted, O Varshenya (descendant of Vrishni), there arises intermingling of castes.\",\"transliteration\":\"adharmābhibhavātkṛṣṇa praduṣyanti kulastriyaḥ . strīṣu duṣṭāsu vārṣṇeya jāyate varṇasaṅkaraḥ ||1-41||\"}}},\"verse42\":{\"verse42\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 42\",\"description\":\"Bhagavad Gita Chapter 1 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 42\",\"description\":\"Bhagavad Gita Chapter 1 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-42\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 42\",\"Gita 1.42\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-42\"},\"introduction\":\"$65\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 42\",\"description\":\"Bhagavad Gita Chapter 1 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-42\"},\"philosophical_explanation\":\"$66\",\"scripture_text\":\"सङ्करो नरकायैव कुलघ्नानां कुलस्य च | पतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः ||१-४२||\",\"verse\":{\"sanskrit\":\"सङ्करो नरकायैव कुलघ्नानां कुलस्य च | पतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः ||१-४२||\",\"translation\":\"1.42. Confusion of castes leads to hell the slayers of the family, for their forefathers fall, deprived of the offerings of rice-ball and water (libations).\",\"transliteration\":\"saṅkaro narakāyaiva kulaghnānāṃ kulasya ca . patanti pitaro hyeṣāṃ luptapiṇḍodakakriyāḥ ||1-42||\"}}},\"verse43\":{\"verse43\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 43\",\"description\":\"Bhagavad Gita Chapter 1 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 43\",\"description\":\"Bhagavad Gita Chapter 1 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-43\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 43\",\"Gita 1.43\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-43\"},\"introduction\":\"$67\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 43\",\"description\":\"Bhagavad Gita Chapter 1 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-43\"},\"philosophical_explanation\":\"$68\",\"scripture_text\":\"दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः | उत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः ||१-४३||\",\"verse\":{\"sanskrit\":\"दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः | उत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः ||१-४३||\",\"translation\":\"1.43. By these evil deeds of the destroyers of the family, which cause confusion of castes, the eternal religious rites of the caste and the family are destroyed.\",\"transliteration\":\"doṣairetaiḥ kulaghnānāṃ varṇasaṅkarakārakaiḥ . utsādyante jātidharmāḥ kuladharmāśca śāśvatāḥ ||1-43||\"}}},\"verse44\":{\"verse44\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 44\",\"description\":\"Bhagavad Gita Chapter 1 Verse 44 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 44\",\"description\":\"Bhagavad Gita Chapter 1 Verse 44 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-44\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 44\",\"Gita 1.44\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-44\"},\"introduction\":\"$69\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 44\",\"description\":\"Bhagavad Gita Chapter 1 Verse 44 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-44\"},\"philosophical_explanation\":\"$6a\",\"scripture_text\":\"उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन | नरके नियतं वासो भवतीत्यनुशुश्रुम (or नरकेऽनियतं) ||१-४४||\",\"verse\":{\"sanskrit\":\"उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन | नरके नियतं वासो भवतीत्यनुशुश्रुम (or नरकेऽनियतं) ||१-४४||\",\"translation\":\"1.44. We have heard, O Janardana, that inevitable is the dwelling for an unknown period in hell for those men in whose families the religious practices have been destroyed.\",\"transliteration\":\"utsannakuladharmāṇāṃ manuṣyāṇāṃ janārdana . narake niyataṃ vāso bhavatītyanuśuśruma ||1-44||\"}}},\"verse45\":{\"verse45\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 45\",\"description\":\"Bhagavad Gita Chapter 1 Verse 45 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 45\",\"description\":\"Bhagavad Gita Chapter 1 Verse 45 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-45\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 45\",\"Gita 1.45\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-45\"},\"introduction\":\"$6b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 45\",\"description\":\"Bhagavad Gita Chapter 1 Verse 45 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-45\"},\"philosophical_explanation\":\"$6c\",\"scripture_text\":\"अहो बत महत्पापं कर्तुं व्यवसिता वयम् | यद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः ||१-४५||\",\"verse\":{\"sanskrit\":\"अहो बत महत्पापं कर्तुं व्यवसिता वयम् | यद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः ||१-४५||\",\"translation\":\"1.45. Alas! We are involved in a great sin, in that we are prepared to kill our kinsmen, through greed for the pleasures of a kingdom.\",\"transliteration\":\"aho bata mahatpāpaṃ kartuṃ vyavasitā vayam . yadrājyasukhalobhena hantuṃ svajanamudyatāḥ ||1-45||\"}}},\"verse46\":{\"verse46\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 46\",\"description\":\"Bhagavad Gita Chapter 1 Verse 46 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 46\",\"description\":\"Bhagavad Gita Chapter 1 Verse 46 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-46\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 46\",\"Gita 1.46\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-46\"},\"introduction\":\"$6d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 46\",\"description\":\"Bhagavad Gita Chapter 1 Verse 46 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-46\"},\"philosophical_explanation\":\"$6e\",\"scripture_text\":\"यदि मामप्रतीकारमशस्त्रं शस्त्रपाणयः | धार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत् ||१-४६||\",\"verse\":{\"sanskrit\":\"यदि मामप्रतीकारमशस्त्रं शस्त्रपाणयः | धार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत् ||१-४६||\",\"translation\":\"1.46. If the sons of Dhritarashtra with weapons in hand should slay me in battle, unresisting and unarmed, that would be better for me.\",\"transliteration\":\"yadi māmapratīkāramaśastraṃ śastrapāṇayaḥ . dhārtarāṣṭrā raṇe hanyustanme kṣemataraṃ bhavet ||1-46||\"}}},\"verse47\":{\"verse47\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 47\",\"description\":\"Bhagavad Gita Chapter 1 Verse 47 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 47\",\"description\":\"Bhagavad Gita Chapter 1 Verse 47 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-47\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 47\",\"Gita 1.47\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-47\"},\"introduction\":\"$6f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 47\",\"description\":\"Bhagavad Gita Chapter 1 Verse 47 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-47\"},\"philosophical_explanation\":\"$70\",\"scripture_text\":\"सञ्जय उवाच | एवमुक्त्वार्जुनः सङ्ख्ये रथोपस्थ उपाविशत् | विसृज्य सशरं चापं शोकसंविग्नमानसः ||१-४७||\",\"verse\":{\"sanskrit\":\"सञ्जय उवाच | एवमुक्त्वार्जुनः सङ्ख्ये रथोपस्थ उपाविशत् | विसृज्य सशरं चापं शोकसंविग्नमानसः ||१-४७||\",\"translation\":\"1.47. Sanjaya said Having thus spoken in the midst of the battlefield, Arjuna, casting away his bow and arrow, sat down on the seat of the chariot with his mind overwhelmed with sorrow.\",\"transliteration\":\"sañjaya uvāca . evamuktvārjunaḥ saṅkhye rathopastha upāviśat . visṛjya saśaraṃ cāpaṃ śokasaṃvignamānasaḥ ||1-47||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 5\",\"description\":\"Bhagavad Gita Chapter 1 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 5\",\"description\":\"Bhagavad Gita Chapter 1 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 5\",\"Gita 1.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-5\"},\"introduction\":\"$71\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 5\",\"description\":\"Bhagavad Gita Chapter 1 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-5\"},\"philosophical_explanation\":\"$72\",\"scripture_text\":\"धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान् | पुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुंगवः ||१-५||\",\"verse\":{\"sanskrit\":\"धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान् | पुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुंगवः ||१-५||\",\"translation\":\"1.5. \\\"Dhrishtaketu, chekitana and the valiant king of Kasi, Purujit and Kuntibhoja and Saibya, the best men.\",\"transliteration\":\"dhṛṣṭaketuścekitānaḥ kāśirājaśca vīryavān . purujitkuntibhojaśca śaibyaśca narapuṃgavaḥ ||1-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 6\",\"description\":\"Bhagavad Gita Chapter 1 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 6\",\"description\":\"Bhagavad Gita Chapter 1 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 6\",\"Gita 1.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-6\"},\"introduction\":\"$73\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 6\",\"description\":\"Bhagavad Gita Chapter 1 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-6\"},\"philosophical_explanation\":\"$74\",\"scripture_text\":\"युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान् | सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः ||१-६||\",\"verse\":{\"sanskrit\":\"युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान् | सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः ||१-६||\",\"translation\":\"1.6. \\\"The strong Yodhamanyu and the brave Uttamaujas, the son of Subhadra (Abhimanyu, the son of Subhadra and Arjuna), and the sons of Draupadi, all of great chariots (great heroes).\",\"transliteration\":\"yudhāmanyuśca vikrānta uttamaujāśca vīryavān . saubhadro draupadeyāśca sarva eva mahārathāḥ ||1-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 7\",\"description\":\"Bhagavad Gita Chapter 1 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 7\",\"description\":\"Bhagavad Gita Chapter 1 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 7\",\"Gita 1.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-7\"},\"introduction\":\"$75\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 7\",\"description\":\"Bhagavad Gita Chapter 1 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-7\"},\"philosophical_explanation\":\"$76\",\"scripture_text\":\"अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम | नायका मम सैन्यस्य संज्ञार्थं तान्ब्रवीमि ते ||१-७||\",\"verse\":{\"sanskrit\":\"अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम | नायका मम सैन्यस्य संज्ञार्थं तान्ब्रवीमि ते ||१-७||\",\"translation\":\"1.7. \\\"Know also, O best among the twice-born! the names of those who are the most distinguished amongst ourselves, the leaders of my army; these I name to thee for thy information.\",\"transliteration\":\"asmākaṃ tu viśiṣṭā ye tānnibodha dvijottama . nāyakā mama sainyasya saṃjñārthaṃ tānbravīmi te ||1-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 8\",\"description\":\"Bhagavad Gita Chapter 1 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 8\",\"description\":\"Bhagavad Gita Chapter 1 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 1 Verse 8\",\"Gita 1.8\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-1/verse-8\"},\"introduction\":\"$77\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 1 Verse 8\",\"description\":\"Bhagavad Gita Chapter 1 Verse 8 with original Sanskrit, IAST t
