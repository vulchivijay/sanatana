eration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-11\"},\"philosophical_explanation\":\"$22\",\"scripture_text\":\"मयि चानन्ययोगेन भक्तिरव्यभिचारिणी | विविक्तदेशसेवित्वमरतिर्जनसंसदि ||१३-११||\",\"verse\":{\"sanskrit\":\"मयि चानन्ययोगेन भक्तिरव्यभिचारिणी | विविक्तदेशसेवित्वमरतिर्जनसंसदि ||१३-११||\",\"translation\":\"13.11 Unswerving devotion unto Me by the Yoga of non-separation, resort to solitary places, distaste for the society of men.\",\"transliteration\":\"mayi cānanyayogena bhaktiravyabhicāriṇī . viviktadeśasevitvamaratirjanasaṃsadi ||13-11||\"}}},\"verse12\":{\"verse12\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 12\",\"description\":\"Bhagavad Gita Chapter 13 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 12\",\"description\":\"Bhagavad Gita Chapter 13 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-12\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 12\",\"Gita 13.12\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-12\"},\"introduction\":\"$23\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 12\",\"description\":\"Bhagavad Gita Chapter 13 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-12\"},\" |१३-१३||\",\"verse\":{\"sanskrit\":\"ज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वामृतमश्नुते | अनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते ||१३-१३||\",\"translation\":\"13.13 I will declare that which has to be known, knowing which one attains to immortality, the beginningless supreme Brahman, called neither being nor non-being.\",\"transliteration\":\"jñeyaṃ yattatpravakṣyāmi yajjñātvāmṛtamaśnute . anādi matparaṃ brahma na sattannāsaducyate ||13-13||\"}}},\"verse14\":{\"verse14\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 14\",\"description\":\"Bhagavad Gita Chapter 13 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 14\",\"description\":\"Bhagavad Gita Chapter 13 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 14\",\"Gita 13.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 14\",\"description\":\"Bhagavad Gita Chapter 13 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"सर्वतः पाणिपादं तत्सर्वतोऽक्षिशिरोमुखम् | सर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति ||१३-१४||\",\"verse\":{\"sanskrit\":\"सर्वतः पाणिपादं तत्सर्वतोऽक्षिशिरोमुखम् | सर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति ||१३-१४||\",\"translation\":\"13.14 With hands and feet everywhere, with eyes, heads and mouths everywhere, with ears everywhere, He exists in the worlds enveloping all.\",\"transliteration\":\"sarvataḥ pāṇipādaṃ tatsarvato.akṣiśiromukham . sarvataḥ śrutimalloke sarvamāvṛtya tiṣṭhati ||13-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 15\",\"description\":\"Bhagavad Gita Chapter 13 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 15\",\"description\":\"Bhagavad Gita Chapter 13 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 15\",\"Gita 13.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 15\",\"description\":\"Bhagavad Gita Chapter 13 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम् | असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च ||१३-१५||\",\"verse\":{\"sanskrit\":\"सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम् | असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च ||१३-१५||\",\"translation\":\"13.15 Shining by the functions of all the senses, yet without the senses; unattached, yet supporting all; devoid of alities, yet their experiencer.\",\"transliteration\":\"sarvendriyaguṇābhāsaṃ sarvendriyavivarjitam . asaktaṃ sarvabhṛccaiva nirguṇaṃ guṇabhoktṛ ca ||13-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 16\",\"description\":\"Bhagavad Gita Chapter 13 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 16\",\"description\":\"Bhagavad Gita Chapter 13 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 16\",\"Gita 13.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 16\",\"description\":\"Bhagavad Gita Chapter 13 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"बहिरन्तश्च भूतानामचरं चरमेव च | सूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत् ||१३-१६||\",\"verse\":{\"sanskrit\":\"बहिरन्तश्च भूतानामचरं चरमेव च | सूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत् ||१३-१६||\",\"translation\":\"13.16 Without and within (all) beings the unmoving and also the moving; because of Its subtlety, unknowable; and near and far away is That.\",\"transliteration\":\"bahirantaśca bhūtānāmacaraṃ carameva ca . sūkṣmatvāttadavijñeyaṃ dūrasthaṃ cāntike ca tat ||13-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 17\",\"description\":\"Bhagavad Gita Chapter 13 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 17\",\"description\":\"Bhagavad Gita Chapter 13 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 17\",\"Gita 13.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 17\",\"description\":\"Bhagavad Gita Chapter 13 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"अविभक्तं च भूतेषु विभक्तमिव च स्थितम् | भूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च ||१३-१७||\",\"verse\":{\"sanskrit\":\"अविभक्तं च भूतेषु विभक्तमिव च स्थितम् | भूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च ||१३-१७||\",\"translation\":\"13.17 And undivided, yet It exists as if divided in beings; It is to be known as the supporter of being; It devours and It generates.\",\"transliteration\":\"avibhaktaṃ ca bhūteṣu vibhaktamiva ca sthitam . bhūtabhartṛ ca tajjñeyaṃ grasiṣṇu prabhaviṣṇu ca ||13-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 18\",\"description\":\"Bhagavad Gita Chapter 13 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 18\",\"description\":\"Bhagavad Gita Chapter 13 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 18\",\"Gita 13.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 18\",\"description\":\"Bhagavad Gita Chapter 13 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"ज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते | ज्ञानं ज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम् ||१३-१८||\",\"verse\":{\"sanskrit\":\"ज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते | ज्ञानं ज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम् ||१३-१८||\",\"translation\":\"13.18 That, the Light of all lights, is said to be beyond darkness: knowledge, the knowable and the goal of knowledge, seated in the hearts of all.\",\"transliteration\":\"jyotiṣāmapi tajjyotistamasaḥ paramucyate . jñānaṃ jñeyaṃ jñānagamyaṃ hṛdi sarvasya viṣṭhitam ||13-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 19\",\"description\":\"Bhagavad Gita Chapter 13 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 19\",\"description\":\"Bhagavad Gita Chapter 13 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 19\",\"Gita 13.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 19\",\"description\":\"Bhagavad Gita Chapter 13 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"इति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः | मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते ||१३-१९||\",\"verse\":{\"sanskrit\":\"इति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः | मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते ||१३-१९||\",\"translation\":\"13.19 Thus the field, as well as knowledge and the knowable have been briefly stated. My devotee, knowing this, enters into My Being.\",\"transliteration\":\"iti kṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ . madbhakta etadvijñāya madbhāvāyopapadyate ||13-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 2\",\"description\":\"Bhagavad Gita Chapter 13 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 2\",\"description\":\"Bhagavad Gita Chapter 13 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 2\",\"Gita 13.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 2\",\"description\":\"Bhagavad Gita Chapter 13 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"श्रीभगवानुवाच | इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते | एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः ||१३-२||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते | एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः ||१३-२||\",\"translation\":\"13.2 The Blessed Lord said This body, O Arjuna, is called the field; he who knows it is called the knower of the field, by those who know of them.\",\"transliteration\":\"śrībhagavānuvāca . idaṃ śarīraṃ kaunteya kṣetramityabhidhīyate . etadyo vetti taṃ prāhuḥ kṣetrajña iti tadvidaḥ ||13-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 20\",\"description\":\"Bhagavad Gita Chapter 13 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 20\",\"description\":\"Bhagavad Gita Chapter 13 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 20\",\"Gita 13.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 20\",\"description\":\"Bhagavad Gita Chapter 13 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि | विकारांश्च गुणांश्चैव विद्धि प्रकृतिसम्भवान् ||१३-२०||\",\"verse\":{\"sanskrit\":\"प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि | विकारांश्च गुणांश्चैव विद्धि प्रकृतिसम्भवान् ||१३-२०||\",\"translation\":\"13.20 Know thou that Nature (matter) and the Spirit are both beginningless; and know also that all modifications and alities are born of Nature.\",\"transliteration\":\"prakṛtiṃ puruṣaṃ caiva viddhyanādi ubhāvapi . vikārāṃśca guṇāṃścaiva viddhi prakṛtisambhavān ||13-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 21\",\"description\":\"Bhagavad Gita Chapter 13 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 21\",\"description\":\"Bhagavad Gita Chapter 13 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 21\",\"Gita 13.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 21\",\"description\":\"Bhagavad Gita Chapter 13 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"कार्यकारणकर्तृत्वे हेतुः प्रकृतिरुच्यते | पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते ||१३-२१||\",\"verse\":{\"sanskrit\":\"कार्यकारणकर्तृत्वे हेतुः प्रकृतिरुच्यते | पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते ||१३-२१||\",\"translation\":\"13.21 In the production of the effect and the cause, Nature (matter) is said to be the cause; in the experience of pleasure and pain, the soul is said to be the cause.\",\"transliteration\":\"kāryakāraṇakartṛtve hetuḥ prakṛtirucyate . puruṣaḥ sukhaduḥkhānāṃ bhoktṛtve heturucyate ||13-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 22\",\"description\":\"Bhagavad Gita Chapter 13 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 22\",\"description\":\"Bhagavad Gita Chapter 13 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 22\",\"Gita 13.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 22\",\"description\":\"Bhagavad Gita Chapter 13 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान् | कारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु ||१३-२२||\",\"verse\":{\"sanskrit\":\"पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान् | कारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु ||१३-२२||\",\"translation\":\"13.22 The soul seated in Nature experiences the alities born of Nature; attachment to the alities is the cause of its birth in good and evil wombs.\",\"transliteration\":\"puruṣaḥ prakṛtistho hi bhuṅkte prakṛtijānguṇān . kāraṇaṃ guṇasaṅgo.asya sadasadyonijanmasu ||13-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 23\",\"description\":\"Bhagavad Gita Chapter 13 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 23\",\"description\":\"Bhagavad Gita Chapter 13 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 23\",\"Gita 13.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 23\",\"description\":\"Bhagavad Gita Chapter 13 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"उपद्रष्टानुमन्ता च भर्ता भोक्ता महेश्वरः | परमात्मेति चाप्युक्तो देहेऽस्मिन्पुरुषः परः ||१३-२३||\",\"verse\":{\"sanskrit\":\"उपद्रष्टानुमन्ता च भर्ता भोक्ता महेश्वरः | परमात्मेति चाप्युक्तो देहेऽस्मिन्पुरुषः परः ||१३-२३||\",\"translation\":\"13.23 The Supreme Soul in this body is also called the spectator, the permitter, the supporter, the enjoyer, the great Lord and the Supreme Self.\",\"transliteration\":\"upadraṣṭānumantā ca bhartā bhoktā maheśvaraḥ . paramātmeti cāpyukto dehe.asminpuruṣaḥ paraḥ ||13-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 24\",\"description\":\"Bhagavad Gita Chapter 13 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 24\",\"description\":\"Bhagavad Gita Chapter 13 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 24\",\"Gita 13.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 24\",\"description\":\"Bhagavad Gita Chapter 13 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"य एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह | सर्वथा वर्तमानोऽपि न स भूयोऽभिजायते ||१३-२४||\",\"verse\":{\"sanskrit\":\"य एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह | सर्वथा वर्तमानोऽपि न स भूयोऽभिजायते ||१३-२४||\",\"translation\":\"13.24 He who thus knows the Spirit and Matter together with the alities, in whatever condition he may be, he is not born again.\",\"transliteration\":\"ya evaṃ vetti puruṣaṃ prakṛtiṃ ca guṇaiḥ saha . sarvathā vartamāno.api na sa bhūyo.abhijāyate ||13-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 25\",\"description\":\"Bhagavad Gita Chapter 13 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 25\",\"description\":\"Bhagavad Gita Chapter 13 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 25\",\"Gita 13.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 25\",\"description\":\"Bhagavad Gita Chapter 13 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"ध्यानेनात्मनि पश्यन्ति केचिदात्मानमात्मना | अन्ये साङ्ख्येन योगेन कर्मयोगेन चापरे ||१३-२५||\",\"verse\":{\"sanskrit\":\"ध्यानेनात्मनि पश्यन्ति केचिदात्मानमात्मना | अन्ये साङ्ख्येन योगेन कर्मयोगेन चापरे ||१३-२५||\",\"translation\":\"13.25 Some by meditation behold the Self in the self by the self, others by the Yoga of knowledge, and still others by the Yoga of action.\",\"transliteration\":\"dhyānenātmani paśyanti kecidātmānamātmanā . anye sāṅkhyena yogena karmayogena cāpare ||13-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 26\",\"description\":\"Bhagavad Gita Chapter 13 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 26\",\"description\":\"Bhagavad Gita Chapter 13 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 26\",\"Gita 13.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 26\",\"description\":\"Bhagavad Gita Chapter 13 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"अन्ये त्वेवमजानन्तः श्रुत्वान्येभ्य उपासते | तेऽपि चातितरन्त्येव मृत्युं श्रुतिपरायणाः ||१३-२६||\",\"verse\":{\"sanskrit\":\"अन्ये त्वेवमजानन्तः श्रुत्वान्येभ्य उपासते | तेऽपि चातितरन्त्येव मृत्युं श्रुतिपरायणाः ||१३-२६||\",\"translation\":\"13.26 Others also, not knowing thus, worship, having heard of It from others; they, too, cross beyond death, regarding what they have heard as the Supreme refuge.\",\"transliteration\":\"anye tvevamajānantaḥ śrutvānyebhya upāsate . te.api cātitarantyeva mṛtyuṃ śrutiparāyaṇāḥ ||13-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 27\",\"description\":\"Bhagavad Gita Chapter 13 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 27\",\"description\":\"Bhagavad Gita Chapter 13 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 27\",\"Gita 13.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 27\",\"description\":\"Bhagavad Gita Chapter 13 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"यावत्सञ्जायते किञ्चित्सत्त्वं स्थावरजङ्गमम् | क्षेत्रक्षेत्रज्ञसंयोगात्तद्विद्धि भरतर्षभ ||१३-२७||\",\"verse\":{\"sanskrit\":\"यावत्सञ्जायते किञ्चित्सत्त्वं स्थावरजङ्गमम् | क्षेत्रक्षेत्रज्ञसंयोगात्तद्विद्धि भरतर्षभ ||१३-२७||\",\"translation\":\"13.27 Wherever a being is born, whether unmoving or moving, know thou, O best of the Bharatas (Arjuna), that it is from the union between the field and its knower.\",\"transliteration\":\"yāvatsañjāyate kiñcitsattvaṃ sthāvarajaṅgamam . kṣetrakṣetrajñasaṃyogāttadviddhi bharatarṣabha ||13-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 28\",\"description\":\"Bhagavad Gita Chapter 13 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 28\",\"description\":\"Bhagavad Gita Chapter 13 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 28\",\"Gita 13.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 28\",\"description\":\"Bhagavad Gita Chapter 13 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् | विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति ||१३-२८||\",\"verse\":{\"sanskrit\":\"समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् | विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति ||१३-२८||\",\"translation\":\"13.28 He sees, who sees the Supreme Lord, existing eally in all beings, the unperishing within the perishing.\",\"transliteration\":\"samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram . vinaśyatsvavinaśyantaṃ yaḥ paśyati sa paśyati ||13-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 29\",\"description\":\"Bhagavad Gita Chapter 13 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 29\",\"description\":\"Bhagavad Gita Chapter 13 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 29\",\"Gita 13.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 29\",\"description\":\"Bhagavad Gita Chapter 13 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"समं पश्यन्हि सर्वत्र समवस्थितमीश्वरम् | न हिनस्त्यात्मनात्मानं ततो याति परां गतिम् ||१३-२९||\",\"verse\":{\"sanskrit\":\"समं पश्यन्हि सर्वत्र समवस्थितमीश्वरम् | न हिनस्त्यात्मनात्मानं ततो याति परां गतिम् ||१३-२९||\",\"translation\":\"13.29 Because he who sees the same Lord eally dwelling everywhere does not destroy the Self by the self; he goes to the highest goal.\",\"transliteration\":\"samaṃ paśyanhi sarvatra samavasthitamīśvaram . na hinastyātmanātmānaṃ tato yāti parāṃ gatim ||13-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 3\",\"description\":\"Bhagavad Gita Chapter 13 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 3\",\"description\":\"Bhagavad Gita Chapter 13 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 3\",\"Gita 13.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 3\",\"description\":\"Bhagavad Gita Chapter 13 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत | क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम ||१३-३||\",\"verse\":{\"sanskrit\":\"क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत | क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम ||१३-३||\",\"translation\":\"13.3 Do thou also know Me as the knower of the field in all fields, O Arjuna. Knowledge of both the field and the knower of the field is considered by Me to be ï1the ï1 knowledge.\",\"transliteration\":\"kṣetrajñaṃ cāpi māṃ viddhi sarvakṣetreṣu bhārata . kṣetrakṣetrajñayorjñānaṃ yattajjñānaṃ mataṃ mama ||13-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 30\",\"description\":\"Bhagavad Gita Chapter 13 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 30\",\"description\":\"Bhagavad Gita Chapter 13 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 30\",\"Gita 13.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 30\",\"description\":\"Bhagavad Gita Chapter 13 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"प्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः | यः पश्यति तथात्मानमकर्तारं स पश्यति ||१३-३०||\",\"verse\":{\"sanskrit\":\"प्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः | यः पश्यति तथात्मानमकर्तारं स पश्यति ||१३-३०||\",\"translation\":\"13.30 He sees, who sees that all actions are performed by Nature alone and that the Self is actionless.\",\"transliteration\":\"prakṛtyaiva ca karmāṇi kriyamāṇāni sarvaśaḥ . yaḥ paśyati tathātmānamakartāraṃ sa paśyati ||13-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 31\",\"description\":\"Bhagavad Gita Chapter 13 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 31\",\"description\":\"Bhagavad Gita Chapter 13 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 31\",\"Gita 13.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 31\",\"description\":\"Bhagavad Gita Chapter 13 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"यदा भूतपृथग्भावमेकस्थमनुपश्यति | तत एव च विस्तारं ब्रह्म सम्पद्यते तदा ||१३-३१||\",\"verse\":{\"sanskrit\":\"यदा भूतपृथग्भावमेकस्थमनुपश्यति | तत एव च विस्तारं ब्रह्म सम्पद्यते तदा ||१३-३१||\",\"translation\":\"13.31 When a man sees the whole variety of beings as resting in the One, and spreading forth from That alone, he then becomes Brahman.\",\"transliteration\":\"yadā bhūtapṛthagbhāvamekasthamanupaśyati . tata eva ca vistāraṃ brahma sampadyate tadā ||13-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 32\",\"description\":\"Bhagavad Gita Chapter 13 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 32\",\"description\":\"Bhagavad Gita Chapter 13 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 32\",\"Gita 13.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 32\",\"description\":\"Bhagavad Gita Chapter 13 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"अनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः | शरीरस्थोऽपि कौन्तेय न करोति न लिप्यते ||१३-३२||\",\"verse\":{\"sanskrit\":\"अनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः | शरीरस्थोऽपि कौन्तेय न करोति न लिप्यते ||१३-३२||\",\"translation\":\"13.32 Being without beginning and being devoid of (any) alities, the Supreme Self, imperishable, though dwelling in the body, O Arjuna, neither acts nor is tainted.\",\"transliteration\":\"anāditvānnirguṇatvātparamātmāyamavyayaḥ . śarīrastho.api kaunteya na karoti na lipyate ||13-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 33\",\"description\":\"Bhagavad Gita Chapter 13 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 33\",\"description\":\"Bhagavad Gita Chapter 13 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-33\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 33\",\"Gita 13.33\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-33\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 33\",\"description\":\"Bhagavad Gita Chapter 13 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-33\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"यथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते | सर्वत्रावस्थितो देहे तथात्मा नोपलिप्यते ||१३-३३||\",\"verse\":{\"sanskrit\":\"यथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते | सर्वत्रावस्थितो देहे तथात्मा नोपलिप्यते ||१३-३३||\",\"translation\":\"13.33 As the all-pervading ether is not tainted, because of its subtlety, so the Self seated everywhere in the body is not tainted.\",\"transliteration\":\"yathā sarvagataṃ saukṣmyādākāśaṃ nopalipyate . sarvatrāvasthito dehe tathātmā nopalipyate ||13-33||\"}}},\"verse34\":{\"verse34\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 34\",\"description\":\"Bhagavad Gita Chapter 13 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 34\",\"description\":\"Bhagavad Gita Chapter 13 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-34\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 34\",\"Gita 13.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 34\",\"description\":\"Bhagavad Gita Chapter 13 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः | क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत ||१३-३४||\",\"verse\":{\"sanskrit\":\"यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः | क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत ||१३-३४||\",\"translation\":\"13.34 Just as the one sun illumines the whole world, so also the Lord of the field (Supreme Self) illumines the whole field, O Arjuna.\",\"transliteration\":\"yathā prakāśayatyekaḥ kṛtsnaṃ lokamimaṃ raviḥ . kṣetraṃ kṣetrī tathā kṛtsnaṃ prakāśayati bhārata ||13-34||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 4\",\"description\":\"Bhagavad Gita Chapter 13 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 4\",\"description\":\"Bhagavad Gita Chapter 13 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 4\",\"Gita 13.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-4\"},\"introduction\":\"$55\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 4\",\"description\":\"Bhagavad Gita Chapter 13 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-4\"},\"philosophical_explanation\":\"$56\",\"scripture_text\":\"तत्क्षेत्रं यच्च यादृक्च यद्विकारि यतश्च यत् | स च यो यत्प्रभावश्च तत्समासेन मे शृणु ||१३-४||\",\"verse\":{\"sanskrit\":\"तत्क्षेत्रं यच्च यादृक्च यद्विकारि यतश्च यत् | स च यो यत्प्रभावश्च तत्समासेन मे शृणु ||१३-४||\",\"translation\":\"13.4 What the field is and of what nature, what are its modifications and whence it is and also who He is and what His powers are hear all that from Me in brief.\",\"transliteration\":\"tatkṣetraṃ yacca yādṛkca yadvikāri yataśca yat . sa ca yo yatprabhāvaśca tatsamāsena me śṛṇu ||13-4||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 5\",\"description\":\"Bhagavad Gita Chapter 13 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 5\",\"description\":\"Bhagavad Gita Chapter 13 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 5\",\"Gita 13.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-5\"},\"introduction\":\"$57\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 5\",\"description\":\"Bhagavad Gita Chapter 13 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-5\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"ऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः पृथक् | ब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्चितैः ||१३-५||\",\"verse\":{\"sanskrit\":\"ऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः पृथक् | ब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्चितैः ||१३-५||\",\"translation\":\"13.5 Sages have sung in many ways, in various distinctive chants and also in the suggestive words indicative of the Absolute, full of reasoning and decisive.\",\"transliteration\":\"ṛṣibhirbahudhā gītaṃ chandobhirvividhaiḥ pṛthak . brahmasūtrapadaiścaiva hetumadbhirviniścitaiḥ ||13-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 6\",\"description\":\"Bhagavad Gita Chapter 13 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 6\",\"description\":\"Bhagavad Gita Chapter 13 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 13 Verse 6\",\"Gita 13.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-6\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 13 Verse 6\",\"description\":\"Bhagavad Gita Chapter 13 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-13/verse-6\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"महाभूतान्यहंकारो बुद्धिरव्यक्तमेव च | इन्द्रियाणि दशैकं च पञ्च चेन्द्रियगोचराः ||१३-६||\",\"verse\":{\"sanskrit\":\"महाभूतान्यहंकारो बुद्धिरव्यक्तमेव च | इन्द्रियाणि दशैकं च पञ्च चेन्द्रियगोचराः ||१३-६||\",\"translation\":\"13.6 Th
