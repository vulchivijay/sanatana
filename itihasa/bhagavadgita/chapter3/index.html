and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः | आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते ||३-१७||\",\"verse\":{\"sanskrit\":\"यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः | आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते ||३-१७||\",\"translation\":\"3.17 But for that man who rejoices only in the Self, who is satisfied with the Self and who is content in the Self alone, verily there is nothing to do.\",\"transliteration\":\"yastvātmaratireva syādātmatṛptaśca mānavaḥ . ātmanyeva ca santuṣṭastasya kāryaṃ na vidyate ||3-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 18\",\"description\":\"Bhagavad Gita Chapter 3 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 18\",\"description\":\"Bhagavad Gita Chapter 3 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 18\",\"Gita 3.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 18\",\"description\":\"Bhagavad Gita Chapter 3 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन | न चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः ||३-१८||\",\"verse\":{\"sanskrit\":\"नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन | न चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः ||३-१८||\",\"translation\":\"3.18 For him there is no interest whatever in what is done or what is not done; nor does he depend on any being for any object.\",\"transliteration\":\"naiva tasya kṛtenārtho nākṛteneha kaścana . na cāsya sarvabhūteṣu kaścidarthavyapāśrayaḥ ||3-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 19\",\"description\":\"Bhagavad Gita Chapter 3 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 19\",\"description\":\"Bhagavad Gita Chapter 3 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 19\",\"Gita 3.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 19\",\"description\":\"Bhagavad Gita Chapter 3 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"तस्मादसक्तः सततं कार्यं कर्म समाचर | असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः ||३-१९||\",\"verse\":{\"sanskrit\":\"तस्मादसक्तः सततं कार्यं कर्म समाचर | असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः ||३-१९||\",\"translation\":\"3.19 Therefore without attachment, do thou always perform action which should be done; for by performing action without attachment man reaches the Supreme.\",\"transliteration\":\"tasmādasaktaḥ satataṃ kāryaṃ karma samācara . asakto hyācarankarma paramāpnoti pūruṣaḥ ||3-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 2\",\"description\":\"Bhagavad Gita Chapter 3 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 2\",\"description\":\"Bhagavad Gita Chapter 3 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 2\",\"Gita 3.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 2\",\"description\":\"Bhagavad Gita Chapter 3 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे | तदेकं वद निश्चित्य येन श्रेयोऽहमाप्नुयाम् ||३-२||\",\"verse\":{\"sanskrit\":\"व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे | तदेकं वद निश्चित्य येन श्रेयोऽहमाप्नुयाम् ||३-२||\",\"translation\":\"3.2 With this apparently perplexing speech, Thou confusest, as it were, my understanding; therefore tell me that one way for certain by which I may attain bliss.\",\"transliteration\":\"vyāmiśreṇeva vākyena buddhiṃ mohayasīva me . tadekaṃ vada niścitya yena śreyo.ahamāpnuyām ||3-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 20\",\"description\":\"Bhagavad Gita Chapter 3 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 20\",\"description\":\"Bhagavad Gita Chapter 3 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 20\",\"Gita 3.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 20\",\"description\":\"Bhagavad Gita Chapter 3 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"कर्मणैव हि संसिद्धिमास्थिता जनकादयः | लोकसंग्रहमेवापि सम्पश्यन्कर्तुमर्हसि ||३-२०||\",\"verse\":{\"sanskrit\":\"कर्मणैव हि संसिद्धिमास्थिता जनकादयः | लोकसंग्रहमेवापि सम्पश्यन्कर्तुमर्हसि ||३-२०||\",\"translation\":\"3.20 Janaka and others attained perfection verily by action only; even with a view to the protection of the masses thou shouldst perform action.\",\"transliteration\":\"karmaṇaiva hi saṃsiddhimāsthitā janakādayaḥ . lokasaṃgrahamevāpi sampaśyankartumarhasi ||3-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 21\",\"description\":\"Bhagavad Gita Chapter 3 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 21\",\"description\":\"Bhagavad Gita Chapter 3 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 21\",\"Gita 3.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 21\",\"description\":\"Bhagavad Gita Chapter 3 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः | स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते ||३-२१||\",\"verse\":{\"sanskrit\":\"यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः | स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते ||३-२१||\",\"translation\":\"3.21 Whatsoever a great man does, that the other men also do; whatever he sets up as the standard, that the world (mankind) follows.\",\"transliteration\":\"yadyadācarati śreṣṭhastattadevetaro janaḥ . sa yatpramāṇaṃ kurute lokastadanuvartate ||3-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 22\",\"description\":\"Bhagavad Gita Chapter 3 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 22\",\"description\":\"Bhagavad Gita Chapter 3 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 22\",\"Gita 3.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 22\",\"description\":\"Bhagavad Gita Chapter 3 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन | नानवाप्तमवाप्तव्यं वर्त एव च कर्मणि ||३-२२||\",\"verse\":{\"sanskrit\":\"न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन | नानवाप्तमवाप्तव्यं वर्त एव च कर्मणि ||३-२२||\",\"translation\":\"3.22 There is nothing in the three worlds, O Arjuna, that should be done by Me, nor is there anything unattained that should be attained; yet I engage Myself in action.\",\"transliteration\":\"na me pārthāsti kartavyaṃ triṣu lokeṣu kiñcana . nānavāptamavāptavyaṃ varta eva ca karmaṇi ||3-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 23\",\"description\":\"Bhagavad Gita Chapter 3 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 23\",\"description\":\"Bhagavad Gita Chapter 3 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 23\",\"Gita 3.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 23\",\"description\":\"Bhagavad Gita Chapter 3 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"यदि ह्यहं न वर्तेयं जातु कर्मण्यतन्द्रितः | मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः ||३-२३||\",\"verse\":{\"sanskrit\":\"यदि ह्यहं न वर्तेयं जातु कर्मण्यतन्द्रितः | मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः ||३-२३||\",\"translation\":\"3.23 For, should I not ever engage Myself in action, unwearied, men would in every way follow My path, O Arjuna.\",\"transliteration\":\"yadi hyahaṃ na varteyaṃ jātu karmaṇyatandritaḥ . mama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ ||3-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 24\",\"description\":\"Bhagavad Gita Chapter 3 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 24\",\"description\":\"Bhagavad Gita Chapter 3 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 24\",\"Gita 3.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 24\",\"description\":\"Bhagavad Gita Chapter 3 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम् | सङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः ||३-२४||\",\"verse\":{\"sanskrit\":\"उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम् | सङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः ||३-२४||\",\"translation\":\"3.24 These worlds would perish if I did not perform action; I should be the author of confusion of castes and destruction of these beings.\",\"transliteration\":\"utsīdeyurime lokā na kuryāṃ karma cedaham . saṅkarasya ca kartā syāmupahanyāmimāḥ prajāḥ ||3-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 25\",\"description\":\"Bhagavad Gita Chapter 3 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 25\",\"description\":\"Bhagavad Gita Chapter 3 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 25\",\"Gita 3.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 25\",\"description\":\"Bhagavad Gita Chapter 3 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत | कुर्याद्विद्वांस्तथासक्तश्चिकीर्षुर्लोकसंग्रहम् ||३-२५||\",\"verse\":{\"sanskrit\":\"सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत | कुर्याद्विद्वांस्तथासक्तश्चिकीर्षुर्लोकसंग्रहम् ||३-२५||\",\"translation\":\"3.25 As the ignorant men act from attachment to action, O Bharata (Arjuna), so should the wise act without attachment, wishing the welfare of the world.\",\"transliteration\":\"saktāḥ karmaṇyavidvāṃso yathā kurvanti bhārata . kuryādvidvāṃstathāsaktaścikīrṣurlokasaṃgraham ||3-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 26\",\"description\":\"Bhagavad Gita Chapter 3 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 26\",\"description\":\"Bhagavad Gita Chapter 3 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 26\",\"Gita 3.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 26\",\"description\":\"Bhagavad Gita Chapter 3 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम् | जोषयेत्सर्वकर्माणि विद्वान्युक्तः समाचरन् ||३-२६||\",\"verse\":{\"sanskrit\":\"न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम् | जोषयेत्सर्वकर्माणि विद्वान्युक्तः समाचरन् ||३-२६||\",\"translation\":\"3.26 Let no wise man unsettle the mind of ignorant people who are attached to action; he should engage them in all actions, himself fulfilling them with devotion.\",\"transliteration\":\"na buddhibhedaṃ janayedajñānāṃ karmasaṅginām . joṣayetsarvakarmāṇi vidvānyuktaḥ samācaran ||3-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 27\",\"description\":\"Bhagavad Gita Chapter 3 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 27\",\"description\":\"Bhagavad Gita Chapter 3 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 27\",\"Gita 3.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 27\",\"description\":\"Bhagavad Gita Chapter 3 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः | अहङ्कारविमूढात्मा कर्ताहमिति मन्यते ||३-२७||\",\"verse\":{\"sanskrit\":\"प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः | अहङ्कारविमूढात्मा कर्ताहमिति मन्यते ||३-२७||\",\"translation\":\"3.27 All actions are wrought in all cases by the alities of Nature only. He whose mind is deluded by egoism thinks, \\\"I am the doer.\\\"\",\"transliteration\":\"prakṛteḥ kriyamāṇāni guṇaiḥ karmāṇi sarvaśaḥ . ahaṅkāravimūḍhātmā kartāhamiti manyate ||3-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 28\",\"description\":\"Bhagavad Gita Chapter 3 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 28\",\"description\":\"Bhagavad Gita Chapter 3 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 28\",\"Gita 3.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 28\",\"description\":\"Bhagavad Gita Chapter 3 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः | गुणा गुणेषु वर्तन्त इति मत्वा न सज्जते ||३-२८||\",\"verse\":{\"sanskrit\":\"तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः | गुणा गुणेषु वर्तन्त इति मत्वा न सज्जते ||३-२८||\",\"translation\":\"3.28 But he who knows the Truth, O mighty-armed (Arjuna), about the divisions of the alities and (their) functions, knowing that the Gunas as senses move amidst the Gunas as the sense-objects, is not attached.\",\"transliteration\":\"tattvavittu mahābāho guṇakarmavibhāgayoḥ . guṇā guṇeṣu vartanta iti matvā na sajjate ||3-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 29\",\"description\":\"Bhagavad Gita Chapter 3 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 29\",\"description\":\"Bhagavad Gita Chapter 3 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 29\",\"Gita 3.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 29\",\"description\":\"Bhagavad Gita Chapter 3 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"प्रकृतेर्गुणसम्मूढाः सज्जन्ते गुणकर्मसु | तानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत् ||३-२९||\",\"verse\":{\"sanskrit\":\"प्रकृतेर्गुणसम्मूढाः सज्जन्ते गुणकर्मसु | तानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत् ||३-२९||\",\"translation\":\"3.29 Those deluded by the alities of Nature are attached to the functions of the alities. The man of perfect knowledge should not unsettle the foolish one who is of imperfect knowledge.\",\"transliteration\":\"prakṛterguṇasammūḍhāḥ sajjante guṇakarmasu . tānakṛtsnavido mandānkṛtsnavinna vicālayet ||3-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 3\",\"description\":\"Bhagavad Gita Chapter 3 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 3\",\"description\":\"Bhagavad Gita Chapter 3 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 3\",\"Gita 3.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 3\",\"description\":\"Bhagavad Gita Chapter 3 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"श्रीभगवानुवाच | लोकेऽस्मिन् द्विविधा निष्ठा पुरा प्रोक्ता मयानघ | ज्ञानयोगेन साङ्ख्यानां कर्मयोगेन योगिनाम् ||३-३||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | लोकेऽस्मिन् द्विविधा निष्ठा पुरा प्रोक्ता मयानघ | ज्ञानयोगेन साङ्ख्यानां कर्मयोगेन योगिनाम् ||३-३||\",\"translation\":\"3.3 The Blessed Lord said In this world there is a twofold path, as I said before, O sinless one; the path of knowledge of the Sankhyas and the path of action of the Yogins.\",\"transliteration\":\"śrībhagavānuvāca . loke.asmina dvividhā niṣṭhā purā proktā mayānagha . jñānayogena sāṅkhyānāṃ karmayogena yoginām ||3-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 30\",\"description\":\"Bhagavad Gita Chapter 3 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 30\",\"description\":\"Bhagavad Gita Chapter 3 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 30\",\"Gita 3.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 30\",\"description\":\"Bhagavad Gita Chapter 3 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा | निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः ||३-३०||\",\"verse\":{\"sanskrit\":\"मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा | निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः ||३-३०||\",\"translation\":\"3.30 Renouncing all actions in Me, with the mind centred in the Self, free from hope and egoism, and from (mental) fever, do thou fight.\",\"transliteration\":\"mayi sarvāṇi karmāṇi saṃnyasyādhyātmacetasā . nirāśīrnirmamo bhūtvā yudhyasva vigatajvaraḥ ||3-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 31\",\"description\":\"Bhagavad Gita Chapter 3 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 31\",\"description\":\"Bhagavad Gita Chapter 3 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 31\",\"Gita 3.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 31\",\"description\":\"Bhagavad Gita Chapter 3 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"ये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः | श्रद्धावन्तोऽनसूयन्तो मुच्यन्ते तेऽपि कर्मभिः ||३-३१||\",\"verse\":{\"sanskrit\":\"ये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः | श्रद्धावन्तोऽनसूयन्तो मुच्यन्ते तेऽपि कर्मभिः ||३-३१||\",\"translation\":\"3.31 Those men who constantly practise this teaching of Mine with faith and without cavilling, they too are freed from actions.\",\"transliteration\":\"ye me matamidaṃ nityamanutiṣṭhanti mānavāḥ . śraddhāvanto.anasūyanto mucyante te.api karmabhiḥ ||3-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 32\",\"description\":\"Bhagavad Gita Chapter 3 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 32\",\"description\":\"Bhagavad Gita Chapter 3 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 32\",\"Gita 3.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 32\",\"description\":\"Bhagavad Gita Chapter 3 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"ये त्वेतदभ्यसूयन्तो नानुतिष्ठन्ति मे मतम् | सर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः ||३-३२||\",\"verse\":{\"sanskrit\":\"ये त्वेतदभ्यसूयन्तो नानुतिष्ठन्ति मे मतम् | सर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः ||३-३२||\",\"translation\":\"3.32 But those who carp at My teaching and do not practise it, deluded of all knowledge, and devoid of discrimination, know them to be doomed to destruction.\",\"transliteration\":\"ye tvetadabhyasūyanto nānutiṣṭhanti me matam . sarvajñānavimūḍhāṃstānviddhi naṣṭānacetasaḥ ||3-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 33\",\"description\":\"Bhagavad Gita Chapter 3 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 33\",\"description\":\"Bhagavad Gita Chapter 3 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-33\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 33\",\"Gita 3.33\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-33\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 33\",\"description\":\"Bhagavad Gita Chapter 3 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-33\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि | प्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति ||३-३३||\",\"verse\":{\"sanskrit\":\"सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि | प्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति ||३-३३||\",\"translation\":\"3.33 Even a wise man acts in accordance with his own nature; beings will follow Nature; what can restraint do?\",\"transliteration\":\"sadṛśaṃ ceṣṭate svasyāḥ prakṛterjñānavānapi . prakṛtiṃ yānti bhūtāni nigrahaḥ kiṃ kariṣyati ||3-33||\"}}},\"verse34\":{\"verse34\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 34\",\"description\":\"Bhagavad Gita Chapter 3 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 34\",\"description\":\"Bhagavad Gita Chapter 3 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-34\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 34\",\"Gita 3.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 34\",\"description\":\"Bhagavad Gita Chapter 3 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ | तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ ||३-३४||\",\"verse\":{\"sanskrit\":\"इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ | तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ ||३-३४||\",\"translation\":\"3.34 Attachment and aversion for the objects of the senses abide in the senses; let none come under their sway; for, they are his foes.\",\"transliteration\":\"indriyasyendriyasyārthe rāgadveṣau vyavasthitau . tayorna vaśamāgacchettau hyasya paripanthinau ||3-34||\"}}},\"verse35\":{\"verse35\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 35\",\"description\":\"Bhagavad Gita Chapter 3 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 35\",\"description\":\"Bhagavad Gita Chapter 3 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-35\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 35\",\"Gita 3.35\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-35\"},\"introduction\":\"$55\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 35\",\"description\":\"Bhagavad Gita Chapter 3 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-35\"},\"philosophical_explanation\":\"$56\",\"scripture_text\":\"श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् | स्वधर्मे निधनं श्रेयः परधर्मो भयावहः ||३-३५||\",\"verse\":{\"sanskrit\":\"श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् | स्वधर्मे निधनं श्रेयः परधर्मो भयावहः ||३-३५||\",\"translation\":\"3.35 Better is one's own duty, though devoid of merit than the duty of another well discharged. Better is death in one's own duty; the duty of another is fraught with fear (is productive of danger).\",\"transliteration\":\"śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt . svadharme nidhanaṃ śreyaḥ paradharmo bhayāvahaḥ ||3-35||\"}}},\"verse36\":{\"verse36\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 36\",\"description\":\"Bhagavad Gita Chapter 3 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 36\",\"description\":\"Bhagavad Gita Chapter 3 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-36\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 36\",\"Gita 3.36\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-36\"},\"introduction\":\"$57\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 36\",\"description\":\"Bhagavad Gita Chapter 3 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-36\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"अर्जुन उवाच | अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः | अनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः ||३-३६||\",\"verse\":{\"sanskrit\":\"अर्जुन उवाच | अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः | अनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः ||३-३६||\",\"translation\":\"3.36 Arjuna said But impelled by what does man commit sin, though against his wishes, O Varshneya (Krishna), constrained as it were, by force?\",\"transliteration\":\"arjuna uvāca . atha kena prayukto.ayaṃ pāpaṃ carati pūruṣaḥ . anicchannapi vārṣṇeya balādiva niyojitaḥ ||3-36||\"}}},\"verse37\":{\"verse37\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 37\",\"description\":\"Bhagavad Gita Chapter 3 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 37\",\"description\":\"Bhagavad Gita Chapter 3 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-37\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 37\",\"Gita 3.37\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-37\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 37\",\"description\":\"Bhagavad Gita Chapter 3 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-37\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"श्रीभगवानुवाच | काम एष क्रोध एष रजोगुणसमुद्भवः | महाशनो महापाप्मा विद्ध्येनमिह वैरिणम् ||३-३७||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | काम एष क्रोध एष रजोगुणसमुद्भवः | महाशनो महापाप्मा विद्ध्येनमिह वैरिणम् ||३-३७||\",\"translation\":\"3.37 The Blessed Lord said It is desire, it is anger both of the ality of Rajas, all-devouring, all-sinful; know this as the foe here (in this world).\",\"transliteration\":\"śrībhagavānuvāca . kāma eṣa krodha eṣa rajoguṇasamudbhavaḥ . mahāśano mahāpāpmā viddhyenamiha vairiṇam ||3-37||\"}}},\"verse38\":{\"verse38\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 38\",\"description\":\"Bhagavad Gita Chapter 3 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 38\",\"description\":\"Bhagavad Gita Chapter 3 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-38\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 38\",\"Gita 3.38\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-38\"},\"introduction\":\"$5b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 38\",\"description\":\"Bhagavad Gita Chapter 3 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-38\"},\"philosophical_explanation\":\"$5c\",\"scripture_text\":\"धूमेनाव्रियते वह्निर्यथादर्शो मलेन च | यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम् ||३-३८||\",\"verse\":{\"sanskrit\":\"धूमेनाव्रियते वह्निर्यथादर्शो मलेन च | यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम् ||३-३८||\",\"translation\":\"3.38 As fire is enveloped by smoke, as a mirror by dust, and as an embryo by the amnion, so is this enveloped by that.\",\"transliteration\":\"dhūmenāvriyate vahniryathādarśo malena ca . yatholbenāvṛto garbhastathā tenedamāvṛtam ||3-38||\"}}},\"verse39\":{\"verse39\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 39\",\"description\":\"Bhagavad Gita Chapter 3 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 39\",\"description\":\"Bhagavad Gita Chapter 3 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-39\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 39\",\"Gita 3.39\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-39\"},\"introduction\":\"$5d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 39\",\"description\":\"Bhagavad Gita Chapter 3 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-39\"},\"philosophical_explanation\":\"$5e\",\"scripture_text\":\"आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा | कामरूपेण कौन्तेय दुष्पूरेणानलेन च ||३-३९||\",\"verse\":{\"sanskrit\":\"आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा | कामरूपेण कौन्तेय दुष्पूरेणानलेन च ||३-३९||\",\"translation\":\"3.39 O Arjuna, wisdom is enveloped by this constant enemy of the wise in the form of desire, which is unappeasable as fire.\",\"transliteration\":\"āvṛtaṃ jñānametena jñānino nityavairiṇā . kāmarūpeṇa kaunteya duṣpūreṇānalena ca ||3-39||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 4\",\"description\":\"Bhagavad Gita Chapter 3 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 4\",\"description\":\"Bhagavad Gita Chapter 3 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 4\",\"Gita 3.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-4\"},\"introduction\":\"$5f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 4\",\"description\":\"Bhagavad Gita Chapter 3 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-4\"},\"philosophical_explanation\":\"$60\",\"scripture_text\":\"न कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते | न च संन्यसनादेव सिद्धिं समधिगच्छति ||३-४||\",\"verse\":{\"sanskrit\":\"न कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते | न च संन्यसनादेव सिद्धिं समधिगच्छति ||३-४||\",\"translation\":\"3.4 Not by non-performance of actions does man reach actionlessness; nor by mere renunciation does he attain to perfection.\",\"transliteration\":\"na karmaṇāmanārambhānnaiṣkarmyaṃ puruṣo.aśnute . na ca saṃnyasanādeva siddhiṃ samadhigacchati ||3-4||\"}}},\"verse40\":{\"verse40\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 40\",\"description\":\"Bhagavad Gita Chapter 3 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 40\",\"description\":\"Bhagavad Gita Chapter 3 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-40\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 40\",\"Gita 3.40\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-40\"},\"introduction\":\"$61\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 40\",\"description\":\"Bhagavad Gita Chapter 3 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-40\"},\"philosophical_explanation\":\"$62\",\"scripture_text\":\"इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते | एतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम् ||३-४०||\",\"verse\":{\"sanskrit\":\"इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते | एतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम् ||३-४०||\",\"translation\":\"3.40 The senses, the mind and the intellect are said to be its seat; through these it deludes the embodied by veiling his wisdom.\",\"transliteration\":\"indriyāṇi mano buddhirasyādhiṣṭhānamucyate . etairvimohayatyeṣa jñānamāvṛtya dehinam ||3-40||\"}}},\"verse41\":{\"verse41\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 41\",\"description\":\"Bhagavad Gita Chapter 3 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 41\",\"description\":\"Bhagavad Gita Chapter 3 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-41\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 41\",\"Gita 3.41\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-41\"},\"introduction\":\"$63\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 41\",\"description\":\"Bhagavad Gita Chapter 3 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-41\"},\"philosophical_explanation\":\"$64\",\"scripture_text\":\"तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ | पाप्मानं प्रजहि ह्येनं ज्ञानविज्ञाननाशनम् ||३-४१||\",\"verse\":{\"sanskrit\":\"तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ | पाप्मानं प्रजहि ह्येनं ज्ञानविज्ञाननाशनम् ||३-४१||\",\"translation\":\"3.41 Therefore, O best of the Bharatas (Arjuna), controlling the senses first, do thou kill this sinful thing, the destroyer of knowledge and realisation.\",\"transliteration\":\"tasmāttvamindriyāṇyādau niyamya bharatarṣabha . pāpmānaṃ prajahi hyenaṃ jñānavijñānanāśanam ||3-41||\"}}},\"verse42\":{\"verse42\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 42\",\"description\":\"Bhagavad Gita Chapter 3 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 42\",\"description\":\"Bhagavad Gita Chapter 3 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-42\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 42\",\"Gita 3.42\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-42\"},\"introduction\":\"$65\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 42\",\"description\":\"Bhagavad Gita Chapter 3 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-42\"},\"philosophical_explanation\":\"$66\",\"scripture_text\":\"इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः | मनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः ||३-४२||\",\"verse\":{\"sanskrit\":\"इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः | मनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः ||३-४२||\",\"translation\":\"3.42 They say that the senses are superior (to the body); superior to the senses is the mind; superior to the mind is the intellect; one who is superior even to the intellect is He (the Self).\",\"transliteration\":\"indriyāṇi parāṇyāhurindriyebhyaḥ paraṃ manaḥ . manasastu parā buddhiryo buddheḥ paratastu saḥ ||3-42||\"}}},\"verse43\":{\"verse43\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 43\",\"description\":\"Bhagavad Gita Chapter 3 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 43\",\"description\":\"Bhagavad Gita Chapter 3 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-43\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 43\",\"Gita 3.43\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-43\"},\"introduction\":\"$67\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 43\",\"description\":\"Bhagavad Gita Chapter 3 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-43\"},\"philosophical_explanation\":\"$68\",\"scripture_text\":\"एवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना | जहि शत्रुं महाबाहो कामरूपं दुरासदम् ||३-४३||\",\"verse\":{\"sanskrit\":\"एवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना | जहि शत्रुं महाबाहो कामरूपं दुरासदम् ||३-४३||\",\"translation\":\"3.43 Thus knowing Him Who is superior to the intellect and restraining the self by the Self, slay thou, O mighty-armed Arjuna, the enemy in the form of desire, hard to coner.\",\"transliteration\":\"evaṃ buddheḥ paraṃ buddhvā saṃstabhyātmānamātmanā . jahi śatruṃ mahābāho kāmarūpaṃ durāsadam ||3-43||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 5\",\"description\":\"Bhagavad Gita Chapter 3 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 5\",\"description\":\"Bhagavad Gita Chapter 3 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 5\",\"Gita 3.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-5\"},\"introduction\":\"$69\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 5\",\"description\":\"Bhagavad Gita Chapter 3 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-5\"},\"philosophical_explanation\":\"$6a\",\"scripture_text\":\"न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत् | कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः ||३-५||\",\"verse\":{\"sanskrit\":\"न हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत् | कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः ||३-५||\",\"translation\":\"3.5 Verily none can ever remain for even a moment without performing action; for everyone is made to act helplessly indeed by the alities born of Nature.\",\"transliteration\":\"na hi kaścitkṣaṇamapi jātu tiṣṭhatyakarmakṛt . kāryate hyavaśaḥ karma sarvaḥ prakṛtijairguṇaiḥ ||3-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 6\",\"description\":\"Bhagavad Gita Chapter 3 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 6\",\"description\":\"Bhagavad Gita Chapter 3 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 6\",\"Gita 3.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-6\"},\"introduction\":\"$6b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 6\",\"description\":\"Bhagavad Gita Chapter 3 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-6\"},\"philosophical_explanation\":\"$6c\",\"scripture_text\":\"कर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन् | इन्द्रियार्थान्विमूढात्मा मिथ्याचारः स उच्यते ||३-६||\",\"verse\":{\"sanskrit\":\"कर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन् | इन्द्रियार्थान्विमूढात्मा मिथ्याचारः स उच्यते ||३-६||\",\"translation\":\"3.6 He who, restraining the organs of action, sits thinking of the sense-objects in mind, he of deluded understanding is called a hypocrite.\",\"transliteration\":\"karmendriyāṇi saṃyamya ya āste manasā smaran . indriyārthānvimūḍhātmā mithyācāraḥ sa ucyate ||3-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 7\",\"description\":\"Bhagavad Gita Chapter 3 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 7\",\"description\":\"Bhagavad Gita Chapter 3 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 7\",\"Gita 3.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-7\"},\"introduction\":\"$6d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 7\",\"description\":\"Bhagavad Gita Chapter 3 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-7\"},\"philosophical_explanation\":\"$6e\",\"scripture_text\":\"यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन | कर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते ||३-७||\",\"verse\":{\"sanskrit\":\"यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन | कर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते ||३-७||\",\"translation\":\"3.7 But whosoever, controlling the senses by the mind, O Arjuna, engages himself in Karma Yoga with the organs of action, without attachment, he excels.\",\"transliteration\":\"yastvindriyāṇi manasā niyamyārabhate.arjuna . karmendriyaiḥ karmayogamasaktaḥ sa viśiṣyate ||3-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 8\",\"description\":\"Bhagavad Gita Chapter 3 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 3 Verse 8\",\"description\":\"Bhagavad Gita Chapter 3 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-3/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 3 Verse 8\",\"Gita 3.8\",\"Bhagavad Gita Sanskrit\",\"IAST tra
