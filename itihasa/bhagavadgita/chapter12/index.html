,\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-13\"},\"philosophical_explanation\":\"$26\",\"scripture_text\":\"अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च | निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ||१२-१३||\",\"verse\":{\"sanskrit\":\"अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च | निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ||१२-१३||\",\"translation\":\"12.13 He who hates no creature, who is friendly and compassionate to all, who is free from attachment and egoism, balanced in pleasure and pain, and forgiving.\",\"transliteration\":\"adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca . nirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī ||12-13||\"}}},\"verse14\":{\"verse14\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 14\",\"description\":\"Bhagavad Gita Chapter 12 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 14\",\"description\":\"Bhagavad Gita Chapter 12 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 14\",\"Gita 12.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 14\",\"description\":\"Bhagavad Gita Chapter 12 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः | मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः ||१२-१४||\",\"verse\":{\"sanskrit\":\"सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः | मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः ||१२-१४||\",\"translation\":\"12.14 Ever content, steady in meditation, self-controlled, possessed of firm conviction, with the mind and intellect dedicated to Me, he, My devtoee, is dear to Me.\",\"transliteration\":\"santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ . mayyarpitamanobuddhiryo madbhaktaḥ sa me priyaḥ ||12-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 15\",\"description\":\"Bhagavad Gita Chapter 12 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 15\",\"description\":\"Bhagavad Gita Chapter 12 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 15\",\"Gita 12.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 15\",\"description\":\"Bhagavad Gita Chapter 12 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः | हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः ||१२-१५||\",\"verse\":{\"sanskrit\":\"यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः | हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः ||१२-१५||\",\"translation\":\"12.15 He by whom the world is not agitated and who cannot be agitated by the world, and who is freed from joy, anger, fear and anxiety he is dear to Me.\",\"transliteration\":\"yasmānnodvijate loko lokānnodvijate ca yaḥ . harṣāmarṣabhayodvegairmukto yaḥ sa ca me priyaḥ ||12-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 16\",\"description\":\"Bhagavad Gita Chapter 12 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 16\",\"description\":\"Bhagavad Gita Chapter 12 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 16\",\"Gita 12.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 16\",\"description\":\"Bhagavad Gita Chapter 12 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः | सर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः ||१२-१६||\",\"verse\":{\"sanskrit\":\"अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः | सर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः ||१२-१६||\",\"translation\":\"12.16 He who is free from wants, pure, expert, unconcerned, and free from pain, renouncing all undertakings or commencements he who is (thus) devoted to Me, is dear to Me.\",\"transliteration\":\"anapekṣaḥ śucirdakṣa udāsīno gatavyathaḥ . sarvārambhaparityāgī yo madbhaktaḥ sa me priyaḥ ||12-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 17\",\"description\":\"Bhagavad Gita Chapter 12 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 17\",\"description\":\"Bhagavad Gita Chapter 12 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 17\",\"Gita 12.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 17\",\"description\":\"Bhagavad Gita Chapter 12 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति | शुभाशुभपरित्यागी भक्तिमान्यः स मे प्रियः ||१२-१७||\",\"verse\":{\"sanskrit\":\"यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति | शुभाशुभपरित्यागी भक्तिमान्यः स मे प्रियः ||१२-१७||\",\"translation\":\"12.17 He who neither rejoices, nor hates, nor grieves, nor desires, renouncing good and evil, and who is full of devotion, is dear to Me.\",\"transliteration\":\"yo na hṛṣyati na dveṣṭi na śocati na kāṅkṣati . śubhāśubhaparityāgī bhaktimānyaḥ sa me priyaḥ ||12-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 18\",\"description\":\"Bhagavad Gita Chapter 12 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 18\",\"description\":\"Bhagavad Gita Chapter 12 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 18\",\"Gita 12.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 18\",\"description\":\"Bhagavad Gita Chapter 12 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"समः शत्रौ च मित्रे च तथा मानापमानयोः | शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः ||१२-१८||\",\"verse\":{\"sanskrit\":\"समः शत्रौ च मित्रे च तथा मानापमानयोः | शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः ||१२-१८||\",\"translation\":\"Swami Sivananda did not comment on this sloka\",\"transliteration\":\"samaḥ śatrau ca mitre ca tathā mānāpamānayoḥ . śītoṣṇasukhaduḥkheṣu samaḥ saṅgavivarjitaḥ ||12-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 19\",\"description\":\"Bhagavad Gita Chapter 12 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 19\",\"description\":\"Bhagavad Gita Chapter 12 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 19\",\"Gita 12.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 19\",\"description\":\"Bhagavad Gita Chapter 12 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येन केनचित् | अनिकेतः स्थिरमतिर्भक्तिमान्मे प्रियो नरः ||१२-१९||\",\"verse\":{\"sanskrit\":\"तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येन केनचित् | अनिकेतः स्थिरमतिर्भक्तिमान्मे प्रियो नरः ||१२-१९||\",\"translation\":\"12.19 He to whom censure and praise are eal, who is silent, content with anything, homeless, of a steady mind, and full of devotion that man is dear to Me.\",\"transliteration\":\"tulyanindāstutirmaunī santuṣṭo yena kenacit . aniketaḥ sthiramatirbhaktimānme priyo naraḥ ||12-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 2\",\"description\":\"Bhagavad Gita Chapter 12 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 2\",\"description\":\"Bhagavad Gita Chapter 12 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 2\",\"Gita 12.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 2\",\"description\":\"Bhagavad Gita Chapter 12 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"श्रीभगवानुवाच | मय्यावेश्य मनो ये मां नित्ययुक्ता उपासते | श्रद्धया परयोपेताः ते मे युक्ततमा मताः ||१२-२||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | मय्यावेश्य मनो ये मां नित्ययुक्ता उपासते | श्रद्धया परयोपेताः ते मे युक्ततमा मताः ||१२-२||\",\"translation\":\"12.2 The Blessed Lord said Those who, fixing their mind on Me, worship Me, ever steadfast and endowed with supreme faith, are the best in Yoga in My opinion.\",\"transliteration\":\"śrībhagavānuvāca . mayyāveśya mano ye māṃ nityayuktā upāsate . śraddhayā parayopetāḥ te me yuktatamā matāḥ ||12-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 20\",\"description\":\"Bhagavad Gita Chapter 12 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 20\",\"description\":\"Bhagavad Gita Chapter 12 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 20\",\"Gita 12.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 20\",\"description\":\"Bhagavad Gita Chapter 12 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"ये तु धर्म्यामृतमिदं यथोक्तं पर्युपासते | श्रद्दधाना मत्परमा भक्तास्तेऽतीव मे प्रियाः ||१२-२०||\",\"verse\":{\"sanskrit\":\"ये तु धर्म्यामृतमिदं यथोक्तं पर्युपासते | श्रद्दधाना मत्परमा भक्तास्तेऽतीव मे प्रियाः ||१२-२०||\",\"translation\":\"12.20 They verily who follow this immortal Dharma (law or doctrine) as described above, endowed with faith, regarding Me as their supreme goal, they, the devotees, are exceedingly dear to Me.\",\"transliteration\":\"ye tu dharmyāmṛtamidaṃ yathoktaṃ paryupāsate . śraddadhānā matparamā bhaktāste.atīva me priyāḥ ||12-20||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 3\",\"description\":\"Bhagavad Gita Chapter 12 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 3\",\"description\":\"Bhagavad Gita Chapter 12 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 3\",\"Gita 12.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-3\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 3\",\"description\":\"Bhagavad Gita Chapter 12 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-3\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"ये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते | सर्वत्रगमचिन्त्यञ्च कूटस्थमचलन्ध्रुवम् ||१२-३||\",\"verse\":{\"sanskrit\":\"ये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते | सर्वत्रगमचिन्त्यञ्च कूटस्थमचलन्ध्रुवम् ||१२-३||\",\"translation\":\"Swami Sivananda did not comment on this sloka\",\"transliteration\":\"ye tvakṣaramanirdeśyamavyaktaṃ paryupāsate . sarvatragamacintyañca kūṭasthamacalandhruvam ||12-3||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 4\",\"description\":\"Bhagavad Gita Chapter 12 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 4\",\"description\":\"Bhagavad Gita Chapter 12 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 4\",\"Gita 12.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-4\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 4\",\"description\":\"Bhagavad Gita Chapter 12 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-4\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"सन्नियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः | ते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः ||१२-४||\",\"verse\":{\"sanskrit\":\"सन्नियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः | ते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः ||१२-४||\",\"translation\":\"12.4 Having restrained all the senses, even-minded everywhere, intent on the welfare of all beings verily they also come unto Me.\",\"transliteration\":\"sanniyamyendriyagrāmaṃ sarvatra samabuddhayaḥ . te prāpnuvanti māmeva sarvabhūtahite ratāḥ ||12-4||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 5\",\"description\":\"Bhagavad Gita Chapter 12 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 5\",\"description\":\"Bhagavad Gita Chapter 12 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 5\",\"Gita 12.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-5\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 5\",\"description\":\"Bhagavad Gita Chapter 12 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-5\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"क्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम् | अव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते ||१२-५||\",\"verse\":{\"sanskrit\":\"क्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम् | अव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते ||१२-५||\",\"translation\":\"12.5 Greater is their trouble whose minds are set on the unmanifested; for the goal; the unmanifested, is very hard for the embodied to reach.\",\"transliteration\":\"kleśo.adhikatarasteṣāmavyaktāsaktacetasām || avyaktā hi gatirduḥkhaṃ dehavadbhiravāpyate ||12-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 6\",\"description\":\"Bhagavad Gita Chapter 12 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 6\",\"description\":\"Bhagavad Gita Chapter 12 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 6\",\"Gita 12.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-6\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 6\",\"description\":\"Bhagavad Gita Chapter 12 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-6\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"ये तु सर्वाणि कर्माणि मयि संन्यस्य मत्परः | अनन्येनैव योगेन मां ध्यायन्त उपासते ||१२-६||\",\"verse\":{\"sanskrit\":\"ये तु सर्वाणि कर्माणि मयि संन्यस्य मत्परः | अनन्येनैव योगेन मां ध्यायन्त उपासते ||१२-६||\",\"translation\":\"12.6 But to those who worship Me, renouncing all actions in Me, regarding Me as the supreme gaol, meditating on Me with single-minded Yoga.\",\"transliteration\":\"ye tu sarvāṇi karmāṇi mayi saṃnyasya matparaḥ . ananyenaiva yogena māṃ dhyāyanta upāsate ||12-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 7\",\"description\":\"Bhagavad Gita Chapter 12 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 7\",\"description\":\"Bhagavad Gita Chapter 12 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 7\",\"Gita 12.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-7\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 7\",\"description\":\"Bhagavad Gita Chapter 12 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-7\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"तेषामहं समुद्धर्ता मृत्युसंसारसागरात् | भवामि नचिरात्पार्थ मय्यावेशितचेतसाम् ||१२-७||\",\"verse\":{\"sanskrit\":\"तेषामहं समुद्धर्ता मृत्युसंसारसागरात् | भवामि नचिरात्पार्थ मय्यावेशितचेतसाम् ||१२-७||\",\"translation\":\"12.7 To those whose minds are set on Me, O Arjuna, verily I become ere long the saviour out of the ocean of Samsara.\",\"transliteration\":\"teṣāmahaṃ samuddhartā mṛtyusaṃsārasāgarāt . bhavāmi nacirātpārtha mayyāveśitacetasām ||12-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 8\",\"description\":\"Bhagavad Gita Chapter 12 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 8\",\"description\":\"Bhagavad Gita Chapter 12 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 8\",\"Gita 12.8\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-8\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 8\",\"description\":\"Bhagavad Gita Chapter 12 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-8\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"मय्येव मन आधत्स्व मयि बुद्धिं निवेशय | निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः ||१२-८||\",\"verse\":{\"sanskrit\":\"मय्येव मन आधत्स्व मयि बुद्धिं निवेशय | निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः ||१२-८||\",\"translation\":\"12.8 Fix thy mind in Me only, thy intellect in Me, (then) thou shalt no doubt live in Me alone hereafter.\",\"transliteration\":\"mayyeva mana ādhatsva mayi buddhiṃ niveśaya . nivasiṣyasi mayyeva ata ūrdhvaṃ na saṃśayaḥ ||12-8||\"}}},\"verse9\":{\"verse9\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 9\",\"description\":\"Bhagavad Gita Chapter 12 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 9\",\"description\":\"Bhagavad Gita Chapter 12 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-9\",\"keywords\":[\"Bhagavad Gita Chapter 12 Verse 9\",\"Gita 12.9\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-9\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 12 Verse 9\",\"description\":\"Bhagavad Gita Chapter 12 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-12/verse-9\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम् | अभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय ||१२-९||\",\"verse\":{\"sanskrit\":\"अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम् | अभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय ||१२-९||\",\"translation\":\"12.9 If thou art unable to fix thy mind steadily on Me, then by the Yoga of constant practice do thou seek to reach Me, O Arjuna.\",\"transliteration\":\"atha cittaṃ samādhātuṃ na śaknoṣi mayi sthiram . abhyāsayogena tato māmicchāptuṃ dhanañjaya ||12-9||\"}}}},\"initialLocale\":\"en\",\"chapter\":[\"chapter12\"]}]\n"])</scri
