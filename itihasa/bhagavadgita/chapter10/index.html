hasa/bhagavad-gita/chapter-10/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"स्वयमेवात्मनात्मानं वेत्थ त्वं पुरुषोत्तम | भूतभावन भूतेश देवदेव जगत्पते ||१०-१५||\",\"verse\":{\"sanskrit\":\"स्वयमेवात्मनात्मानं वेत्थ त्वं पुरुषोत्तम | भूतभावन भूतेश देवदेव जगत्पते ||१०-१५||\",\"translation\":\"Swami Sivananda did not comment on this sloka\",\"transliteration\":\"svayamevātmanātmānaṃ vettha tvaṃ puruṣottama . bhūtabhāvana bhūteśa devadeva jagatpate ||10-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 16\",\"description\":\"Bhagavad Gita Chapter 10 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 16\",\"description\":\"Bhagavad Gita Chapter 10 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 16\",\"Gita 10.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 16\",\"description\":\"Bhagavad Gita Chapter 10 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"वक्तुमर्हस्यशेषेण दिव्या ह्यात्मविभूतयः | याभिर्विभूतिभिर्लोकानिमांस्त्वं व्याप्य तिष्ठसि ||१०-१६||\",\"verse\":{\"sanskrit\":\"वक्तुमर्हस्यशेषेण दिव्या ह्यात्मविभूतयः | याभिर्विभूतिभिर्लोकानिमांस्त्वं व्याप्य तिष्ठसि ||१०-१६||\",\"translation\":\"10.16 Thou shouldst indeed tell, without reserve, of Thy divine glories by which Thou existest, pervading all these worlds. (None else can do so.)\",\"transliteration\":\"vaktumarhasyaśeṣeṇa divyā hyātmavibhūtayaḥ . yābhirvibhūtibhirlokānimāṃstvaṃ vyāpya tiṣṭhasi ||10-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 17\",\"description\":\"Bhagavad Gita Chapter 10 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 17\",\"description\":\"Bhagavad Gita Chapter 10 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 17\",\"Gita 10.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 17\",\"description\":\"Bhagavad Gita Chapter 10 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"कथं विद्यामहं योगिंस्त्वां सदा परिचिन्तयन् | केषु केषु च भावेषु चिन्त्योऽसि भगवन्मया ||१०-१७||\",\"verse\":{\"sanskrit\":\"कथं विद्यामहं योगिंस्त्वां सदा परिचिन्तयन् | केषु केषु च भावेषु चिन्त्योऽसि भगवन्मया ||१०-१७||\",\"translation\":\"10.17 How shall I, ever meditating, know Thee, O Yogin? In what aspects or things, O blessed Lord, art Thou to be thought of by me?\",\"transliteration\":\"kathaṃ vidyāmahaṃ yogiṃstvāṃ sadā paricintayan . keṣu keṣu ca bhāveṣu cintyo.asi bhagavanmayā ||10-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 18\",\"description\":\"Bhagavad Gita Chapter 10 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 18\",\"description\":\"Bhagavad Gita Chapter 10 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 18\",\"Gita 10.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 18\",\"description\":\"Bhagavad Gita Chapter 10 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"विस्तरेणात्मनो योगं विभूतिं च जनार्दन | भूयः कथय तृप्तिर्हि शृण्वतो नास्ति मेऽमृतम् ||१०-१८||\",\"verse\":{\"sanskrit\":\"विस्तरेणात्मनो योगं विभूतिं च जनार्दन | भूयः कथय तृप्तिर्हि शृण्वतो नास्ति मेऽमृतम् ||१०-१८||\",\"translation\":\"10.18 Tell me again in detail, O Krishna, of Thy Yogic power and glory; for I am not satiated with what I have heard of Thy life-giving and nectar-like speech.\",\"transliteration\":\"vistareṇātmano yogaṃ vibhūtiṃ ca janārdana . bhūyaḥ kathaya tṛptirhi śṛṇvato nāsti me.amṛtam ||10-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 19\",\"description\":\"Bhagavad Gita Chapter 10 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 19\",\"description\":\"Bhagavad Gita Chapter 10 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 19\",\"Gita 10.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 19\",\"description\":\"Bhagavad Gita Chapter 10 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"श्रीभगवानुवाच | हन्त ते कथयिष्यामि दिव्या ह्यात्मविभूतयः | प्राधान्यतः कुरुश्रेष्ठ नास्त्यन्तो विस्तरस्य मे ||१०-१९||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | हन्त ते कथयिष्यामि दिव्या ह्यात्मविभूतयः | प्राधान्यतः कुरुश्रेष्ठ नास्त्यन्तो विस्तरस्य मे ||१०-१९||\",\"translation\":\"10.19 The Blessed Lord said Very well! Now I will declare to thee My divine glories in their prominence, O Arjuna; there is no end to their detailed description.\",\"transliteration\":\"śrībhagavānuvāca . hanta te kathayiṣyāmi divyā hyātmavibhūtayaḥ . prādhānyataḥ kuruśreṣṭha nāstyanto vistarasya me ||10-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 2\",\"description\":\"Bhagavad Gita Chapter 10 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 2\",\"description\":\"Bhagavad Gita Chapter 10 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 2\",\"Gita 10.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 2\",\"description\":\"Bhagavad Gita Chapter 10 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"न मे विदुः सुरगणाः प्रभवं न महर्षयः | अहमादिर्हि देवानां महर्षीणां च सर्वशः ||१०-२||\",\"verse\":{\"sanskrit\":\"न मे विदुः सुरगणाः प्रभवं न महर्षयः | अहमादिर्हि देवानां महर्षीणां च सर्वशः ||१०-२||\",\"translation\":\"10.2 Neither the hosts of the gods nor the great sages know My origin; for in every way I am the source of all the gods and the great sages.\",\"transliteration\":\"na me viduḥ suragaṇāḥ prabhavaṃ na maharṣayaḥ . ahamādirhi devānāṃ maharṣīṇāṃ ca sarvaśaḥ ||10-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 20\",\"description\":\"Bhagavad Gita Chapter 10 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 20\",\"description\":\"Bhagavad Gita Chapter 10 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 20\",\"Gita 10.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 20\",\"description\":\"Bhagavad Gita Chapter 10 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"अहमात्मा गुडाकेश सर्वभूताशयस्थितः | अहमादिश्च मध्यं च भूतानामन्त एव च ||१०-२०||\",\"verse\":{\"sanskrit\":\"अहमात्मा गुडाकेश सर्वभूताशयस्थितः | अहमादिश्च मध्यं च भूतानामन्त एव च ||१०-२०||\",\"translation\":\"10.20 I am the Self, O Gudakesa, seated in the hearts of all beings; I am the beginning, the middle and also the end of all beings.\",\"transliteration\":\"ahamātmā guḍākeśa sarvabhūtāśayasthitaḥ . ahamādiśca madhyaṃ ca bhūtānāmanta eva ca ||10-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 21\",\"description\":\"Bhagavad Gita Chapter 10 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 21\",\"description\":\"Bhagavad Gita Chapter 10 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 21\",\"Gita 10.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 21\",\"description\":\"Bhagavad Gita Chapter 10 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"आदित्यानामहं विष्णुर्ज्योतिषां रविरंशुमान् | मरीचिर्मरुतामस्मि नक्षत्राणामहं शशी ||१०-२१||\",\"verse\":{\"sanskrit\":\"आदित्यानामहं विष्णुर्ज्योतिषां रविरंशुमान् | मरीचिर्मरुतामस्मि नक्षत्राणामहं शशी ||१०-२१||\",\"translation\":\"10.21 Among the (twelve) Adityas, I am Vishnu; among luminaries, the radiant sun; I am Marichi among the (seven or forty-nine) Maruts; among stars the moon am I.\",\"transliteration\":\"ādityānāmahaṃ viṣṇurjyotiṣāṃ raviraṃśumān . marīcirmarutāmasmi nakṣatrāṇāmahaṃ śaśī ||10-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 22\",\"description\":\"Bhagavad Gita Chapter 10 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 22\",\"description\":\"Bhagavad Gita Chapter 10 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-22\",\"keywords\":[\"Bhagavad Gi Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 23\",\"description\":\"Bhagavad Gita Chapter 10 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"रुद्राणां शङ्करश्चास्मि वित्तेशो यक्षरक्षसाम् | वसूनां पावकश्चास्मि मेरुः शिखरिणामहम् ||१०-२३||\",\"verse\":{\"sanskrit\":\"रुद्राणां शङ्करश्चास्मि वित्तेशो यक्षरक्षसाम् | वसूनां पावकश्चास्मि मेरुः शिखरिणामहम् ||१०-२३||\",\"translation\":\"10.23 And, among the Rudras I am Sankara; among the Yakshas and Rakshasas, the Lord of wealth (Kubera); among the Vasus I am Pavaka (fire); and among the (seven) mountains I am the Meru.\",\"transliteration\":\"rudrāṇāṃ śaṅkaraścāsmi vitteśo yakṣarakṣasām . vasūnāṃ pāvakaścāsmi meruḥ śikhariṇāmaham ||10-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 24\",\"description\":\"Bhagavad Gita Chapter 10 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 24\",\"description\":\"Bhagavad Gita Chapter 10 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 24\",\"Gita 10.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 24\",\"description\":\"Bhagavad Gita Chapter 10 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"पुरोधसां च मुख्यं मां विद्धि पार्थ बृहस्पतिम् | सेनानीनामहं स्कन्दः सरसामस्मि सागरः ||१०-२४||\",\"verse\":{\"sanskrit\":\"पुरोधसां च मुख्यं मां विद्धि पार्थ बृहस्पतिम् | सेनानीनामहं स्कन्दः सरसामस्मि सागरः ||१०-२४||\",\"translation\":\"10.24 And, among the household priests (of kings), O Arjuna, know Me to be the chief, Brihaspati; among the army generals I am Skana; among lakes I am the ocean. '\",\"transliteration\":\"purodhasāṃ ca mukhyaṃ māṃ viddhi pārtha bṛhaspatim . senānīnāmahaṃ skandaḥ sarasāmasmi sāgaraḥ ||10-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 25\",\"description\":\"Bhagavad Gita Chapter 10 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 25\",\"description\":\"Bhagavad Gita Chapter 10 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 25\",\"Gita 10.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 25\",\"description\":\"Bhagavad Gita Chapter 10 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"महर्षीणां भृगुरहं गिरामस्म्येकमक्षरम् | यज्ञानां जपयज्ञोऽस्मि स्थावराणां हिमालयः ||१०-२५||\",\"verse\":{\"sanskrit\":\"महर्षीणां भृगुरहं गिरामस्म्येकमक्षरम् | यज्ञानां जपयज्ञोऽस्मि स्थावराणां हिमालयः ||१०-२५||\",\"translation\":\"10.25 Among the great sages I am Bhrigu; among words I am the one syllable (Om); among sacrifices I am the sacrifice of silent repetition; among the immovable things I am the Himalayas.\",\"transliteration\":\"maharṣīṇāṃ bhṛgurahaṃ girāmasmyekamakṣaram . yajñānāṃ japayajño.asmi sthāvarāṇāṃ himālayaḥ ||10-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 26\",\"description\":\"Bhagavad Gita Chapter 10 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 26\",\"description\":\"Bhagavad Gita Chapter 10 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 26\",\"Gita 10.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 26\",\"description\":\"Bhagavad Gita Chapter 10 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"अश्वत्थः सर्ववृक्षाणां देवर्षीणां च नारदः | गन्धर्वाणां चित्ररथः सिद्धानां कपिलो मुनिः ||१०-२६||\",\"verse\":{\"sanskrit\":\"अश्वत्थः सर्ववृक्षाणां देवर्षीणां च नारदः | गन्धर्वाणां चित्ररथः सिद्धानां कपिलो मुनिः ||१०-२६||\",\"translation\":\"10.26 Among all the trees ( I am) the Peepul; among the divine sages, I am Narada; among Gandharvas, Chitraratha; among the perfected, the sage Kapila.\",\"transliteration\":\"aśvatthaḥ sarvavṛkṣāṇāṃ devarṣīṇāṃ ca nāradaḥ . gandharvāṇāṃ citrarathaḥ siddhānāṃ kapilo muniḥ ||10-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 27\",\"description\":\"Bhagavad Gita Chapter 10 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 27\",\"description\":\"Bhagavad Gita Chapter 10 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 27\",\"Gita 10.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 27\",\"description\":\"Bhagavad Gita Chapter 10 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"उच्चैःश्रवसमश्वानां विद्धि माममृतोद्भवम् | ऐरावतं गजेन्द्राणां नराणां च नराधिपम् ||१०-२७||\",\"verse\":{\"sanskrit\":\"उच्चैःश्रवसमश्वानां विद्धि माममृतोद्भवम् | ऐरावतं गजेन्द्राणां नराणां च नराधिपम् ||१०-२७||\",\"translation\":\"10.27 Know Me as Ucchaisravas born of nectar, among horses; among lordly elephants (I am) the Airavata; and, among men, the king.\",\"transliteration\":\"uccaiḥśravasamaśvānāṃ viddhi māmamṛtodbhavam . airāvataṃ gajendrāṇāṃ narāṇāṃ ca narādhipam ||10-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 28\",\"description\":\"Bhagavad Gita Chapter 10 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 28\",\"description\":\"Bhagavad Gita Chapter 10 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 28\",\"Gita 10.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 28\",\"description\":\"Bhagavad Gita Chapter 10 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"आयुधानामहं वज्रं धेनूनामस्मि कामधुक् | प्रजनश्चास्मि कन्दर्पः सर्पाणामस्मि वासुकिः ||१०-२८||\",\"verse\":{\"sanskrit\":\"आयुधानामहं वज्रं धेनूनामस्मि कामधुक् | प्रजनश्चास्मि कन्दर्पः सर्पाणामस्मि वासुकिः ||१०-२८||\",\"translation\":\"10.28 Among weapons I am the thunderbolt; among cows I am the wish-fulfilling cow called Kamadhenu; I am the progenitor, the god of love; among serpents I am Vasuki.\",\"transliteration\":\"āyudhānāmahaṃ vajraṃ dhenūnāmasmi kāmadhuk . prajanaścāsmi kandarpaḥ sarpāṇāmasmi vāsukiḥ ||10-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 29\",\"description\":\"Bhagavad Gita Chapter 10 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 29\",\"description\":\"Bhagavad Gita Chapter 10 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 29\",\"Gita 10.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 29\",\"description\":\"Bhagavad Gita Chapter 10 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"अनन्तश्चास्मि नागानां वरुणो यादसामहम् | पितॄणामर्यमा चास्मि यमः संयमतामहम् ||१०-२९||\",\"verse\":{\"sanskrit\":\"अनन्तश्चास्मि नागानां वरुणो यादसामहम् | पितॄणामर्यमा चास्मि यमः संयमतामहम् ||१०-२९||\",\"translation\":\"10.29 I am Ananta among the Nagas; I am Varuna among water-deities; Aryaman among the Manes I am; I am Yama among the governors.\",\"transliteration\":\"anantaścāsmi nāgānāṃ varuṇo yādasāmaham . pitṝṇāmaryamā cāsmi yamaḥ saṃyamatāmaham ||10-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 3\",\"description\":\"Bhagavad Gita Chapter 10 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 3\",\"description\":\"Bhagavad Gita Chapter 10 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 3\",\"Gita 10.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 3\",\"description\":\"Bhagavad Gita Chapter 10 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"यो मामजमनादिं च वेत्ति लोकमहेश्वरम् | असम्मूढः स मर्त्येषु सर्वपापैः प्रमुच्यते ||१०-३||\",\"verse\":{\"sanskrit\":\"यो मामजमनादिं च वेत्ति लोकमहेश्वरम् | असम्मूढः स मर्त्येषु सर्वपापैः प्रमुच्यते ||१०-३||\",\"translation\":\"10.3 He who knows Me as unborn and beginningless, as the great Lord of the worlds, he, among mortals, is undeluded and he is liberated from all sins.\",\"transliteration\":\"yo māmajamanādiṃ ca vetti lokamaheśvaram . asammūḍhaḥ sa martyeṣu sarvapāpaiḥ pramucyate ||10-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 30\",\"description\":\"Bhagavad Gita Chapter 10 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 30\",\"description\":\"Bhagavad Gita Chapter 10 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 30\",\"Gita 10.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 30\",\"description\":\"Bhagavad Gita Chapter 10 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम् | मृगाणां च मृगेन्द्रोऽहं वैनतेयश्च पक्षिणाम् ||१०-३०||\",\"verse\":{\"sanskrit\":\"प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम् | मृगाणां च मृगेन्द्रोऽहं वैनतेयश्च पक्षिणाम् ||१०-३०||\",\"translation\":\"10.30 And, I am Prahlada among the demons, among the reckoners I am time; among beasts I am the lion, and Vainateya (Garuda) among birds.\",\"transliteration\":\"prahlādaścāsmi daityānāṃ kālaḥ kalayatāmaham . mṛgāṇāṃ ca mṛgendro.ahaṃ vainateyaśca pakṣiṇām ||10-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 31\",\"description\":\"Bhagavad Gita Chapter 10 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 31\",\"description\":\"Bhagavad Gita Chapter 10 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 31\",\"Gita 10.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 31\",\"description\":\"Bhagavad Gita Chapter 10 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"पवनः पवतामस्मि रामः शस्त्रभृतामहम् | झषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी ||१०-३१||\",\"verse\":{\"sanskrit\":\"पवनः पवतामस्मि रामः शस्त्रभृतामहम् | झषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी ||१०-३१||\",\"translation\":\"10.31 Among the purifiers (or the speeders) I am the wind; Rama among the warriors am I; among the fishes I am the shark; among the streams I am the Ganga.\",\"transliteration\":\"pavanaḥ pavatāmasmi rāmaḥ śastrabhṛtāmaham . jhaṣāṇāṃ makaraścāsmi srotasāmasmi jāhnavī ||10-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 32\",\"description\":\"Bhagavad Gita Chapter 10 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 32\",\"description\":\"Bhagavad Gita Chapter 10 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 32\",\"Gita 10.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 32\",\"description\":\"Bhagavad Gita Chapter 10 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"सर्गाणामादिरन्तश्च मध्यं चैवाहमर्जुन | अध्यात्मविद्या विद्यानां वादः प्रवदतामहम् ||१०-३२||\",\"verse\":{\"sanskrit\":\"सर्गाणामादिरन्तश्च मध्यं चैवाहमर्जुन | अध्यात्मविद्या विद्यानां वादः प्रवदतामहम् ||१०-३२||\",\"translation\":\"10.32 Among creations I am the beginning, the middle and also the end, O Arjuna; among the sciences I am the science of the Self; and I am the logic among controversialists.\",\"transliteration\":\"sargāṇāmādirantaśca madhyaṃ caivāhamarjuna . adhyātmavidyā vidyānāṃ vādaḥ pravadatāmaham ||10-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 33\",\"description\":\"Bhagavad Gita Chapter 10 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 33\",\"description\":\"Bhagavad Gita Chapter 10 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-33\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 33\",\"Gita 10.33\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-33\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 33\",\"description\":\"Bhagavad Gita Chapter 10 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-33\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"अक्षराणामकारोऽस्मि द्वन्द्वः सामासिकस्य च | अहमेवाक्षयः कालो धाताहं विश्वतोमुखः ||१०-३३||\",\"verse\":{\"sanskrit\":\"अक्षराणामकारोऽस्मि द्वन्द्वः सामासिकस्य च | अहमेवाक्षयः कालो धाताहं विश्वतोमुखः ||१०-३३||\",\"translation\":\"10.33 Among the letters of the alphabets, the letter 'A' I am and the dual among the compounds. I am verily the inexhaustible or everlasting time; I am the dispenser (of the fruits of actions) having faces in all directions.\",\"transliteration\":\"akṣarāṇāmakāro.asmi dvandvaḥ sāmāsikasya ca . ahamevākṣayaḥ kālo dhātāhaṃ viśvatomukhaḥ ||10-33||\"}}},\"verse34\":{\"verse34\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 34\",\"description\":\"Bhagavad Gita Chapter 10 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 34\",\"description\":\"Bhagavad Gita Chapter 10 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-34\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 34\",\"Gita 10.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 34\",\"description\":\"Bhagavad Gita Chapter 10 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"मृत्युः सर्वहरश्चाहमुद्भवश्च भविष्यताम् | कीर्तिः श्रीर्वाक्च नारीणां स्मृतिर्मेधा धृतिः क्षमा ||१०-३४||\",\"verse\":{\"sanskrit\":\"मृत्युः सर्वहरश्चाहमुद्भवश्च भविष्यताम् | कीर्तिः श्रीर्वाक्च नारीणां स्मृतिर्मेधा धृतिः क्षमा ||१०-३४||\",\"translation\":\"10.34 And I am the all-devouring Death, and the prosperity of those who are to be prosperous; among the feminine alities (I am) fame, prosperity, speech, memory, intelligence, firmness and forgiveness.\",\"transliteration\":\"mṛtyuḥ sarvaharaścāhamudbhavaśca bhaviṣyatām . kīrtiḥ śrīrvākca nārīṇāṃ smṛtirmedhā dhṛtiḥ kṣamā ||10-34||\"}}},\"verse35\":{\"verse35\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 35\",\"description\":\"Bhagavad Gita Chapter 10 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 35\",\"description\":\"Bhagavad Gita Chapter 10 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-35\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 35\",\"Gita 10.35\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-35\"},\"introduction\":\"$55\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 35\",\"description\":\"Bhagavad Gita Chapter 10 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-35\"},\"philosophical_explanation\":\"$56\",\"scripture_text\":\"बृहत्साम तथा साम्नां गायत्री छन्दसामहम् | मासानां मार्गशीर्षोऽहमृतूनां कुसुमाकरः ||१०-३५||\",\"verse\":{\"sanskrit\":\"बृहत्साम तथा साम्नां गायत्री छन्दसामहम् | मासानां मार्गशीर्षोऽहमृतूनां कुसुमाकरः ||१०-३५||\",\"translation\":\"10.35 Among the hymns also I am the Brihatsaman; among metres Gayatri am I; among the montsh I am the Margasirsha; among the seasons (I am) the flowery season.\",\"transliteration\":\"bṛhatsāma tathā sāmnāṃ gāyatrī chandasāmaham . māsānāṃ mārgaśīrṣo.ahamṛtūnāṃ kusumākaraḥ ||10-35||\"}}},\"verse36\":{\"verse36\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 36\",\"description\":\"Bhagavad Gita Chapter 10 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 36\",\"description\":\"Bhagavad Gita Chapter 10 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-36\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 36\",\"Gita 10.36\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-36\"},\"introduction\":\"$57\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 36\",\"description\":\"Bhagavad Gita Chapter 10 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-36\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम् | जयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम् ||१०-३६||\",\"verse\":{\"sanskrit\":\"द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम् | जयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम् ||१०-३६||\",\"translation\":\"10.36 I am the gambling of the fraudulent; I am the splendour of the splendid; I am victory; I am determination (of those who are determined); I am the goodness of the good.\",\"transliteration\":\"dyūtaṃ chalayatāmasmi tejastejasvināmaham . jayo.asmi vyavasāyo.asmi sattvaṃ sattvavatāmaham ||10-36||\"}}},\"verse37\":{\"verse37\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 37\",\"description\":\"Bhagavad Gita Chapter 10 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 37\",\"description\":\"Bhagavad Gita Chapter 10 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-37\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 37\",\"Gita 10.37\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-37\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 37\",\"description\":\"Bhagavad Gita Chapter 10 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-37\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनञ्जयः | मुनीनामप्यहं व्यासः कवीनामुशना कविः ||१०-३७||\",\"verse\":{\"sanskrit\":\"वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनञ्जयः | मुनीनामप्यहं व्यासः कवीनामुशना कविः ||१०-३७||\",\"translation\":\"10.37 Among the Vrishnis I am Vaasudeva; among the Pandavas I am Arjuna; among the sages I am Vyasa; among the Poets I am Usanas, the poet.\",\"transliteration\":\"vṛṣṇīnāṃ vāsudevo.asmi pāṇḍavānāṃ dhanañjayaḥ . munīnāmapyahaṃ vyāsaḥ kavīnāmuśanā kaviḥ ||10-37||\"}}},\"verse38\":{\"verse38\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 38\",\"description\":\"Bhagavad Gita Chapter 10 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 38\",\"description\":\"Bhagavad Gita Chapter 10 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-38\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 38\",\"Gita 10.38\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-38\"},\"introduction\":\"$5b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 38\",\"description\":\"Bhagavad Gita Chapter 10 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-38\"},\"philosophical_explanation\":\"$5c\",\"scripture_text\":\"दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम् | मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम् ||१०-३८||\",\"verse\":{\"sanskrit\":\"दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम् | मौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम् ||१०-३८||\",\"translation\":\"10.38 Of those who punish, I am the sceptre; among those who seek victory, I am statesmanship; and also among secrets, I am silence; knowledge among knowers I am.\",\"transliteration\":\"daṇḍo damayatāmasmi nītirasmi jigīṣatām . maunaṃ caivāsmi guhyānāṃ jñānaṃ jñānavatāmaham ||10-38||\"}}},\"verse39\":{\"verse39\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 39\",\"description\":\"Bhagavad Gita Chapter 10 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 39\",\"description\":\"Bhagavad Gita Chapter 10 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-39\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 39\",\"Gita 10.39\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-39\"},\"introduction\":\"$5d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 39\",\"description\":\"Bhagavad Gita Chapter 10 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-39\"},\"philosophical_explanation\":\"$5e\",\"scripture_text\":\"यच्चापि सर्वभूतानां बीजं तदहमर्जुन | न तदस्ति विना यत्स्यान्मया भूतं चराचरम् ||१०-३९||\",\"verse\":{\"sanskrit\":\"यच्चापि सर्वभूतानां बीजं तदहमर्जुन | न तदस्ति विना यत्स्यान्मया भूतं चराचरम् ||१०-३९||\",\"translation\":\"10.39 And whatever is the seed of all beings, that also am I, O Arjuna; there is no being, whether moving or unmoving, that can exist without Me.\",\"transliteration\":\"yaccāpi sarvabhūtānāṃ bījaṃ tadahamarjuna . na tadasti vinā yatsyānmayā bhūtaṃ carācaram ||10-39||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 4\",\"description\":\"Bhagavad Gita Chapter 10 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 4\",\"description\":\"Bhagavad Gita Chapter 10 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 4\",\"Gita 10.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-4\"},\"introduction\":\"$5f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 4\",\"description\":\"Bhagavad Gita Chapter 10 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-4\"},\"philosophical_explanation\":\"$60\",\"scripture_text\":\"बुद्धिर्ज्ञानमसम्मोहः क्षमा सत्यं दमः शमः | सुखं दुःखं भवोऽभावो भयं चाभयमेव च ||१०-४||\",\"verse\":{\"sanskrit\":\"बुद्धिर्ज्ञानमसम्मोहः क्षमा सत्यं दमः शमः | सुखं दुःखं भवोऽभावो भयं चाभयमेव च ||१०-४||\",\"translation\":\"10.4 Intellect, wisdom, non-delusion, forgiveness, truth, self-restraint, calmness, happiness, pain, existence or birth, non-existence or death, fear and also fearlessness.\",\"transliteration\":\"buddhirjñānamasammohaḥ kṣamā satyaṃ damaḥ śamaḥ . sukhaṃ duḥkhaṃ bhavo.abhāvo bhayaṃ cābhayameva ca ||10-4||\"}}},\"verse40\":{\"verse40\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 40\",\"description\":\"Bhagavad Gita Chapter 10 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 40\",\"description\":\"Bhagavad Gita Chapter 10 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-40\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 40\",\"Gita 10.40\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-40\"},\"introduction\":\"$61\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 40\",\"description\":\"Bhagavad Gita Chapter 10 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-40\"},\"philosophical_explanation\":\"$62\",\"scripture_text\":\"नान्तोऽस्ति मम दिव्यानां विभूतीनां परन्तप | एष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया ||१०-४०||\",\"verse\":{\"sanskrit\":\"नान्तोऽस्ति मम दिव्यानां विभूतीनां परन्तप | एष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया ||१०-४०||\",\"translation\":\"10.40 There is no end to My divine gloreis, O Arjuna, but this is a brief statement by Me of the particulars of My divine glories.\",\"transliteration\":\"nānto.asti mama divyānāṃ vibhūtīnāṃ parantapa . eṣa tūddeśataḥ prokto vibhūtervistaro mayā ||10-40||\"}}},\"verse41\":{\"verse41\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 41\",\"description\":\"Bhagavad Gita Chapter 10 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 41\",\"description\":\"Bhagavad Gita Chapter 10 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-41\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 41\",\"Gita 10.41\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-41\"},\"introduction\":\"$63\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 41\",\"description\":\"Bhagavad Gita Chapter 10 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-41\"},\"philosophical_explanation\":\"$64\",\"scripture_text\":\"यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा | तत्तदेवावगच्छ त्वं मम तेजोंऽशसम्भवम् ||१०-४१||\",\"verse\":{\"sanskrit\":\"यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा | तत्तदेवावगच्छ त्वं मम तेजोंऽशसम्भवम् ||१०-४१||\",\"translation\":\"10.41 Whatever being there is glorious, prosperous or powerful, that know thou to be a manifestation of a part of My splendour.\",\"transliteration\":\"yadyadvibhūtimatsattvaṃ śrīmadūrjitameva vā . tattadevāvagaccha tvaṃ mama tejoṃśasambhavam ||10-41||\"}}},\"verse42\":{\"verse42\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 42\",\"description\":\"Bhagavad Gita Chapter 10 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 42\",\"description\":\"Bhagavad Gita Chapter 10 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-42\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 42\",\"Gita 10.42\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-42\"},\"introduction\":\"$65\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 42\",\"description\":\"Bhagavad Gita Chapter 10 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-42\"},\"philosophical_explanation\":\"$66\",\"scripture_text\":\"अथवा बहुनैतेन किं ज्ञातेन तवार्जुन | विष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत् ||१०-४२||\",\"verse\":{\"sanskrit\":\"अथवा बहुनैतेन किं ज्ञातेन तवार्जुन | विष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत् ||१०-४२||\",\"translation\":\"10.42 But, of what avail to thee is the knowledge of all these details, O Arjuna? I exist, supporting this whole world by one part of Myself.\",\"transliteration\":\"athavā bahunaitena kiṃ jñātena tavārjuna . viṣṭabhyāhamidaṃ kṛtsnamekāṃśena sthito jagat ||10-42||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 5\",\"description\":\"Bhagavad Gita Chapter 10 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 5\",\"description\":\"Bhagavad Gita Chapter 10 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 5\",\"Gita 10.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-5\"},\"introduction\":\"$67\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 5\",\"description\":\"Bhagavad Gita Chapter 10 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-5\"},\"philosophical_explanation\":\"$68\",\"scripture_text\":\"अहिंसा समता तुष्टिस्तपो दानं यशोऽयशः | भवन्ति भावा भूतानां मत्त एव पृथग्विधाः ||१०-५||\",\"verse\":{\"sanskrit\":\"अहिंसा समता तुष्टिस्तपो दानं यशोऽयशः | भवन्ति भावा भूतानां मत्त एव पृथग्विधाः ||१०-५||\",\"translation\":\"10.5 Non-injury, eanimity, contentment, austerity, beneficence, fame, ill-fame (these) different kinds of alities of beings arise from Me alone.\",\"transliteration\":\"ahiṃsā samatā tuṣṭistapo dānaṃ yaśo.ayaśaḥ . bhavanti bhāvā bhūtānāṃ matta eva pṛthagvidhāḥ ||10-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 6\",\"description\":\"Bhagavad Gita Chapter 10 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 6\",\"description\":\"Bhagavad Gita Chapter 10 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 6\",\"Gita 10.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-6\"},\"introduction\":\"$69\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 6\",\"description\":\"Bhagavad Gita Chapter 10 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-6\"},\"philosophical_explanation\":\"$6a\",\"scripture_text\":\"महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा | मद्भावा मानसा जाता येषां लोक इमाः प्रजाः ||१०-६||\",\"verse\":{\"sanskrit\":\"महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा | मद्भावा मानसा जाता येषां लोक इमाः प्रजाः ||१०-६||\",\"translation\":\"10.6 The seven great sages, the ancient four and also the Manus, possessed of powers like Me (on account of their minds being fixed on Me), were born of (My) mind; from them are these creatures born in this world.\",\"transliteration\":\"maharṣayaḥ sapta pūrve catvāro manavastathā . madbhāvā mānasā jātā yeṣāṃ loka imāḥ prajāḥ ||10-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 7\",\"description\":\"Bhagavad Gita Chapter 10 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 7\",\"description\":\"Bhagavad Gita Chapter 10 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 7\",\"Gita 10.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-7\"},\"introduction\":\"$6b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 7\",\"description\":\"Bhagavad Gita Chapter 10 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-7\"},\"philosophical_explanation\":\"$6c\",\"scripture_text\":\"एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः | सोऽविकम्पेन योगेन युज्यते नात्र संशयः ||१०-७||\",\"verse\":{\"sanskrit\":\"एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः | सोऽविकम्पेन योगेन युज्यते नात्र संशयः ||१०-७||\",\"translation\":\"10.7 He who in truth knows these manifold manifestations of My Being and (this) Yoga-power of Mine becomes established in the unshakable Yoga; there is no doubt about it.\",\"transliteration\":\"etāṃ vibhūtiṃ yogaṃ ca mama yo vetti tattvataḥ . so.avikampena yogena yujyate nātra saṃśayaḥ ||10-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 8\",\"description\":\"Bhagavad Gita Chapter 10 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 8\",\"description\":\"Bhagavad Gita Chapter 10 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 8\",\"Gita 10.8\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-8\"},\"introduction\":\"$6d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 8\",\"description\":\"Bhagavad Gita Chapter 10 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-8\"},\"philosophical_explanation\":\"$6e\",\"scripture_text\":\"अहं सर्वस्य प्रभवो मत्तः सर्वं प्रवर्तते | इति मत्वा भजन्ते मां बुधा भावसमन्विताः ||१०-८||\",\"verse\":{\"sanskrit\":\"अहं सर्वस्य प्रभवो मत्तः सर्वं प्रवर्तते | इति मत्वा भजन्ते मां बुधा भावसमन्विताः ||१०-८||\",\"translation\":\"10.8 I am the source of all; from Me everything evolves; understanding thus, the wise, endowed with meditation, worship Me.\",\"transliteration\":\"ahaṃ sarvasya prabhavo mattaḥ sarvaṃ pravartate . iti matvā bhajante māṃ budhā bhāvasamanvitāḥ ||10-8||\"}}},\"verse9\":{\"verse9\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 9\",\"description\":\"Bhagavad Gita Chapter 10 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 9\",\"description\":\"Bhagavad Gita Chapter 10 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-9\",\"keywords\":[\"Bhagavad Gita Chapter 10 Verse 9\",\"Gita 10.9\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-9\"},\"introduction\":\"$6f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 10 Verse 9\",\"description\":\"Bhagavad Gita Chapter 10 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-10/verse-9\"},\"philosophical_explanation\":\"$70\",\"scripture_text\":\"मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम् | कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च ||१०-९||\",\"verse\":{\"sanskrit\":\"मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम् | कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च ||१०-९||\",\"translation\":\"10.9 With their mind and their life wholly absorbed in Me, enlightening each other and ever speaking of Me, they are satisfied and delighted.\",\"transliteration\":\"maccittā madgataprāṇā bodhayantaḥ parasparam . kathayantaśca māṃ nityaṃ tuṣyanti ca ramanti ca ||10-9||\"}}}},\"initialLocale\":\"en\",\"chapter\":[\"chapter10\"]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"71:I[27201,[\"/_next/static/chunks/03r18pp~9shb1.js\",\"/_next/static/chunks/06zzw9vfd8b8u.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"Bhagavad Gita - Complete Guide, Chapters, Teachings \u0026 Philosophy | Sanatana\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Explore the Bhagavad Gita, the sacred dialogue between Krishna and Arjuna. Discover its 18 chapters, core teachings on karma, dharma, yoga, and spiritual wisdom.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta
