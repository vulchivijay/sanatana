t souls, O Arjuna, partaking of My divine nature, worship Me with a single mind (with the mind devoted to nothing else), knowing Me as the imperishable source of beings.\",\"transliteration\":\"mahātmānastu māṃ pārtha daivīṃ prakṛtimāśritāḥ . bhajantyananyamanaso jñātvā bhūtādimavyayam ||9-13||\"}}},\"verse14\":{\"verse14\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 14\",\"description\":\"Bhagavad Gita Chapter 9 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 14\",\"description\":\"Bhagavad Gita Chapter 9 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 14\",\"Gita 9.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 14\",\"description\":\"Bhagavad Gita Chapter 9 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"सततं कीर्तयन्तो मां यतन्तश्च दृढव्रताः | नमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते ||९-१४||\",\"verse\":{\"sanskrit\":\"सततं कीर्तयन्तो मां यतन्तश्च दृढव्रताः | नमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते ||९-१४||\",\"translation\":\"9.14 Always glorifying Me, striving,firm in vows, prostrating themselves before Me, they worship Me with devotion always steadfast.\",\"transliteration\":\"satataṃ kīrtayanto māṃ yatantaśca dṛḍhavratāḥ . namasyantaśca māṃ bhaktyā nityayuktā upāsate ||9-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 15\",\"description\":\"Bhagavad Gita Chapter 9 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 15\",\"description\":\"Bhagavad Gita Chapter 9 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 15\",\"Gita 9.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 15\",\"description\":\"Bhagavad Gita Chapter 9 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"ज्ञानयज्ञेन चाप्यन्ये यजन्तो मामुपासते | एकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम् ||९-१५||\",\"verse\":{\"sanskrit\":\"ज्ञानयज्ञेन चाप्यन्ये यजन्तो मामुपासते | एकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम् ||९-१५||\",\"translation\":\"9.15 Others also sacrificing with the wisdom-sacrifice worship Me, the All-faced, as one, as distinct, and as manifold.\",\"transliteration\":\"jñānayajñena cāpyanye yajanto māmupāsate . ekatvena pṛthaktvena bahudhā viśvatomukham ||9-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 16\",\"description\":\"Bhagavad Gita Chapter 9 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 16\",\"description\":\"Bhagavad Gita Chapter 9 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 16\",\"Gita 9.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 16\",\"description\":\"Bhagavad Gita Chapter 9 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"अहं क्रतुरहं यज्ञः स्वधाहमहमौषधम् | मन्त्रोऽहमहमेवाज्यमहमग्निरहं हुतम् ||९-१६||\",\"verse\":{\"sanskrit\":\"अहं क्रतुरहं यज्ञः स्वधाहमहमौषधम् | मन्त्रोऽहमहमेवाज्यमहमग्निरहं हुतम् ||९-१६||\",\"translation\":\"9.16 I am the Kratu; I am the Yajna; I am the offering (food) to the manes; I am the medicinal herbs and all the plants; I am the Mantra; I am also the Ghee or the melted butter; I am the fire; I am the oblation.\",\"transliteration\":\"ahaṃ kraturahaṃ yajñaḥ svadhāhamahamauṣadham . mantro.ahamahamevājyamahamagnirahaṃ hutam ||9-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 17\",\"description\":\"Bhagavad Gita Chapter 9 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 17\",\"description\":\"Bhagavad Gita Chapter 9 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 17\",\"Gita 9.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 17\",\"description\":\"Bhagavad Gita Chapter 9 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"पिताहमस्य जगतो माता धाता पितामहः | वेद्यं पवित्रमोंकार ऋक्साम यजुरेव च ||९-१७||\",\"verse\":{\"sanskrit\":\"पिताहमस्य जगतो माता धाता पितामहः | वेद्यं पवित्रमोंकार ऋक्साम यजुरेव च ||९-१७||\",\"translation\":\"9.17 I am the father of this world, the mother, the dispenser of the fruits of actions and the grandfather; the (one) thing to be known, the purifier, the sacred monosyllable (Om), and also the Rik-, the Sama-and the Yajur-Vedas.\",\"transliteration\":\"pitāhamasya jagato mātā dhātā pitāmahaḥ . vedyaṃ pavitramoṃkāra ṛksāma yajureva ca ||9-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 18\",\"description\":\"Bhagavad Gita Chapter 9 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 18\",\"description\":\"Bhagavad Gita Chapter 9 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 18\",\"Gita 9.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 18\",\"description\":\"Bhagavad Gita Chapter 9 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"गतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत् | प्रभवः प्रलयः स्थानं निधानं बीजमव्ययम् ||९-१८||\",\"verse\":{\"sanskrit\":\"गतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत् | प्रभवः प्रलयः स्थानं निधानं बीजमव्ययम् ||९-१८||\",\"translation\":\"9.18 I am the goal, the supporter, the Lord, the witness, the abode, the shelter, the friend, the origin, the dissolution, the foundation, the treasure-house and the seed which is imperishable.\",\"transliteration\":\"gatirbhartā prabhuḥ sākṣī nivāsaḥ śaraṇaṃ suhṛt . prabhavaḥ pralayaḥ sthānaṃ nidhānaṃ bījamavyayam ||9-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 19\",\"description\":\"Bhagavad Gita Chapter 9 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 19\",\"description\":\"Bhagavad Gita Chapter 9 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 19\",\"Gita 9.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 19\",\"description\":\"Bhagavad Gita Chapter 9 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"तपाम्यहमहं वर्षं निगृह्णाम्युत्सृजामि च | अमृतं चैव मृत्युश्च सदसच्चाहमर्जुन ||९-१९||\",\"verse\":{\"sanskrit\":\"तपाम्यहमहं वर्षं निगृह्णाम्युत्सृजामि च | अमृतं चैव मृत्युश्च सदसच्चाहमर्जुन ||९-१९||\",\"translation\":\"9.19 (As the sun) I give heat; I withhold and send forth the rain; I am immortality and also death, existence and non-existence, O Arjuna.\",\"transliteration\":\"tapāmyahamahaṃ varṣaṃ nigṛhṇāmyutsṛjāmi ca . amṛtaṃ caiva mṛtyuśca sadasaccāhamarjuna ||9-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 2\",\"description\":\"Bhagavad Gita Chapter 9 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 2\",\"description\":\"Bhagavad Gita Chapter 9 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 2\",\"Gita 9.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 2\",\"description\":\"Bhagavad Gita Chapter 9 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"राजविद्या राजगुह्यं पवित्रमिदमुत्तमम् | प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम् ||९-२||\",\"verse\":{\"sanskrit\":\"राजविद्या राजगुह्यं पवित्रमिदमुत्तमम् | प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम् ||९-२||\",\"translation\":\"9.2 This is the kingl science, the kingly secret, the supreme purifier, realisable by direct intuitional knowledge, according to righteousness, very easy to perform and imperishable.\",\"transliteration\":\"rājavidyā rājaguhyaṃ pavitramidamuttamam . pratyakṣāvagamaṃ dharmyaṃ susukhaṃ kartumavyayam ||9-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 20\",\"description\":\"Bhagavad Gita Chapter 9 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 20\",\"description\":\"Bhagavad Gita Chapter 9 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 20\",\"Gita 9.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 20\",\"description\":\"Bhagavad Gita Chapter 9 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"त्रैविद्या मां सोमपाः पूतपापा यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते | ते पुण्यमासाद्य सुरेन्द्रलोक- मश्नन्ति दिव्यान्दिवि देवभोगान् ||९-२०||\",\"verse\":{\"sanskrit\":\"त्रैविद्या मां सोमपाः पूतपापा यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते | ते पुण्यमासाद्य सुरेन्द्रलोक- मश्नन्ति दिव्यान्दिवि देवभोगान् ||९-२०||\",\"translation\":\"9.20 The knowers of the three Vedas, the drinkers of Soma, purified of all sins, worshipping Me by sacrifices, pray for the way to heaven; they reach the holy world of the Lord of the gods and enjoy in heavn the divine pleasures of the gods.\",\"transliteration\":\"traividyā māṃ somapāḥ pūtapāpā yajñairiṣṭvā svargatiṃ prārthayante . te puṇyamāsādya surendralokaṃ aśnanti divyāndivi devabhogān ||9-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 21\",\"description\":\"Bhagavad Gita Chapter 9 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 21\",\"description\":\"Bhagavad Gita Chapter 9 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 21\",\"Gita 9.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 21\",\"description\":\"Bhagavad Gita Chapter 9 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"ते तं भुक्त्वा स्वर्गलोकं विशालं क्षीणे पुण्ये मर्त्यलोकं विशन्ति | एवं त्रयीधर्ममनुप्रपन्ना गतागतं कामकामा लभन्ते ||९-२१||\",\"verse\":{\"sanskrit\":\"ते तं भुक्त्वा स्वर्गलोकं विशालं क्षीणे पुण्ये मर्त्यलोकं विशन्ति | एवं त्रयीधर्ममनुप्रपन्ना गतागतं कामकामा लभन्ते ||९-२१||\",\"translation\":\"9.21 They, having enjoyed the vast heaven, enter the world of mortals when their merit is exhausted; thus abiding by the injunctions of the ï1threeï1 (Vedas) and desiring (objects of) desires, they attain to the state of going and returning.\",\"transliteration\":\"te taṃ bhuktvā svargalokaṃ viśālaṃ kṣīṇe puṇye martyalokaṃ viśanti . evaṃ trayīdharmamanuprapannā gatāgataṃ kāmakāmā labhante ||9-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 22\",\"description\":\"Bhagavad Gita Chapter 9 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 22\",\"description\":\"Bhagavad Gita Chapter 9 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 22\",\"Gita 9.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 22\",\"description\":\"Bhagavad Gita Chapter 9 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते | तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम् ||९-२२||\",\"verse\":{\"sanskrit\":\"अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते | तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम् ||९-२२||\",\"translation\":\"9.22 For those men who worship Me alone, thinking of no other, for those ever-united, I secure what is not already possessed and preserve what they already possess.\",\"transliteration\":\"ananyāścintayanto māṃ ye janāḥ paryupāsate . teṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmyaham ||9-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 23\",\"description\":\"Bhagavad Gita Chapter 9 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 23\",\"description\":\"Bhagavad Gita Chapter 9 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 23\",\"Gita 9.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 23\",\"description\":\"Bhagavad Gita Chapter 9 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"येऽप्यन्यदेवता भक्ता यजन्ते श्रद्धयान्विताः | तेऽपि मामेव कौन्तेय यजन्त्यविधिपूर्वकम् ||९-२३||\",\"verse\":{\"sanskrit\":\"येऽप्यन्यदेवता भक्ता यजन्ते श्रद्धयान्विताः | तेऽपि मामेव कौन्तेय यजन्त्यविधिपूर्वकम् ||९-२३||\",\"translation\":\"9.23 Even those devotees who, endowed with faith, worship other gods, worship Me alone, O Arjuna, b the wrong method.\",\"transliteration\":\"ye.apyanyadevatābhaktā yajante śraddhayānvitāḥ . te.api māmeva kaunteya yajantyavidhipūrvakam ||9-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 24\",\"description\":\"Bhagavad Gita Chapter 9 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 24\",\"description\":\"Bhagavad Gita Chapter 9 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 24\",\"Gita 9.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 24\",\"description\":\"Bhagavad Gita Chapter 9 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"अहं हि सर्वयज्ञानां भोक्ता च प्रभुरेव च | न तु मामभिजानन्ति तत्त्वेनातश्च्यवन्ति ते ||९-२४||\",\"verse\":{\"sanskrit\":\"अहं हि सर्वयज्ञानां भोक्ता च प्रभुरेव च | न तु मामभिजानन्ति तत्त्वेनातश्च्यवन्ति ते ||९-२४||\",\"translation\":\"9.24 (For) I alone am the enjoyer and also the Lord of all sacrifices; but they do not know Me in essence (in reality), and hence they fall (return to this mortal world).\",\"transliteration\":\"ahaṃ hi sarvayajñānāṃ bhoktā ca prabhureva ca . na tu māmabhijānanti tattvenātaścyavanti te ||9-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 25\",\"description\":\"Bhagavad Gita Chapter 9 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 25\",\"description\":\"Bhagavad Gita Chapter 9 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 25\",\"Gita 9.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 25\",\"description\":\"Bhagavad Gita Chapter 9 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"यान्ति देवव्रता देवान्पितॄन्यान्ति पितृव्रताः | भूतानि यान्ति भूतेज्या यान्ति मद्याजिनोऽपि माम् ||९-२५||\",\"verse\":{\"sanskrit\":\"यान्ति देवव्रता देवान्पितॄन्यान्ति पितृव्रताः | भूतानि यान्ति भूतेज्या यान्ति मद्याजिनोऽपि माम् ||९-२५||\",\"translation\":\"9.25 The worshippers of the gods go to them; to the manes go the ancestor-worshippers; to the deities who preside over the elements go their worshippers; but My devotees come to Me.\",\"transliteration\":\"yānti devavratā devānpitṝnyānti pitṛvratāḥ . bhūtāni yānti bhūtejyā yānti madyājino.api mām ||9-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 26\",\"description\":\"Bhagavad Gita Chapter 9 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 26\",\"description\":\"Bhagavad Gita Chapter 9 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 26\",\"Gita 9.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 26\",\"description\":\"Bhagavad Gita Chapter 9 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति | तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः ||९-२६||\",\"verse\":{\"sanskrit\":\"पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति | तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः ||९-२६||\",\"translation\":\"9.26 Whoever offers Me with devotion a leaf, a flower, a fruit or a little water that, so offered devotedly by the pure-minded, I accept.\",\"transliteration\":\"patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyā prayacchati . tadahaṃ bhaktyupahṛtamaśnāmi prayatātmanaḥ ||9-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 27\",\"description\":\"Bhagavad Gita Chapter 9 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 27\",\"description\":\"Bhagavad Gita Chapter 9 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 27\",\"Gita 9.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 27\",\"description\":\"Bhagavad Gita Chapter 9 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"यत्करोषि यदश्नासि यज्जुहोषि ददासि यत् | यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम् ||९-२७||\",\"verse\":{\"sanskrit\":\"यत्करोषि यदश्नासि यज्जुहोषि ददासि यत् | यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम् ||९-२७||\",\"translation\":\"9.27 Whatever thou doest, whatever thou eatest, whatever thou offerest in sacrifice, whatever thou givest, whatever thou practisest as austerity, O Arjuna, do it as an offering unto Me.\",\"transliteration\":\"yatkaroṣi yadaśnāsi yajjuhoṣi dadāsi yat . yattapasyasi kaunteya tatkuruṣva madarpaṇam ||9-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 28\",\"description\":\"Bhagavad Gita Chapter 9 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 28\",\"description\":\"Bhagavad Gita Chapter 9 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 28\",\"Gita 9.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 28\",\"description\":\"Bhagavad Gita Chapter 9 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"शुभाशुभफलैरेवं मोक्ष्यसे कर्मबन्धनैः | संन्यासयोगयुक्तात्मा विमुक्तो मामुपैष्यसि ||९-२८||\",\"verse\":{\"sanskrit\":\"शुभाशुभफलैरेवं मोक्ष्यसे कर्मबन्धनैः | संन्यासयोगयुक्तात्मा विमुक्तो मामुपैष्यसि ||९-२८||\",\"translation\":\"9.28 Thus shalt thou be freed from the bonds of actions yielding good and evil fruits; with the mind steadfast in the Yoga of renunciation, and liberated, thou shalt come unto Me.\",\"transliteration\":\"śubhāśubhaphalairevaṃ mokṣyase karmabandhanaiḥ . saṃnyāsayogayuktātmā vimukto māmupaiṣyasi ||9-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 29\",\"description\":\"Bhagavad Gita Chapter 9 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 29\",\"description\":\"Bhagavad Gita Chapter 9 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 29\",\"Gita 9.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 29\",\"description\":\"Bhagavad Gita Chapter 9 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः | ये भजन्ति तु मां भक्त्या मयि ते तेषु चाप्यहम् ||९-२९||\",\"verse\":{\"sanskrit\":\"समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः | ये भजन्ति तु मां भक्त्या मयि ते तेषु चाप्यहम् ||९-२९||\",\"translation\":\"9.29 The same am I to all beings; to Me there is none hateful or dear; but those who worship Me with devotion are in Me and I am also in them.\",\"transliteration\":\"samo.ahaṃ sarvabhūteṣu na me dveṣyo.asti na priyaḥ . ye bhajanti tu māṃ bhaktyā mayi te teṣu cāpyaham ||9-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 3\",\"description\":\"Bhagavad Gita Chapter 9 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 3\",\"description\":\"Bhagavad Gita Chapter 9 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 3\",\"Gita 9.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 3\",\"description\":\"Bhagavad Gita Chapter 9 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"अश्रद्दधानाः पुरुषा धर्मस्यास्य परन्तप | अप्राप्य मां निवर्तन्ते मृत्युसंसारवर्त्मनि ||९-३||\",\"verse\":{\"sanskrit\":\"अश्रद्दधानाः पुरुषा धर्मस्यास्य परन्तप | अप्राप्य मां निवर्तन्ते मृत्युसंसारवर्त्मनि ||९-३||\",\"translation\":\"9.3 Those who have no faith in this Dharma (knowledge of the Self), O Parantapa (Arjuna), return to the path of this world of death without attaining Me.\",\"transliteration\":\"aśraddadhānāḥ puruṣā dharmasyāsya parantapa . aprāpya māṃ nivartante mṛtyusaṃsāravartmani ||9-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 30\",\"description\":\"Bhagavad Gita Chapter 9 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 30\",\"description\":\"Bhagavad Gita Chapter 9 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 30\",\"Gita 9.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 30\",\"description\":\"Bhagavad Gita Chapter 9 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"अपि चेत्सुदुराचारो भजते मामनन्यभाक् | साधुरेव स मन्तव्यः सम्यग्व्यवसितो हि सः ||९-३०||\",\"verse\":{\"sanskrit\":\"अपि चेत्सुदुराचारो भजते मामनन्यभाक् | साधुरेव स मन्तव्यः सम्यग्व्यवसितो हि सः ||९-३०||\",\"translation\":\"9.30 Even if the most sinful worships Me, with devotion to none else, he too should indeed by regarded as righteous for he has rightly resolved.\",\"transliteration\":\"api cetsudurācāro bhajate māmananyabhāk . sādhureva sa mantavyaḥ samyagvyavasito hi saḥ ||9-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 31\",\"description\":\"Bhagavad Gita Chapter 9 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 31\",\"description\":\"Bhagavad Gita Chapter 9 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 31\",\"Gita 9.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 31\",\"description\":\"Bhagavad Gita Chapter 9 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति | कौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति ||९-३१||\",\"verse\":{\"sanskrit\":\"क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति | कौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति ||९-३१||\",\"translation\":\"9.31 Soon he becomes righteous and attains to eternal peace; O Arjuna, proclaim thou for certain that My devotee never perishes.\",\"transliteration\":\"kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati . kaunteya pratijānīhi na me bhaktaḥ praṇaśyati ||9-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 32\",\"description\":\"Bhagavad Gita Chapter 9 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 32\",\"description\":\"Bhagavad Gita Chapter 9 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 32\",\"Gita 9.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 32\",\"description\":\"Bhagavad Gita Chapter 9 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः | स्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम् ||९-३२||\",\"verse\":{\"sanskrit\":\"मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः | स्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम् ||९-३२||\",\"translation\":\"9.32 For, taking refuge in Me, they also who, O Arjuna, may be of a sinful birth women, Vaisyas as well as Sudras attain the Supreme Goal.\",\"transliteration\":\"māṃ hi pārtha vyapāśritya ye.api syuḥ pāpayonayaḥ . striyo vaiśyāstathā śūdrāste.api yānti parāṃ gatim ||9-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 33\",\"description\":\"Bhagavad Gita Chapter 9 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 33\",\"description\":\"Bhagavad Gita Chapter 9 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-33\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 33\",\"Gita 9.33\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-33\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 33\",\"description\":\"Bhagavad Gita Chapter 9 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-33\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा | अनित्यमसुखं लोकमिमं प्राप्य भजस्व माम् ||९-३३||\",\"verse\":{\"sanskrit\":\"किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा | अनित्यमसुखं लोकमिमं प्राप्य भजस्व माम् ||९-३३||\",\"translation\":\"9.33 How much more (easily) then the hold Brahmins and devoted royal saints (attain the goal); having come to this impermanent and unhappy world, do thou worship Me.\",\"transliteration\":\"kiṃ punarbrāhmaṇāḥ puṇyā bhaktā rājarṣayastathā . anityamasukhaṃ lokamimaṃ prāpya bhajasva mām ||9-33||\"}}},\"verse34\":{\"verse34\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 34\",\"description\":\"Bhagavad Gita Chapter 9 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 34\",\"description\":\"Bhagavad Gita Chapter 9 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-34\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 34\",\"Gita 9.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 34\",\"description\":\"Bhagavad Gita Chapter 9 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु | मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः ||९-३४||\",\"verse\":{\"sanskrit\":\"मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु | मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः ||९-३४||\",\"translation\":\"9.34 Fix thy mind on Me; by devoted to Me; sacrifice unto Me; bow down to Me; having thus united thy whole self to Me, taking Me as the supreme goal, thou shalt come unto Me.\",\"transliteration\":\"manmanā bhava madbhakto madyājī māṃ namaskuru . māmevaiṣyasi yuktvaivamātmānaṃ matparāyaṇaḥ ||9-34||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 4\",\"description\":\"Bhagavad Gita Chapter 9 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 4\",\"description\":\"Bhagavad Gita Chapter 9 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 4\",\"Gita 9.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-4\"},\"introduction\":\"$55\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 4\",\"description\":\"Bhagavad Gita Chapter 9 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-4\"},\"philosophical_explanation\":\"$56\",\"scripture_text\":\"मया ततमिदं सर्वं जगदव्यक्तमूर्तिना | मत्स्थानि सर्वभूतानि न चाहं तेष्ववस्थितः ||९-४||\",\"verse\":{\"sanskrit\":\"मया ततमिदं सर्वं जगदव्यक्तमूर्तिना | मत्स्थानि सर्वभूतानि न चाहं तेष्ववस्थितः ||९-४||\",\"translation\":\"9.4 All this world is pervaded by Me in My unmanifest aspect; all beings exist in Me, but I do not dwell in them.\",\"transliteration\":\"mayā tatamidaṃ sarvaṃ jagadavyaktamūrtinā . matsthāni sarvabhūtāni na cāhaṃ teṣvavasthitaḥ ||9-4||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 5\",\"description\":\"Bhagavad Gita Chapter 9 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 5\",\"description\":\"Bhagavad Gita Chapter 9 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 5\",\"Gita 9.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-5\"},\"introduction\":\"$57\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 5\",\"description\":\"Bhagavad Gita Chapter 9 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-5\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम् | भूतभृन्न च भूतस्थो ममात्मा भूतभावनः ||९-५||\",\"verse\":{\"sanskrit\":\"न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम् | भूतभृन्न च भूतस्थो ममात्मा भूतभावनः ||९-५||\",\"translation\":\"9.5 Nor do beings exist in Me (in reality); behold My divine Yoga, supporting all beings, but not dwelling in them, is My Self, the efficient cause of beings.\",\"transliteration\":\"na ca matsthāni bhūtāni paśya me yogamaiśvaram . bhūtabhṛnna ca bhūtastho mamātmā bhūtabhāvanaḥ ||9-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 6\",\"description\":\"Bhagavad Gita Chapter 9 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 6\",\"description\":\"Bhagavad Gita Chapter 9 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 6\",\"Gita 9.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-6\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 6\",\"description\":\"Bhagavad Gita Chapter 9 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-6\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"यथाकाशस्थितो नित्यं वायुः सर्वत्रगो महान् | तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय ||९-६||\",\"verse\":{\"sanskrit\":\"यथाकाशस्थितो नित्यं वायुः सर्वत्रगो महान् | तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय ||९-६||\",\"translation\":\"9.6 As the mighty wind, moving everywhere, rests always in the ether, even so, know thou that all beings rest in Me.\",\"transliteration\":\"yathākāśasthito nityaṃ vāyuḥ sarvatrago mahān . tathā sarvāṇi bhūtāni matsthānītyupadhāraya ||9-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 7\",\"description\":\"Bhagavad Gita Chapter 9 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 7\",\"description\":\"Bhagavad Gita Chapter 9 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 7\",\"Gita 9.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-7\"},\"introduction\":\"$5b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 7\",\"description\":\"Bhagavad Gita Chapter 9 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-7\"},\"philosophical_explanation\":\"$5c\",\"scripture_text\":\"सर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम् | कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम् ||९-७||\",\"verse\":{\"sanskrit\":\"सर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम् | कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम् ||९-७||\",\"translation\":\"9.7 All beings, O Arjuna, go into My Nature at the end of a Kalpa; I send them forth again at the beginning of (the next) Kalpa.\",\"transliteration\":\"sarvabhūtāni kaunteya prakṛtiṃ yānti māmikām . kalpakṣaye punastāni kalpādau visṛjāmyaham ||9-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 8\",\"description\":\"Bhagavad Gita Chapter 9 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 8\",\"description\":\"Bhagavad Gita Chapter 9 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 9 Verse 8\",\"Gita 9.8\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-8\"},\"introduction\":\"$5d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 9 Verse 8\",\"description\":\"Bhagavad Gita Chapter 9 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-9/verse-8\"},\"philosophical_explanation\":\"$5e\",\"scripture_text\":\"प्रकृतिं स्वामवष्टभ्य विसृजामि पुनः पुनः | भूतग्राममिमं कृत्स्नमवशं प्रकृतेर्वशात् ||९-८||\",\"verse\":{\"sanskrit\":\"प्रकृतिं स्वामवष्टभ्य विसृजामि पुनः पुनः | भूतग्राममिमं कृत्स्नमवशं प्रकृतेर्वशात् ||९-८||\",\"translation\":\"9.8 Animating My Nature, I again and again send forth all this multitude of beings, helpless by the force of the Nature.\",\"transliteration\":\"prakṛtiṃ svāmavaṣṭabhya visṛjāmi punaḥ punaḥ . bhūtagrāmamimaṃ kṛtsnamavaśa
