\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-1\"},\"introduction\":\"$1d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 1\",\"description\":\"Bhagavad Gita Chapter 14 Verse 1 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-1\"},\"philosophical_explanation\":\"$1e\",\"scripture_text\":\"श्रीभगवानुवाच | परं भूयः प्रवक्ष्यामि ज्ञानानां ज्ञानमुत्तमम् | यज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः ||१४-१||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | परं भूयः प्रवक्ष्यामि ज्ञानानां ज्ञानमुत्तमम् | यज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः ||१४-१||\",\"translation\":\"14.1 The Blessed Lord said I will again declare (to thee) that supreme knowledge, the best of all knowledge, having known which all the sages have gone to the supreme perfection after this life.\",\"transliteration\":\"śrībhagavānuvāca . paraṃ bhūyaḥ pravakṣyāmi jñānānāṃ jñānamuttamam . yajjñātvā munayaḥ sarve parāṃ siddhimito gatāḥ ||14-1||\"}}},\"verse10\":{\"verse10\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 10\",\"description\":\"Bhagavad Gita Chapter 14 Verse 10 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 10\",\"description\":\"Bhagavad Gita Chapter 14 Verse 10 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-10\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 10\",\"Gita 14.10\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-10\"},\"introduction\":\"$1f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 10\",\"description\":\"Bhagavad Gita Chapter 14 Verse 10 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-10\"},\"philosophical_explanation\":\"$20\",\"scripture_text\":\"रजस्तमश्चाभिभूय सत्त्वं भवति भारत | रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा ||१४-१०||\",\"verse\":{\"sanskrit\":\"रजस्तमश्चाभिभूय सत्त्वं भवति भारत | रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा ||१४-१०||\",\"translation\":\"14.10 Now Sattva arises (prevails), O Arjuna, having overpowered Rajas and Tamas; nor Rajas, having overpowered Sattva and Tamas; and now Tamas, having overpowered Sattva and Rajas.\",\"transliteration\":\"rajastamaścābhibhūya sattvaṃ bhavati bhārata . rajaḥ sattvaṃ tamaścaiva tamaḥ sattvaṃ rajastathā ||14-10||\"}}},\"verse11\":{\"verse11\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 11\",\"description\":\"Bhagavad Gita Chapter 14 Verse 11 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 11\",\"description\":\"Bhagavad Gita Chapter 14 Verse 11 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-11\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 11\",\"Gita 14.11\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-11\"},\"introduction\":\"$21\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 11\",\"description\":\"Bhagavad Gita Chapter 14 Verse 11 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-11\"},\"philosophical_explanation\":\"$22\",\"scripture_text\":\"सर्वद्वारेषु देहेऽस्मिन्प्रकाश उपजायते | ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत ||१४-११||\",\"verse\":{\"sanskrit\":\"सर्वद्वारेषु देहेऽस्मिन्प्रकाश उपजायते | ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत ||१४-११||\",\"translation\":\"14.11 When through every gate (sense) in this body, the wisdom-light shines, then it may be known that Sattva is predominant.\",\"transliteration\":\"sarvadvāreṣu dehe.asminprakāśa upajāyate . jñānaṃ yadā tadā vidyādvivṛddhaṃ sattvamityuta ||14-11||\"}}},\"verse12\":{\"verse12\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 12\",\"description\":\"Bhagavad Gita Chapter 14 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 12\",\"description\":\"Bhagavad Gita Chapter 14 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-12\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 12\",\"Gita 14.12\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-12\"},\"introduction\":\"$23\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 12\",\"description\":\"Bhagavad Gita Chapter 14 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-12\"},\"philosophical_explanation\":\"$24\",\"scripture_text\":\"लोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा | रजस्येतानि जायन्ते विवृद्धे भरतर्षभ ||१४-१२||\",\"verse\":{\"sanskrit\":\"लोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा | रजस्येतानि जायन्ते विवृद्धे भरतर्षभ ||१४-१२||\",\"translation\":\"14.12 Greed, activity, the undertaking of actions, restlessness, longing these arise when Rajas is predominant, O Arjuna.\",\"transliteration\":\"lobhaḥ pravṛttirārambhaḥ karmaṇāmaśamaḥ spṛhā . rajasyetāni jāyante vivṛddhe bharatarṣabha ||14-12||\"}}},\"verse13\":{\"verse13\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 13\",\"description\":\"Bhagavad Gita Chapter 14 Verse 13 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 13\",\"description\":\"Bhagavad Gita Chapter 14 Verse 13 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-13\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 13\",\"Gita 14.13\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-13\"},\"introduction\":\"$25\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 13\",\"description\":\"Bhagavad Gita Chapter 14 Verse 13 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-13\"},\"philosophical_explanation\":\"$26\",\"scripture_text\":\"अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च | तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन ||१४-१३||\",\"verse\":{\"sanskrit\":\"अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च | तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन ||१४-१३||\",\"translation\":\"14.13 Darkness, inertness, heedlessness and delusion these arise when Tamas is predominant, O Arjuna.\",\"transliteration\":\"aprakāśo.apravṛttiśca pramādo moha eva ca . tamasyetāni jāyante vivṛddhe kurunandana ||14-13||\"}}},\"verse14\":{\"verse14\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 14\",\"description\":\"Bhagavad Gita Chapter 14 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 14\",\"description\":\"Bhagavad Gita Chapter 14 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 14\",\"Gita 14.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 14\",\"description\":\"Bhagavad Gita Chapter 14 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"यदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत् | तदोत्तमविदां लोकानमलान्प्रतिपद्यते ||१४-१४||\",\"verse\":{\"sanskrit\":\"यदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत् | तदोत्तमविदां लोकानमलान्प्रतिपद्यते ||१४-१४||\",\"translation\":\"14.14 If the embodied one meets with death when Sattva is predominant, then he attains to the spotless worlds of the knowers of the Highest.\",\"transliteration\":\"yadā sattve pravṛddhe tu pralayaṃ yāti dehabhṛt . tadottamavidāṃ lokānamalānpratipadyate ||14-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 15\",\"description\":\"Bhagavad Gita Chapter 14 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 15\",\"description\":\"Bhagavad Gita Chapter 14 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 15\",\"Gita 14.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 15\",\"description\":\"Bhagavad Gita Chapter 14 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते | तथा प्रलीनस्तमसि मूढयोनिषु जायते ||१४-१५||\",\"verse\":{\"sanskrit\":\"रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते | तथा प्रलीनस्तमसि मूढयोनिषु जायते ||१४-१५||\",\"translation\":\"14.15 Meeting death in Rajas, he is born among those who are attached to action; and dying in Tamas, he is born in the womb of the senseless.\",\"transliteration\":\"rajasi pralayaṃ gatvā karmasaṅgiṣu jāyate . tathā pralīnastamasi mūḍhayoniṣu jāyate ||14-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 16\",\"description\":\"Bhagavad Gita Chapter 14 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 16\",\"description\":\"Bhagavad Gita Chapter 14 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 16\",\"Gita 14.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 16\",\"description\":\"Bhagavad Gita Chapter 14 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम् | रजसस्तु फलं दुःखमज्ञानं तमसः फलम् ||१४-१६||\",\"verse\":{\"sanskrit\":\"कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम् | रजसस्तु फलं दुःखमज्ञानं तमसः फलम् ||१४-१६||\",\"translation\":\"14.16 The fruit of good action, they say, is Sattvic and pure, verily the fruit of Rajas is pain, and ignorance is the fruit of Tamas.\",\"transliteration\":\"karmaṇaḥ sukṛtasyāhuḥ sāttvikaṃ nirmalaṃ phalam . rajasastu phalaṃ duḥkhamajñānaṃ tamasaḥ phalam ||14-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 17\",\"description\":\"Bhagavad Gita Chapter 14 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 17\",\"description\":\"Bhagavad Gita Chapter 14 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 17\",\"Gita 14.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 17\",\"description\":\"Bhagavad Gita Chapter 14 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च | प्रमादमोहौ तमसो भवतोऽज्ञानमेव च ||१४-१७||\",\"verse\":{\"sanskrit\":\"सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च | प्रमादमोहौ तमसो भवतोऽज्ञानमेव च ||१४-१७||\",\"translation\":\"14.17 From Sattva arises knowledge, and greed from Rajas; heedlessness and delusion arise from Tamas, and also ignorance.\",\"transliteration\":\"sattvātsañjāyate jñānaṃ rajaso lobha eva ca . pramādamohau tamaso bhavato.ajñānameva ca ||14-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 18\",\"description\":\"Bhagavad Gita Chapter 14 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 18\",\"description\":\"Bhagavad Gita Chapter 14 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 18\",\"Gita 14.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 18\",\"description\":\"Bhagavad Gita Chapter 14 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः | जघन्यगुणवृत्तिस्था अधो गच्छन्ति तामसाः ||१४-१८||\",\"verse\":{\"sanskrit\":\"ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः | जघन्यगुणवृत्तिस्था अधो गच्छन्ति तामसाः ||१४-१८||\",\"translation\":\"14.18 Those who are seated in Sattva go upwards; the Rajasic dwell in the middle; and the Tamasic, abiding in the function of the lowest Guna, go downwards.\",\"transliteration\":\"ūrdhvaṃ gacchanti sattvasthā madhye tiṣṭhanti rājasāḥ . jaghanyaguṇavṛttisthā adho gacchanti tāmasāḥ ||14-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 19\",\"description\":\"Bhagavad Gita Chapter 14 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 19\",\"description\":\"Bhagavad Gita Chapter 14 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 19\",\"Gita 14.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 19\",\"description\":\"Bhagavad Gita Chapter 14 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"नान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति | गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति ||१४-१९||\",\"verse\":{\"sanskrit\":\"नान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति | गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति ||१४-१९||\",\"translation\":\"14.19 When the seer beholds no agent other than the Gunas and knows That which is higher than they, he attains to My Being.\",\"transliteration\":\"nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭānupaśyati . guṇebhyaśca paraṃ vetti madbhāvaṃ so.adhigacchati ||14-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 2\",\"description\":\"Bhagavad Gita Chapter 14 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 2\",\"description\":\"Bhagavad Gita Chapter 14 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 2\",\"Gita 14.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 2\",\"description\":\"Bhagavad Gita Chapter 14 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"इदं ज्ञानमुपाश्रित्य मम साधर्म्यमागताः | सर्गेऽपि नोपजायन्ते प्रलये न व्यथन्ति च ||१४-२||\",\"verse\":{\"sanskrit\":\"इदं ज्ञानमुपाश्रित्य मम साधर्म्यमागताः | सर्गेऽपि नोपजायन्ते प्रलये न व्यथन्ति च ||१४-२||\",\"translation\":\"14.2 They who, having taken refuge in this knowledge, have attained to unity with Me, are neither born at the time of creation nor are they disturbed at the time of dissolution.\",\"transliteration\":\"idaṃ jñānamupāśritya mama sādharmyamāgatāḥ . sarge.api nopajāyante pralaye na vyathanti ca ||14-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 20\",\"description\":\"Bhagavad Gita Chapter 14 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 20\",\"description\":\"Bhagavad Gita Chapter 14 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 20\",\"Gita 14.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 20\",\"description\":\"Bhagavad Gita Chapter 14 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"गुणानेतानतीत्य त्रीन्देही देहसमुद्भवान् | जन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते ||१४-२०||\",\"verse\":{\"sanskrit\":\"गुणानेतानतीत्य त्रीन्देही देहसमुद्भवान् | जन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते ||१४-२०||\",\"translation\":\"14.20 The embodied one having crossed beyond these three Gunas out of which the body is evolved, is freed from birth, death, decay and pain, and attains to immortality.\",\"transliteration\":\"guṇānetānatītya trīndehī dehasamudbhavān . janmamṛtyujarāduḥkhairvimukto.amṛtamaśnute ||14-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 21\",\"description\":\"Bhagavad Gita Chapter 14 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 21\",\"description\":\"Bhagavad Gita Chapter 14 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 21\",\"Gita 14.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 21\",\"description\":\"Bhagavad Gita Chapter 14 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"अर्जुन उवाच | कैर्लिङ्गैस्त्रीन्गुणानेतानतीतो भवति प्रभो | किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते ||१४-२१||\",\"verse\":{\"sanskrit\":\"अर्जुन उवाच | कैर्लिङ्गैस्त्रीन्गुणानेतानतीतो भवति प्रभो | किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते ||१४-२१||\",\"translation\":\"14.21 Arjuna said What are the marks of him who has transcended the three alities, O Lord? What is his conduct and how does he go beyond these three alities?\",\"transliteration\":\"arjuna uvāca . kairliṅgaistrīnguṇānetānatīto bhavati prabho . kimācāraḥ kathaṃ caitāṃstrīnguṇānativartate ||14-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 22\",\"description\":\"Bhagavad Gita Chapter 14 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 22\",\"description\":\"Bhagavad Gita Chapter 14 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 22\",\"Gita 14.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 22\",\"description\":\"Bhagavad Gita Chapter 14 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"श्रीभगवानुवाच | प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव | न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति ||१४-२२||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव | न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति ||१४-२२||\",\"translation\":\"14.22 The Blessed Lord said When light, activity and delusion are present, he hates them not, nor does he long for them when they are absent.\",\"transliteration\":\"śrībhagavānuvāca . prakāśaṃ ca pravṛttiṃ ca mohameva ca pāṇḍava . na dveṣṭi sampravṛttāni na nivṛttāni kāṅkṣati ||14-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 23\",\"description\":\"Bhagavad Gita Chapter 14 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 23\",\"description\":\"Bhagavad Gita Chapter 14 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 23\",\"Gita 14.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 23\",\"description\":\"Bhagavad Gita Chapter 14 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"उदासीनवदासीनो गुणैर्यो न विचाल्यते | गुणा वर्तन्त इत्येवं योऽवतिष्ठति नेङ्गते ||१४-२३||\",\"verse\":{\"sanskrit\":\"उदासीनवदासीनो गुणैर्यो न विचाल्यते | गुणा वर्तन्त इत्येवं योऽवतिष्ठति नेङ्गते ||१४-२३||\",\"translation\":\"14.23 He who, seated like one unconcerned, is not moved by the alities, and who, knowing that the alities are active, is self-centred and moves not.\",\"transliteration\":\"udāsīnavadāsīno guṇairyo na vicālyate . guṇā vartanta ityevaṃ yo.avatiṣṭhati neṅgate ||14-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 24\",\"description\":\"Bhagavad Gita Chapter 14 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 24\",\"description\":\"Bhagavad Gita Chapter 14 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 24\",\"Gita 14.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 24\",\"description\":\"Bhagavad Gita Chapter 14 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः | तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः ||१४-२४||\",\"verse\":{\"sanskrit\":\"समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः | तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः ||१४-२४||\",\"translation\":\"14.24 Who is the same in pleasure and pain, who dwells in the Self, to whom a clod of earth, stone and gold are alike, who is the same to the dear and the unfriendly, who is firm, and to whom censure and praise are as one.\",\"transliteration\":\"samaduḥkhasukhaḥ svasthaḥ samaloṣṭāśmakāñcanaḥ . tulyapriyāpriyo dhīrastulyanindātmasaṃstutiḥ ||14-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 25\",\"description\":\"Bhagavad Gita Chapter 14 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 25\",\"description\":\"Bhagavad Gita Chapter 14 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 25\",\"Gita 14.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 25\",\"description\":\"Bhagavad Gita Chapter 14 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः | सर्वारम्भपरित्यागी गुणातीतः स उच्यते ||१४-२५||\",\"verse\":{\"sanskrit\":\"मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः | सर्वारम्भपरित्यागी गुणातीतः स उच्यते ||१४-२५||\",\"translation\":\"14.25 Who is the same in honour and dishonour, the same to friend and foe, abandoning all undertakings he is said to have transcended the alities.\",\"transliteration\":\"mānāpamānayostulyastulyo mitrāripakṣayoḥ . sarvārambhaparityāgī guṇātītaḥ sa ucyate ||14-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 26\",\"description\":\"Bhagavad Gita Chapter 14 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 26\",\"description\":\"Bhagavad Gita Chapter 14 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 26\",\"Gita 14.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 26\",\"description\":\"Bhagavad Gita Chapter 14 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"मां च योऽव्यभिचारेण भक्तियोगेन सेवते | स गुणान्समतीत्यैतान्ब्रह्मभूयाय कल्पते ||१४-२६||\",\"verse\":{\"sanskrit\":\"मां च योऽव्यभिचारेण भक्तियोगेन सेवते | स गुणान्समतीत्यैतान्ब्रह्मभूयाय कल्पते ||१४-२६||\",\"translation\":\"14.26 And he who serves Me with unswerving devotion, he, crossing beyond the alities, is fit for becoming Brahman.\",\"transliteration\":\"māṃ ca yo.avyabhicāreṇa bhaktiyogena sevate . sa guṇānsamatītyaitānbrahmabhūyāya kalpate ||14-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 27\",\"description\":\"Bhagavad Gita Chapter 14 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 27\",\"description\":\"Bhagavad Gita Chapter 14 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 27\",\"Gita 14.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 27\",\"description\":\"Bhagavad Gita Chapter 14 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"ब्रह्मणो हि प्रतिष्ठाहममृतस्याव्ययस्य च | शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च ||१४-२७||\",\"verse\":{\"sanskrit\":\"ब्रह्मणो हि प्रतिष्ठाहममृतस्याव्ययस्य च | शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च ||१४-२७||\",\"translation\":\"14.27 For I am the abode of Brahman, the immortal and the immutable, of everlasting Dharma and of absolute bliss.\",\"transliteration\":\"brahmaṇo hi pratiṣṭhāhamamṛtasyāvyayasya ca . śāśvatasya ca dharmasya sukhasyaikāntikasya ca ||14-27||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 3\",\"description\":\"Bhagavad Gita Chapter 14 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 3\",\"description\":\"Bhagavad Gita Chapter 14 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 3\",\"Gita 14.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-3\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 3\",\"description\":\"Bhagavad Gita Chapter 14 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-3\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"मम योनिर्महद् ब्रह्म तस्मिन्गर्भं दधाम्यहम् | सम्भवः सर्वभूतानां ततो भवति भारत ||१४-३||\",\"verse\":{\"sanskrit\":\"मम योनिर्महद् ब्रह्म तस्मिन्गर्भं दधाम्यहम् | सम्भवः सर्वभूतानां ततो भवति भारत ||१४-३||\",\"translation\":\"14.3 My womb is the great Brahma; in that I place the germ; thence, O Arjuna, is the birth of all beings.\",\"transliteration\":\"mama yonirmahad brahma tasmingarbhaṃ dadhāmyaham . sambhavaḥ sarvabhūtānāṃ tato bhavati bhārata ||14-3||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 4\",\"description\":\"Bhagavad Gita Chapter 14 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 4\",\"description\":\"Bhagavad Gita Chapter 14 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 4\",\"Gita 14.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-4\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 4\",\"description\":\"Bhagavad Gita Chapter 14 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-4\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः | तासां ब्रह्म महद्योनिरहं बीजप्रदः पिता ||१४-४||\",\"verse\":{\"sanskrit\":\"सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः | तासां ब्रह्म महद्योनिरहं बीजप्रदः पिता ||१४-४||\",\"translation\":\"14.4 Whatever forms are produced, O Arjuna, in any womb whatsoever, the great Brahma is their womb and I am the seed-giving father.\",\"transliteration\":\"sarvayoniṣu kaunteya mūrtayaḥ sambhavanti yāḥ . tāsāṃ brahma mahadyonirahaṃ bījapradaḥ pitā ||14-4||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 5\",\"description\":\"Bhagavad Gita Chapter 14 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 5\",\"description\":\"Bhagavad Gita Chapter 14 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 5\",\"Gita 14.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-5\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 5\",\"description\":\"Bhagavad Gita Chapter 14 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-5\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः | निबध्नन्ति महाबाहो देहे देहिनमव्ययम् ||१४-५||\",\"verse\":{\"sanskrit\":\"सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः | निबध्नन्ति महाबाहो देहे देहिनमव्ययम् ||१४-५||\",\"translation\":\"14.5 Purity, passion and inertia these alities, O Arjuna, born of Nature, bind fast in the body, the embodied, the indestructible.\",\"transliteration\":\"sattvaṃ rajastama iti guṇāḥ prakṛtisambhavāḥ . nibadhnanti mahābāho dehe dehinamavyayam ||14-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 6\",\"description\":\"Bhagavad Gita Chapter 14 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 6\",\"description\":\"Bhagavad Gita Chapter 14 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 6\",\"Gita 14.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-6\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 6\",\"description\":\"Bhagavad Gita Chapter 14 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-6\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम् | सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ ||१४-६||\",\"verse\":{\"sanskrit\":\"तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम् | सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ ||१४-६||\",\"translation\":\"14.6 Of these, Sattva, which from its stainlessness is luminous and healthy, binds by attachment to happiness and by attachment to knowledge, O sinless one.\",\"transliteration\":\"tatra sattvaṃ nirmalatvātprakāśakamanāmayam . sukhasaṅgena badhnāti jñānasaṅgena cānagha ||14-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 7\",\"description\":\"Bhagavad Gita Chapter 14 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 7\",\"description\":\"Bhagavad Gita Chapter 14 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 7\",\"Gita 14.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-7\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 7\",\"description\":\"Bhagavad Gita Chapter 14 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-7\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम् | तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ||१४-७||\",\"verse\":{\"sanskrit\":\"रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम् | तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ||१४-७||\",\"translation\":\"14.7 Know thou Rajas to be of the nature of passion, the source of thirst (for sensual enjoyment) and attachment; it binds fast, O Arjuna, the embodied one by attachment to action.\",\"transliteration\":\"rajo rāgātmakaṃ viddhi tṛṣṇāsaṅgasamudbhavam . tannibadhnāti kaunteya karmasaṅgena dehinam ||14-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 8\",\"description\":\"Bhagavad Gita Chapter 14 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 8\",\"description\":\"Bhagavad Gita Chapter 14 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 8\",\"Gita 14.8\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-8\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 8\",\"description\":\"Bhagavad Gita Chapter 14 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-8\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् | प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत ||१४-८||\",\"verse\":{\"sanskrit\":\"तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् | प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत ||१४-८||\",\"translation\":\"14.8 But know thou Tamas to be born of ignorance, deluding all embodied beings; it binds fast, O Arjuna, by heedlessness, indolence and sleep.\",\"transliteration\":\"tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām . pramādālasyanidrābhistannibadhnāti bhārata ||14-8||\"}}},\"verse9\":{\"verse9\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 9\",\"description\":\"Bhagavad Gita Chapter 14 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 9\",\"description\":\"Bhagavad Gita Chapter 14 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-9\",\"keywords\":[\"Bhagavad Gita Chapter 14 Verse 9\",\"Gita 14.9\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-9\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 14 Verse 9\",\"description\":\"Bhagavad Gita Chapter 14 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-14/verse-9\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत | ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत ||१४-९||\",\"verse\":{\"sanskrit\":\"सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत | ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत ||१४-९||\",\"translation\":\"14.9 Sattva attaches to happiness, Rajas to action, O Arjuna, while Tamas verily shrouding knowledge attaches to heedlessness.\",\"transliteration\":\"sattvaṃ sukhe sañjayati rajaḥ karmaṇi bhārata . jñānamāvṛtya tu tamaḥ pramāde sañjayatyuta ||14-9||\"}}}},\"initialLocale\":\"en\",\"chapter\":[\"chapter14\"]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"53:I[27201,[\"/_next/static/chunks/03r18pp~9shb1.js\",\"/_next/static/chunks/06zzw9vfd8b8u.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"Bhagavad Gita - Complete Guide, Chapters, Teachings \u0026 Philosophy | Sanatana\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Explore the Bhagavad Gita, the sacred dialogue between Krishna and Arjuna. Discover its 18 chapters, core teachings on karma, dharma, yoga, and spiritual wisdom.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"bhagavad gita, krishna, arjuna, gita chapters, karma yoga, bhakti yoga, jnana yoga, hindu philosophy, dharma, spiritual teachings\"}],[\"$\",\"link\",\"4\",{\"rel\":\"canonical\",\"href\":\"https://sanatanadharmam.in/itihasa/bhagavadgita/\"}],[\"$
