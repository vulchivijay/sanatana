anskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 14\",\"Gita 6.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 14\",\"description\":\"Bhagavad Gita Chapter 6 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"प्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते स्थितः | मनः संयम्य मच्चित्तो युक्त आसीत मत्परः ||६-१४||\",\"verse\":{\"sanskrit\":\"प्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते स्थितः | मनः संयम्य मच्चित्तो युक्त आसीत मत्परः ||६-१४||\",\"translation\":\"6.14 Serene-minded, fearless, firm in the vow of a Brahmachari, having controlled the mind, thinking of Me and balanced in mind, let him sit, having Me as his supreme goal.\",\"transliteration\":\"praśāntātmā vigatabhīrbrahmacārivrate sthitaḥ . manaḥ saṃyamya maccitto yukta āsīta matparaḥ ||6-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 15\",\"description\":\"Bhagavad Gita Chapter 6 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 15\",\"description\":\"Bhagavad Gita Chapter 6 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 15\",\"Gita 6.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 15\",\"description\":\"Bhagavad Gita Chapter 6 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"युञ्जन्नेवं सदात्मानं योगी नियतमानसः | शान्तिं निर्वाणपरमां मत्संस्थामधिगच्छति ||६-१५||\",\"verse\":{\"sanskrit\":\"युञ्जन्नेवं सदात्मानं योगी नियतमानसः | शान्तिं निर्वाणपरमां मत्संस्थामधिगच्छति ||६-१५||\",\"translation\":\"6.15 Thus always keeping the mind balanced, the Yogi, with the mind controlled, attains to the peace abiding in Me, which culminates in liberation.\",\"transliteration\":\"yuñjannevaṃ sadātmānaṃ yogī niyatamānasaḥ . śāntiṃ nirvāṇaparamāṃ matsaṃsthāmadhigacchati ||6-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 16\",\"description\":\"Bhagavad Gita Chapter 6 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 16\",\"description\":\"Bhagavad Gita Chapter 6 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 16\",\"Gita 6.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 16\",\"description\":\"Bhagavad Gita Chapter 6 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः | न चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन ||६-१६||\",\"verse\":{\"sanskrit\":\"नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः | न चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन ||६-१६||\",\"translation\":\"6.16 Verily Yoga is not possible for him who eats too much, nor for him who does not eat at all, nor for him who sleeps too much, nor for him who is (always) awake, O Arjuna.\",\"transliteration\":\"nātyaśnatastu yogo.asti na caikāntamanaśnataḥ . na cātisvapnaśīlasya jāgrato naiva cārjuna ||6-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 17\",\"description\":\"Bhagavad Gita Chapter 6 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 17\",\"description\":\"Bhagavad Gita Chapter 6 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 17\",\"Gita 6.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 17\",\"description\":\"Bhagavad Gita Chapter 6 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु | युक्तस्वप्नावबोधस्य योगो भवति दुःखहा ||६-१७||\",\"verse\":{\"sanskrit\":\"युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु | युक्तस्वप्नावबोधस्य योगो भवति दुःखहा ||६-१७||\",\"translation\":\"6.17 Yoga becomes the destroyer of pain for him who is moderate in eating and recreation (such as walking, etc.), who is moderate in exertion in actions, who is moderate in sleep and wakefulness.\",\"transliteration\":\"yuktāhāravihārasya yuktaceṣṭasya karmasu . yuktasvapnāvabodhasya yogo bhavati duḥkhahā ||6-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 18\",\"description\":\"Bhagavad Gita Chapter 6 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 18\",\"description\":\"Bhagavad Gita Chapter 6 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 18\",\"Gita 6.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 18\",\"description\":\"Bhagavad Gita Chapter 6 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"यदा विनियतं चित्तमात्मन्येवावतिष्ठते | निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा ||६-१८||\",\"verse\":{\"sanskrit\":\"यदा विनियतं चित्तमात्मन्येवावतिष्ठते | निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा ||६-१८||\",\"translation\":\"6.18 When the perfectly controlled mind rests in the Self only, free from longing for all the objects of desires, then it is said, 'He is united'.\",\"transliteration\":\"yadā viniyataṃ cittamātmanyevāvatiṣṭhate . niḥspṛhaḥ sarvakāmebhyo yukta ityucyate tadā ||6-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 19\",\"description\":\"Bhagavad Gita Chapter 6 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 19\",\"description\":\"Bhagavad Gita Chapter 6 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 19\",\"Gita 6.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 19\",\"description\":\"Bhagavad Gita Chapter 6 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता | योगिनो यतचित्तस्य युञ्जतो योगमात्मनः ||६-१९||\",\"verse\":{\"sanskrit\":\"यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता | योगिनो यतचित्तस्य युञ्जतो योगमात्मनः ||६-१९||\",\"translation\":\"6.19 As a lamp placed in a windless spot does not flicker to such is compared the Yogi of controlled mind, practising Yoga in the Self (or absorbed in the Yoga of the Self).\",\"transliteration\":\"yathā dīpo nivātastho neṅgate sopamā smṛtā . yogino yatacittasya yuñjato yogamātmanaḥ ||6-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 2\",\"description\":\"Bhagavad Gita Chapter 6 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 2\",\"description\":\"Bhagavad Gita Chapter 6 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 2\",\"Gita 6.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 2\",\"description\":\"Bhagavad Gita Chapter 6 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव | न ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन ||६-२||\",\"verse\":{\"sanskrit\":\"यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव | न ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन ||६-२||\",\"translation\":\"6.2 Do thou, O Arjuna, know Yoga to be that which they call renunciation; no one verily becomes a Yogi who has not renounced thoughts.\",\"transliteration\":\"yaṃ saṃnyāsamiti prāhuryogaṃ taṃ viddhi pāṇḍava . na hyasaṃnyastasaṅkalpo yogī bhavati kaścana ||6-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 20\",\"description\":\"Bhagavad Gita Chapter 6 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 20\",\"description\":\"Bhagavad Gita Chapter 6 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 20\",\"Gita 6.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 20\",\"description\":\"Bhagavad Gita Chapter 6 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"यत्रोपरमते चित्तं निरुद्धं योगसेवया | यत्र चैवात्मनात्मानं पश्यन्नात्मनि तुष्यति ||६-२०||\",\"verse\":{\"sanskrit\":\"यत्रोपरमते चित्तं निरुद्धं योगसेवया | यत्र चैवात्मनात्मानं पश्यन्नात्मनि तुष्यति ||६-२०||\",\"translation\":\"6.20 When the mind, restrained by the practice of Yoga attains to quietude and when seeing the Self by the self, he is satisfied in his own Self.\",\"transliteration\":\"yatroparamate cittaṃ niruddhaṃ yogasevayā . yatra caivātmanātmānaṃ paśyannātmani tuṣyati ||6-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 21\",\"description\":\"Bhagavad Gita Chapter 6 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 21\",\"description\":\"Bhagavad Gita Chapter 6 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 21\",\"Gita 6.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 21\",\"description\":\"Bhagavad Gita Chapter 6 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"सुखमात्यन्तिकं यत्तद् बुद्धिग्राह्यमतीन्द्रियम् | वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः ||६-२१||\",\"verse\":{\"sanskrit\":\"सुखमात्यन्तिकं यत्तद् बुद्धिग्राह्यमतीन्द्रियम् | वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः ||६-२१||\",\"translation\":\"6.21 When he (the Yogi) feels that Infinite Bliss which can be grasped by the (pure) intellect and which transcends the senses, and established wherein he never moves from the Reality.\",\"transliteration\":\"sukhamātyantikaṃ yattad buddhigrāhyamatīndriyam . vetti yatra na caivāyaṃ sthitaścalati tattvataḥ ||6-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 22\",\"description\":\"Bhagavad Gita Chapter 6 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 22\",\"description\":\"Bhagavad Gita Chapter 6 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 22\",\"Gita 6.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 22\",\"description\":\"Bhagavad Gita Chapter 6 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः | यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते ||६-२२||\",\"verse\":{\"sanskrit\":\"यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः | यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते ||६-२२||\",\"translation\":\"6.22 Which, having obtained, he thinks there is no other gain superior to it; wherein estabished, he is not moved even by heavy sorrow.\",\"transliteration\":\"yaṃ labdhvā cāparaṃ lābhaṃ manyate nādhikaṃ tataḥ . yasminsthito na duḥkhena guruṇāpi vicālyate ||6-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 23\",\"description\":\"Bhagavad Gita Chapter 6 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 23\",\"description\":\"Bhagavad Gita Chapter 6 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 23\",\"Gita 6.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 23\",\"description\":\"Bhagavad Gita Chapter 6 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम् | स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा ||६-२३||\",\"verse\":{\"sanskrit\":\"तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम् | स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा ||६-२३||\",\"translation\":\"6.23 Let that be known by the name of Yoga, the severance from union with pain. This Yoga should be practised with determination and with an undesponding mind.\",\"transliteration\":\"taṃ vidyād duḥkhasaṃyogaviyogaṃ yogasaṃjñitam . sa niścayena yoktavyo yogo.anirviṇṇacetasā ||6-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 24\",\"description\":\"Bhagavad Gita Chapter 6 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 24\",\"description\":\"Bhagavad Gita Chapter 6 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 24\",\"Gita 6.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 24\",\"description\":\"Bhagavad Gita Chapter 6 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः | मनसैवेन्द्रियग्रामं विनियम्य समन्ततः ||६-२४||\",\"verse\":{\"sanskrit\":\"सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः | मनसैवेन्द्रियग्रामं विनियम्य समन्ततः ||६-२४||\",\"translation\":\"6.24 Abandoning without reserve all desires born of Sankalpa (thought and imagination) and completely restraining the whole group of the senses by the mind from all sides.\",\"transliteration\":\"saṅkalpaprabhavānkāmāṃstyaktvā sarvānaśeṣataḥ . manasaivendriyagrāmaṃ viniyamya samantataḥ ||6-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 25\",\"description\":\"Bhagavad Gita Chapter 6 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 25\",\"description\":\"Bhagavad Gita Chapter 6 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 25\",\"Gita 6.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 25\",\"description\":\"Bhagavad Gita Chapter 6 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"शनैः शनैरुपरमेद् बुद्ध्या धृतिगृहीतया | आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत् ||६-२५||\",\"verse\":{\"sanskrit\":\"शनैः शनैरुपरमेद् बुद्ध्या धृतिगृहीतया | आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत् ||६-२५||\",\"translation\":\"6.25 Little by little let him attain to ietude by the intellect held firmly; having made the mind establish itself in the Self, let him not think of anything.\",\"transliteration\":\"śanaiḥ śanairuparamed buddhyā dhṛtigṛhītayā . ātmasaṃsthaṃ manaḥ kṛtvā na kiñcidapi cintayet ||6-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 26\",\"description\":\"Bhagavad Gita Chapter 6 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 26\",\"description\":\"Bhagavad Gita Chapter 6 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 26\",\"Gita 6.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 26\",\"description\":\"Bhagavad Gita Chapter 6 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"यतो यतो निश्चरति मनश्चञ्चलमस्थिरम् | ततस्ततो नियम्यैतदात्मन्येव वशं नयेत् ||६-२६||\",\"verse\":{\"sanskrit\":\"यतो यतो निश्चरति मनश्चञ्चलमस्थिरम् | ततस्ततो नियम्यैतदात्मन्येव वशं नयेत् ||६-२६||\",\"translation\":\"6.26 From whatever cause the restless and unsteady mind wanders away, from that let him restrain it and bring it under the control of the Self alone.\",\"transliteration\":\"yato yato niścarati manaścañcalamasthiram . tatastato niyamyaitadātmanyeva vaśaṃ nayet ||6-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 27\",\"description\":\"Bhagavad Gita Chapter 6 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 27\",\"description\":\"Bhagavad Gita Chapter 6 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 27\",\"Gita 6.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 27\",\"description\":\"Bhagavad Gita Chapter 6 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम् | उपैति शान्तरजसं ब्रह्मभूतमकल्मषम् ||६-२७||\",\"verse\":{\"sanskrit\":\"प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम् | उपैति शान्तरजसं ब्रह्मभूतमकल्मषम् ||६-२७||\",\"translation\":\"6.27 Supreme Bliss verily comes to this Yogi whose mind is ite peaceful, whose passion is ieted, who has become Brahman and who is free from sin.\",\"transliteration\":\"praśāntamanasaṃ hyenaṃ yoginaṃ sukhamuttamam . upaiti śāntarajasaṃ brahmabhūtamakalmaṣam ||6-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 28\",\"description\":\"Bhagavad Gita Chapter 6 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 28\",\"description\":\"Bhagavad Gita Chapter 6 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 28\",\"Gita 6.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 28\",\"description\":\"Bhagavad Gita Chapter 6 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"युञ्जन्नेवं सदात्मानं योगी विगतकल्मषः | सुखेन ब्रह्मसंस्पर्शमत्यन्तं सुखमश्नुते ||६-२८||\",\"verse\":{\"sanskrit\":\"युञ्जन्नेवं सदात्मानं योगी विगतकल्मषः | सुखेन ब्रह्मसंस्पर्शमत्यन्तं सुखमश्नुते ||६-२८||\",\"translation\":\"6.28 The Yogi, always engaging the mind thus (in the practice of Yoga), freed from sins, easily enjoys the Infinite Bliss of contact with Brahman (the Eternal).\",\"transliteration\":\"yuñjannevaṃ sadātmānaṃ yogī vigatakalmaṣaḥ . sukhena brahmasaṃsparśamatyantaṃ sukhamaśnute ||6-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 29\",\"description\":\"Bhagavad Gita Chapter 6 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 29\",\"description\":\"Bhagavad Gita Chapter 6 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 29\",\"Gita 6.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 29\",\"description\":\"Bhagavad Gita Chapter 6 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि | ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः ||६-२९||\",\"verse\":{\"sanskrit\":\"सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि | ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः ||६-२९||\",\"translation\":\"6.29 With the mind harmonised by Yoga he sees the Self abiding in all beings and all beings in the Self; he sees the same everywhere.\",\"transliteration\":\"sarvabhūtasthamātmānaṃ sarvabhūtāni cātmani . īkṣate yogayuktātmā sarvatra samadarśanaḥ ||6-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 3\",\"description\":\"Bhagavad Gita Chapter 6 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 3\",\"description\":\"Bhagavad Gita Chapter 6 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 3\",\"Gita 6.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 3\",\"description\":\"Bhagavad Gita Chapter 6 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते | योगारूढस्य तस्यैव शमः कारणमुच्यते ||६-३||\",\"verse\":{\"sanskrit\":\"आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते | योगारूढस्य तस्यैव शमः कारणमुच्यते ||६-३||\",\"translation\":\"6.3 For a sage who wishes to attain to Yoga, action is said to be the means; for the same sage who has attained to Yoga, inaction (iescence) is said to be the means.\",\"transliteration\":\"ārurukṣormuneryogaṃ karma kāraṇamucyate . yogārūḍhasya tasyaiva śamaḥ kāraṇamucyate ||6-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 30\",\"description\":\"Bhagavad Gita Chapter 6 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 30\",\"description\":\"Bhagavad Gita Chapter 6 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 30\",\"Gita 6.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 30\",\"description\":\"Bhagavad Gita Chapter 6 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"यो मां पश्यति सर्वत्र सर्वं च मयि पश्यति | तस्याहं न प्रणश्यामि स च मे न प्रणश्यति ||६-३०||\",\"verse\":{\"sanskrit\":\"यो मां पश्यति सर्वत्र सर्वं च मयि पश्यति | तस्याहं न प्रणश्यामि स च मे न प्रणश्यति ||६-३०||\",\"translation\":\"6.30 He who sees Me everywhere and sees everything in Me, he never becomes separated from Me, nor do I become separated from him.\",\"transliteration\":\"yo māṃ paśyati sarvatra sarvaṃ ca mayi paśyati . tasyāhaṃ na praṇaśyāmi sa ca me na praṇaśyati ||6-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 31\",\"description\":\"Bhagavad Gita Chapter 6 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 31\",\"description\":\"Bhagavad Gita Chapter 6 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 31\",\"Gita 6.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 31\",\"description\":\"Bhagavad Gita Chapter 6 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"सर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः | सर्वथा वर्तमानोऽपि स योगी मयि वर्तते ||६-३१||\",\"verse\":{\"sanskrit\":\"सर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः | सर्वथा वर्तमानोऽपि स योगी मयि वर्तते ||६-३१||\",\"translation\":\"6.31 He who, being established in unity, worships Me Who dwells in all beings, that Yogi abides in Me, whatever may be his mode of living.\",\"transliteration\":\"sarvabhūtasthitaṃ yo māṃ bhajatyekatvamāsthitaḥ . sarvathā vartamāno.api sa yogī mayi vartate ||6-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 32\",\"description\":\"Bhagavad Gita Chapter 6 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 32\",\"description\":\"Bhagavad Gita Chapter 6 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 32\",\"Gita 6.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 32\",\"description\":\"Bhagavad Gita Chapter 6 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन | सुखं वा यदि वा दुःखं स योगी परमो मतः ||६-३२||\",\"verse\":{\"sanskrit\":\"आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन | सुखं वा यदि वा दुःखं स योगी परमो मतः ||६-३२||\",\"translation\":\"6.32 He who, through the likeness of the Self, O Arjuna, sees eality everywhere, be it pleasure or pain, he is regarded as the highest Yogi.\",\"transliteration\":\"ātmaupamyena sarvatra samaṃ paśyati yo.arjuna . sukhaṃ vā yadi vā duḥkhaṃ sa yogī paramo mataḥ ||6-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 33\",\"description\":\"Bhagavad Gita Chapter 6 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 33\",\"description\":\"Bhagavad Gita Chapter 6 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-33\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 33\",\"Gita 6.33\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-33\"},\"introduction\":\"$51\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 33\",\"description\":\"Bhagavad Gita Chapter 6 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-33\"},\"philosophical_explanation\":\"$52\",\"scripture_text\":\"अर्जुन उवाच | योऽयं योगस्त्वया प्रोक्तः साम्येन मधुसूदन | एतस्याहं न पश्यामि चञ्चलत्वात्स्थितिं स्थिराम् ||६-३३||\",\"verse\":{\"sanskrit\":\"अर्जुन उवाच | योऽयं योगस्त्वया प्रोक्तः साम्येन मधुसूदन | एतस्याहं न पश्यामि चञ्चलत्वात्स्थितिं स्थिराम् ||६-३३||\",\"translation\":\"6.33 Arjuna said This Yoga of eanimity taught by Thee, O Krishna, I do not see its steady continuance, because of the restlessness (of the mind).\",\"transliteration\":\"arjuna uvāca . yo.ayaṃ yogastvayā proktaḥ sāmyena madhusūdana . etasyāhaṃ na paśyāmi cañcalatvātsthitiṃ sthirām ||6-33||\"}}},\"verse34\":{\"verse34\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 34\",\"description\":\"Bhagavad Gita Chapter 6 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 34\",\"description\":\"Bhagavad Gita Chapter 6 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-34\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 34\",\"Gita 6.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 34\",\"description\":\"Bhagavad Gita Chapter 6 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"चञ्चलं हि मनः कृष्ण प्रमाथि बलवद् दृढम् | तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम् ||६-३४||\",\"verse\":{\"sanskrit\":\"चञ्चलं हि मनः कृष्ण प्रमाथि बलवद् दृढम् | तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम् ||६-३४||\",\"translation\":\"6.34 The mind verily is restless, turbulent, strong and unyielding, O Krishna: I deem it as difficult to control it as to control the wind.\",\"transliteration\":\"cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavad dṛḍham . tasyāhaṃ nigrahaṃ manye vāyoriva suduṣkaram ||6-34||\"}}},\"verse35\":{\"verse35\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 35\",\"description\":\"Bhagavad Gita Chapter 6 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 35\",\"description\":\"Bhagavad Gita Chapter 6 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-35\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 35\",\"Gita 6.35\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-35\"},\"introduction\":\"$55\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 35\",\"description\":\"Bhagavad Gita Chapter 6 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-35\"},\"philosophical_explanation\":\"$56\",\"scripture_text\":\"श्रीभगवानुवाच | असंशयं महाबाहो मनो दुर्निग्रहं चलम् | अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते ||६-३५||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | असंशयं महाबाहो मनो दुर्निग्रहं चलम् | अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते ||६-३५||\",\"translation\":\"6.35 The Blessed Lord said Undoubtedly, O mighty-armed Arjuna, the mind is difficult to control and restless; but by practice and by dispassion it may be restrained.\",\"transliteration\":\"śrībhagavānuvāca . asaṃśayaṃ mahābāho mano durnigrahaṃ calam . abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate ||6-35||\"}}},\"verse36\":{\"verse36\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 36\",\"description\":\"Bhagavad Gita Chapter 6 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 36\",\"description\":\"Bhagavad Gita Chapter 6 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-36\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 36\",\"Gita 6.36\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-36\"},\"introduction\":\"$57\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 36\",\"description\":\"Bhagavad Gita Chapter 6 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-36\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"असंयतात्मना योगो दुष्प्राप इति मे मतिः | वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः ||६-३६||\",\"verse\":{\"sanskrit\":\"असंयतात्मना योगो दुष्प्राप इति मे मतिः | वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः ||६-३६||\",\"translation\":\"6.36 I think Yoga is hard to be attained by one of uncontrolled self, but the self-controlled and striving one can attain to it by the (proper) means.\",\"transliteration\":\"asaṃyatātmanā yogo duṣprāpa iti me matiḥ . vaśyātmanā tu yatatā śakyo.avāptumupāyataḥ ||6-36||\"}}},\"verse37\":{\"verse37\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 37\",\"description\":\"Bhagavad Gita Chapter 6 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 37\",\"description\":\"Bhagavad Gita Chapter 6 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-37\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 37\",\"Gita 6.37\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-37\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 37\",\"description\":\"Bhagavad Gita Chapter 6 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-37\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"अर्जुन उवाच | अयतिः श्रद्धयोपेतो योगाच्चलितमानसः | अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति ||६-३७||\",\"verse\":{\"sanskrit\":\"अर्जुन उवाच | अयतिः श्रद्धयोपेतो योगाच्चलितमानसः | अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति ||६-३७||\",\"translation\":\"6.37 Arjuna said He who is unable to control himself though he has the faith, and whose mind wanders away from Yoga, what end does he, having failed to attain perfection in Yoga, mee,t O Krishna?\",\"transliteration\":\"arjuna uvāca . ayatiḥ śraddhayopeto yogāccalitamānasaḥ . aprāpya yogasaṃsiddhiṃ kāṃ gatiṃ kṛṣṇa gacchati ||6-37||\"}}},\"verse38\":{\"verse38\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 38\",\"description\":\"Bhagavad Gita Chapter 6 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 38\",\"description\":\"Bhagavad Gita Chapter 6 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-38\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 38\",\"Gita 6.38\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-38\"},\"introduction\":\"$5b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 38\",\"description\":\"Bhagavad Gita Chapter 6 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-38\"},\"philosophical_explanation\":\"$5c\",\"scripture_text\":\"कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव नश्यति | अप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि ||६-३८||\",\"verse\":{\"sanskrit\":\"कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव नश्यति | अप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि ||६-३८||\",\"translation\":\"Swami Sivananda did not comment on this sloka\",\"transliteration\":\"kaccinnobhayavibhraṣṭaśchinnābhramiva naśyati . apratiṣṭho mahābāho vimūḍho brahmaṇaḥ pathi ||6-38||\"}}},\"verse39\":{\"verse39\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 39\",\"description\":\"Bhagavad Gita Chapter 6 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 39\",\"description\":\"Bhagavad Gita Chapter 6 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-39\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 39\",\"Gita 6.39\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-39\"},\"introduction\":\"$5d\",\"openGraph\":{ Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-4\"},\"philosophical_explanation\":\"$60\",\"scripture_text\":\"यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते | सर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते ||६-४||\",\"verse\":{\"sanskrit\":\"यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते | सर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते ||६-४||\",\"translation\":\"6.4 When a man is not attached to the sense-objects or to actions, having renounced all thoughts, then he is said to have attained to Yoga.\",\"transliteration\":\"yadā hi nendriyārtheṣu na karmasvanuṣajjate . sarvasaṅkalpasaṃnyāsī yogārūḍhastadocyate ||6-4||\"}}},\"verse40\":{\"verse40\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 40\",\"description\":\"Bhagavad Gita Chapter 6 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 40\",\"description\":\"Bhagavad Gita Chapter 6 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-40\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 40\",\"Gita 6.40\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-40\"},\"introduction\":\"$61\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 40\",\"description\":\"Bhagavad Gita Chapter 6 Verse 40 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-40\"},\"philosophical_explanation\":\"$62\",\"scripture_text\":\"श्रीभगवानुवाच | पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते | न हि कल्याणकृत्कश्चिद् दुर्गतिं तात गच्छति ||६-४०||\",\"verse\":{\"sanskrit\":\"श्रीभगवानुवाच | पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते | न हि कल्याणकृत्कश्चिद् दुर्गतिं तात गच्छति ||६-४०||\",\"translation\":\"6.40 The Blessed Lord said O Arjuna, neither in this world, nor in the next world is there destruction for him; none, verily, who does good, O My son, ever comes to grief.\",\"transliteration\":\"śrībhagavānuvāca . pārtha naiveha nāmutra vināśastasya vidyate . na hi kalyāṇakṛtkaścid durgatiṃ tāta gacchati ||6-40||\"}}},\"verse41\":{\"verse41\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 41\",\"description\":\"Bhagavad Gita Chapter 6 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 41\",\"description\":\"Bhagavad Gita Chapter 6 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-41\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 41\",\"Gita 6.41\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-41\"},\"introduction\":\"$63\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 41\",\"description\":\"Bhagavad Gita Chapter 6 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-41\"},\"philosophical_explanation\":\"$64\",\"scripture_text\":\"प्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः | शुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते ||६-४१||\",\"verse\":{\"sanskrit\":\"प्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः | शुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते ||६-४१||\",\"translation\":\"6.41 Having attained to the worlds of the righteous and having dwelt there for everlasting years, he who fell from Yoga is rorn in a house of the pure and wealthy.\",\"transliteration\":\"prāpya puṇyakṛtāṃ lokānuṣitvā śāśvatīḥ samāḥ . śucīnāṃ śrīmatāṃ gehe yogabhraṣṭo.abhijāyate ||6-41||\"}}},\"verse42\":{\"verse42\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 42\",\"description\":\"Bhagavad Gita Chapter 6 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 42\",\"description\":\"Bhagavad Gita Chapter 6 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-42\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 42\",\"Gita 6.42\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-42\"},\"introduction\":\"$65\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 42\",\"description\":\"Bhagavad Gita Chapter 6 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-42\"},\"philosophical_explanation\":\"$66\",\"scripture_text\":\"अथवा योगिनामेव कुले भवति धीमताम् | एतद्धि दुर्लभतरं लोके जन्म यदीदृशम् ||६-४२||\",\"verse\":{\"sanskrit\":\"अथवा योगिनामेव कुले भवति धीमताम् | एतद्धि दुर्लभतरं लोके जन्म यदीदृशम् ||६-४२||\",\"translation\":\"6.42 Or he is born in a family of even the wise Yogis; verily a birth like this is very difficult to obtain in this world.\",\"transliteration\":\"athavā yogināmeva kule bhavati dhīmatām . etaddhi durlabhataraṃ loke janma yadīdṛśam ||6-42||\"}}},\"verse43\":{\"verse43\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 43\",\"description\":\"Bhagavad Gita Chapter 6 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 43\",\"description\":\"Bhagavad Gita Chapter 6 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-43\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 43\",\"Gita 6.43\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-43\"},\"introduction\":\"$67\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 43\",\"description\":\"Bhagavad Gita Chapter 6 Verse 43 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-43\"},\"philosophical_explanation\":\"$68\",\"scripture_text\":\"तत्र तं बुद्धिसंयोगं लभते पौर्वदेहिकम् | यतते च ततो भूयः संसिद्धौ कुरुनन्दन ||६-४३||\",\"verse\":{\"sanskrit\":\"तत्र तं बुद्धिसंयोगं लभते पौर्वदेहिकम् | यतते च ततो भूयः संसिद्धौ कुरुनन्दन ||६-४३||\",\"translation\":\"6.43 Thee he comes in touch with the knowledge acired in his former body and strives more than before for perfection, O Arjuna.\",\"transliteration\":\"tatra taṃ buddhisaṃyogaṃ labhate paurvadehikam . yatate ca tato bhūyaḥ saṃsiddhau kurunandana ||6-43||\"}}},\"verse44\":{\"verse44\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 44\",\"description\":\"Bhagavad Gita Chapter 6 Verse 44 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 44\",\"description\":\"Bhagavad Gita Chapter 6 Verse 44 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-44\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 44\",\"Gita 6.44\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-44\"},\"introduction\":\"$69\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 44\",\"description\":\"Bhagavad Gita Chapter 6 Verse 44 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-44\"},\"philosophical_explanation\":\"$6a\",\"scripture_text\":\"पूर्वाभ्यासेन तेनैव ह्रियते ह्यवशोऽपि सः | जिज्ञासुरपि योगस्य शब्दब्रह्मातिवर्तते ||६-४४||\",\"verse\":{\"sanskrit\":\"पूर्वाभ्यासेन तेनैव ह्रियते ह्यवशोऽपि सः | जिज्ञासुरपि योगस्य शब्दब्रह्मातिवर्तते ||६-४४||\",\"translation\":\"6.44 By that very former practice he is borne on in spite of himself. Even he who merely wishes to know Yoga goes beyond the Brahmic word.\",\"transliteration\":\"pūrvābhyāsena tenaiva hriyate hyavaśo.api saḥ . jijñāsurapi yogasya śabdabrahmātivartate ||6-44||\"}}},\"verse45\":{\"verse45\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 45\",\"description\":\"Bhagavad Gita Chapter 6 Verse 45 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 45\",\"description\":\"Bhagavad Gita Chapter 6 Verse 45 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-45\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 45\",\"Gita 6.45\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-45\"},\"introduction\":\"$6b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 45\",\"description\":\"Bhagavad Gita Chapter 6 Verse 45 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-45\"},\"philosophical_explanation\":\"$6c\",\"scripture_text\":\"प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः | अनेकजन्मसंसिद्धस्ततो याति परां गतिम् ||६-४५||\",\"verse\":{\"sanskrit\":\"प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः | अनेकजन्मसंसिद्धस्ततो याति परां गतिम् ||६-४५||\",\"translation\":\"6.45 But the Yogi who strives with assiduity, purified of sins and perfected gradually through many births, reaches the highest goal.\",\"transliteration\":\"prayatnādyatamānastu yogī saṃśuddhakilbiṣaḥ . anekajanmasaṃsiddhastato yāti parāṃ gatim ||6-45||\"}}},\"verse46\":{\"verse46\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 46\",\"description\":\"Bhagavad Gita Chapter 6 Verse 46 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 46\",\"description\":\"Bhagavad Gita Chapter hical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-47\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 47\",\"Gita 6.47\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-47\"},\"introduction\":\"$6f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 47\",\"description\":\"Bhagavad Gita Chapter 6 Verse 47 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-47\"},\"philosophical_explanation\":\"$70\",\"scripture_text\":\"योगिनामपि सर्वेषां मद्गतेनान्तरात्मना | श्रद्धावान्भजते यो मां स मे युक्ततमो मतः ||६-४७||\",\"verse\":{\"sanskrit\":\"योगिनामपि सर्वेषां मद्गतेनान्तरात्मना | श्रद्धावान्भजते यो मां स मे युक्ततमो मतः ||६-४७||\",\"translation\":\"6.47 And among all the Yogis he who, full of faith and with his inner self merged in Me, worships Me is deemed by Me to be the most devout.\",\"transliteration\":\"yogināmapi sarveṣāṃ madgatenāntarātmanā . śraddhāvānbhajate yo māṃ sa me yuktatamo mataḥ ||6-47||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 5\",\"description\":\"Bhagavad Gita Chapter 6 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 5\",\"description\":\"Bhagavad Gita Chapter 6 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 5\",\"Gita 6.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-5\"},\"introduction\":\"$71\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 5\",\"description\":\"Bhagavad Gita Chapter 6 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-5\"},\"philosophical_explanation\":\"$72\",\"scripture_text\":\"उद्धरेदात्मनात्मानं नात्मानमवसादयेत् | आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः ||६-५||\",\"verse\":{\"sanskrit\":\"उद्धरेदात्मनात्मानं नात्मानमवसादयेत् | आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः ||६-५||\",\"translation\":\"6.5 One should raise oneself by one's Self alone; let not one lower oneself; for the Self alone is the friend of oneself, and the Self alone is the enemy of oneself.\",\"transliteration\":\"uddharedātmanātmānaṃ nātmānamavasādayet . ātmaiva hyātmano bandhurātmaiva ripurātmanaḥ ||6-5||\"}}},\"verse6\":{\"verse6\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 6\",\"description\":\"Bhagavad Gita Chapter 6 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 6\",\"description\":\"Bhagavad Gita Chapter 6 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 6\",\"Gita 6.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-6\"},\"introduction\":\"$73\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 6\",\"description\":\"Bhagavad Gita Chapter 6 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-6\"},\"philosophical_explanation\":\"$74\",\"scripture_text\":\"बन्धुरात्मात्मनस्तस्य येनात्मैवात्मना जितः | अनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत् ||६-६||\",\"verse\":{\"sanskrit\":\"बन्धुरात्मात्मनस्तस्य येनात्मैवात्मना जितः | अनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत् ||६-६||\",\"translation\":\"6.6 The Self is the friend of the self of him by whom the self has been conered by the Self, but to the unconered self, this Self stands in the position of an enemy, like an (external) foe.\",\"transliteration\":\"bandhurātmātmanastasya yenātmaivātmanā jitaḥ . anātmanastu śatrutve vartetātmaiva śatruvat ||6-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 7\",\"description\":\"Bhagavad Gita Chapter 6 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 7\",\"description\":\"Bhagavad Gita Chapter 6 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 7\",\"Gita 6.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-7\"},\"introduction\":\"$75\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 7\",\"description\":\"Bhagavad Gita Chapter 6 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-7\"},\"philosophical_explanation\":\"$76\",\"scripture_text\":\"जितात्मनः प्रशान्तस्य परमात्मा समाहितः | शीतोष्णसुखदुःखेषु तथा मानापमानयोः ||६-७||\",\"verse\":{\"sanskrit\":\"जितात्मनः प्रशान्तस्य परमात्मा समाहितः | शीतोष्णसुखदुःखेषु तथा मानापमानयोः ||६-७||\",\"translation\":\"6.7 The Supreme Self of him who is self-controlled and peaceful is balanced in cold and heat, pleasure and pain, as also in honour and dishonour.\",\"transliteration\":\"jitātmanaḥ praśāntasya paramātmā samāhitaḥ . śītoṣṇasukhaduḥkheṣu tathā mānāpamānayoḥ ||6-7||\"}}},\"verse8\":{\"verse8\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 8\",\"description\":\"Bhagavad Gita Chapter 6 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 8\",\"description\":\"Bhagavad Gita Chapter 6 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-8\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 8\",\"Gita 6.8\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-8\"},\"introduction\":\"$77\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 8\",\"description\":\"Bhagavad Gita Chapter 6 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-8\"},\"philosophical_explanation\":\"$78\",\"scripture_text\":\"ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः | युक्त इत्युच्यते योगी समलोष्टाश्मकाञ्चनः ||६-८||\",\"verse\":{\"sanskrit\":\"ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः | युक्त इत्युच्यते योगी समलोष्टाश्मकाञ्चनः ||६-८||\",\"translation\":\"6.8 The Yogi who is satisfied with the knowledge and the wisdom (of the Self), who has conered the senses, and to whom a clod of earth, a piece of stone and gold are the same, is said to be harmonied (i.e., is said to have attained Nirvikalpa Samadhi).\",\"transliteration\":\"jñānavijñānatṛptātmā kūṭastho vijitendriyaḥ . yukta ityucyate yogī samaloṣṭāśmakāñcanaḥ ||6-8||\"}}},\"verse9\":{\"verse9\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 9\",\"description\":\"Bhagavad Gita Chapter 6 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 9\",\"description\":\"Bhagavad Gita Chapter 6 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-9\",\"keywords\":[\"Bhagavad Gita Chapter 6 Verse 9\",\"Gita 6.9\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-9\"},\"introduction\":\"$79\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 6 Verse 9\",\"description\":\"Bhagavad Gita Chapter 6 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-6/verse-9\"},\"philosophical_explanation\":\"$7a\",\"scripture_text\":\"सुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु | साधुष्वपि च पापेषु समबुद्धिर्विशिष्यते ||६-९||\",\"verse\":{\"sanskrit\":\"सुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु | साधुष्वपि च पापेषु समबुद्धिर्विशिष्यते ||६-९||\",\"translation\":\"6.9 He who is of the same mind to the good-hearted, friends, enemies, the indifferent, the neutral, the hateful, the relatives, the righteous and the unrighteous, excels.\",\"transliteration\":\"suhṛnmitrāryudāsīnamadhyasthadveṣyabandhuṣu . sādhuṣvapi ca pāpeṣu samabuddhirviśiṣyate ||6-9||\"}}}},\"initialLocale\":\"en\",\"chapter\":[\"chapter6\"]}]\n"])</script><script>self.__next_f.push([1,"d:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"7b:I[27201,[\"/_next/static/chunks/03r18pp~9shb1.js\",\"/_next/static/chunks/06zzw9vfd8b8u.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"Bhagavad Gita - Complete Guide, Chapters, Teachings \u0026 Philosophy | Sanatana\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Explore the Bhagavad Gita, the sacred dialogue between Krishna and Arjuna. Discover its 18 chapters, core teachings on karma, dharma, yoga, and spiritual wisdom.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"3\",{\"name\":\"keywords\",\"content\":\"bhagavad gita, krishna, arjuna, gita chapters, karma yoga, bhakti yoga, jnana yoga, hindu philosophy, dharma, spiritual teachings\"}],[\"$\",\"link\",\"4\",{\"rel\":\"canonical\",\"href\":\"https://sanatanadharmam.in/itihasa/bhagavadgita/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"Bhagavad Gita - Complete Guide, Chapters, Teachings \u0026 Philosophy | Sanatana\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",
