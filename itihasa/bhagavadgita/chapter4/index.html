cription\":\"Bhagavad Gita Chapter 4 Verse 12 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-12\"},\"philosophical_explanation\":\"$24\",\"scripture_text\":\"काङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः | क्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा ||४-१२||\",\"verse\":{\"sanskrit\":\"काङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः | क्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा ||४-१२||\",\"translation\":\"4.12 Those who long for success in action in this world sacrifice to the gods; because success is ickly attained by men through action.\",\"transliteration\":\"kāṅkṣantaḥ karmaṇāṃ siddhiṃ yajanta iha devatāḥ . kṣipraṃ hi mānuṣe loke siddhirbhavati karmajā ||4-12||\"}}},\"verse13\":{\"verse13\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 13\",\"description\":\"Bhagavad Gita Chapter 4 Verse 13 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 13\",\"description\":\"Bhagavad Gita Chapter 4 Verse 13 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-13\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 13\",\"Gita 4.13\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-13\"},\"introduction\":\"$25\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 13\",\"description\":\"Bhagavad Gita Chapter 4 Verse 13 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practic कर्म पूर्वैरपि मुमुक्षुभिः | कुरु कर्मैव तस्मात्त्वं पूर्वैः पूर्वतरं कृतम् ||४-१५||\",\"translation\":\"4.15 Having known this, the ancient seekers after freedom also performed action; therefore do thou also perform action, as did the ancients in days of yore.\",\"transliteration\":\"evaṃ jñātvā kṛtaṃ karma pūrvairapi mumukṣubhiḥ . kuru karmaiva tasmāttvaṃ pūrvaiḥ pūrvataraṃ kṛtam ||4-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 16\",\"description\":\"Bhagavad Gita Chapter 4 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 16\",\"description\":\"Bhagavad Gita Chapter 4 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 16\",\"Gita 4.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 16\",\"description\":\"Bhagavad Gita Chapter 4 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः | तत्ते कर्म प्रवक्ष्यामि यज्ज्ञात्वा मोक्ष्यसेऽशुभात् ||४-१६||\",\"verse\":{\"sanskrit\":\"किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः | तत्ते कर्म प्रवक्ष्यामि यज्ज्ञात्वा मोक्ष्यसेऽशुभात् ||४-१६||\",\"translation\":\"4.16 What is action? What is inaction? As to this even the wise are confused. Therefore I shall teach thee such action (the nature of action and inaction) by knowing which thou shalt be liberated from the evil (of Samsara, the wheel of birth and death).\",\"transliteration\":\"kiṃ karma kimakarmeti kavayo.apyatra mohitāḥ . tatte karma pravakṣyāmi yajjñātvā mokṣyase.aśubhāt ||4-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 17\",\"description\":\"Bhagavad Gita Chapter 4 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 17\",\"description\":\"Bhagavad Gita Chapter 4 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 17\",\"Gita 4.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 17\",\"description\":\"Bhagavad Gita Chapter 4 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"कर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः | अकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः ||४-१७||\",\"verse\":{\"sanskrit\":\"कर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः | अकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः ||४-१७||\",\"translation\":\"4.17 For verily (the true nature) of action (enjoined by the scriptures) should be known, also (that) of forbidden (or unlawful) action, and of inaction; hard to understand is the nature (path) of action.\",\"transliteration\":\"karmaṇo hyapi boddhavyaṃ boddhavyaṃ ca vikarmaṇaḥ . akarmaṇaśca boddhavyaṃ gahanā karmaṇo gatiḥ ||4-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 18\",\"description\":\"Bhagavad Gita Chapter 4 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 18\",\"description\":\"Bhagavad Gita Chapter 4 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 18\",\"Gita 4.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 18\",\"description\":\"Bhagavad Gita Chapter 4 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः | स बुद्धिमान्मनुष्येषु स युक्तः कृत्स्नकर्मकृत् ||४-१८||\",\"verse\":{\"sanskrit\":\"कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः | स बुद्धिमान्मनुष्येषु स युक्तः कृत्स्नकर्मकृत् ||४-१८||\",\"translation\":\"4.18 He who seeth inaction in action and action in inaction, he is wise among men; he is a Yogi and performer of all actions.\",\"transliteration\":\"karmaṇyakarma yaḥ paśyedakarmaṇi ca karma yaḥ . sa buddhimānmanuṣyeṣu sa yuktaḥ kṛtsnakarmakṛt ||4-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 19\",\"description\":\"Bhagavad Gita Chapter 4 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 19\",\"description\":\"Bhagavad Gita Chapter 4 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 19\",\"Gita 4.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 19\",\"description\":\"Bhagavad Gita Chapter 4 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः | ज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः ||४-१९||\",\"verse\":{\"sanskrit\":\"यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः | ज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः ||४-१९||\",\"translation\":\"4.19 He whose undertakings are all devoid of desires and (selfish) purposes and whose actions have been burnt by the fire of knowledge, him the wise call a sage.\",\"transliteration\":\"yasya sarve samārambhāḥ kāmasaṅkalpavarjitāḥ . jñānāgnidagdhakarmāṇaṃ tamāhuḥ paṇḍitaṃ budhāḥ ||4-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 2\",\"description\":\"Bhagavad Gita Chapter 4 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 2\",\"description\":\"Bhagavad Gita Chapter 4 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 2\",\"Gita 4.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 2\",\"description\":\"Bhagavad Gita Chapter 4 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"एवं परम्पराप्राप्तमिमं राजर्षयो विदुः | स कालेनेह महता योगो नष्टः परन्तप ||४-२||\",\"verse\":{\"sanskrit\":\"एवं परम्पराप्राप्तमिमं राजर्षयो विदुः | स कालेनेह महता योगो नष्टः परन्तप ||४-२||\",\"translation\":\"4.2 This, handed down thus in regular succession, the royal sages knew. This Yoga, by long lapse of time, has been lost here, O Parantapa (burner of the foes).\",\"transliteration\":\"evaṃ paramparāprāptamimaṃ rājarṣayo viduḥ . sa kāleneha mahatā yogo naṣṭaḥ parantapa ||4-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 20\",\"description\":\"Bhagavad Gita Chapter 4 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 20\",\"description\":\"Bhagavad Gita Chapter 4 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 20\",\"Gita 4.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 20\",\"description\":\"Bhagavad Gita Chapter 4 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"त्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः | कर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः ||४-२०||\",\"verse\":{\"sanskrit\":\"त्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः | कर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः ||४-२०||\",\"translation\":\"4.20 Having abandoned attachment to the fruits of the action, ever content, depending on nothing, he does not do anything though engaged in activity.\",\"transliteration\":\"tyaktvā karmaphalāsaṅgaṃ nityatṛpto nirāśrayaḥ . karmaṇyabhipravṛtto.api naiva kiñcitkaroti saḥ ||4-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 21\",\"description\":\"Bhagavad Gita Chapter 4 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 21\",\"description\":\"Bhagavad Gita Chapter 4 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 21\",\"Gita 4.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 21\",\"description\":\"Bhagavad Gita Chapter 4 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"निराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः | शारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम् ||४-२१||\",\"verse\":{\"sanskrit\":\"निराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः | शारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम् ||४-२१||\",\"translation\":\"4.21 Without hope and with the mind and the self controlled, having abandoned all covetousness, doing mere bodily action, he incurs no sin.\",\"transliteration\":\"nirāśīryatacittātmā tyaktasarvaparigrahaḥ . śārīraṃ kevalaṃ karma kurvannāpnoti kilbiṣam ||4-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 22\",\"description\":\"Bhagavad Gita Chapter 4 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 22\",\"description\":\"Bhagavad Gita Chapter 4 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 22\",\"Gita 4.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 22\",\"description\":\"Bhagavad Gita Chapter 4 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः | समः सिद्धावसिद्धौ च कृत्वापि न निबध्यते ||४-२२||\",\"verse\":{\"sanskrit\":\"यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः | समः सिद्धावसिद्धौ च कृत्वापि न निबध्यते ||४-२२||\",\"translation\":\"4.22 Content with what comes to him without effort, free from the pairs of opposites and envy, even-minded in success and failure, though acting, he is not bound.\",\"transliteration\":\"yadṛcchālābhasantuṣṭo dvandvātīto vimatsaraḥ . samaḥ siddhāvasiddhau ca kṛtvāpi na nibadhyate ||4-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 23\",\"description\":\"Bhagavad Gita Chapter 4 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 23\",\"description\":\"Bhagavad Gita Chapter 4 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 23\",\"Gita 4.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 23\",\"description\":\"Bhagavad Gita Chapter 4 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"गतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः | यज्ञायाचरतः कर्म समग्रं प्रविलीयते ||४-२३||\",\"verse\":{\"sanskrit\":\"गतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः | यज्ञायाचरतः कर्म समग्रं प्रविलीयते ||४-२३||\",\"translation\":\"4.23 To one who is devoid of attchment, who is liberated, whose mind is established in knowledge, who works for the sake of sacrifice (for the sake of God), the whole action is dissolved.\",\"transliteration\":\"gatasaṅgasya muktasya jñānāvasthitacetasaḥ . yajñāyācarataḥ karma samagraṃ pravilīyate ||4-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 24\",\"description\":\"Bhagavad Gita Chapter 4 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 24\",\"description\":\"Bhagavad Gita Chapter 4 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 24\",\"Gita 4.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 24\",\"description\":\"Bhagavad Gita Chapter 4 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"ब्रह्मार्पणं ब्रह्म हविर्ब्रह्माग्नौ ब्रह्मणा हुतम् | ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना ||४-२४||\",\"verse\":{\"sanskrit\":\"ब्रह्मार्पणं ब्रह्म हविर्ब्रह्माग्नौ ब्रह्मणा हुतम् | ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना ||४-२४||\",\"translation\":\"4.24 Brahman is the oblation; Brahman is the melted butter (ghee); by Brahman is the oblation poured into the fire of Brahman; Brahman verily shall be reached by him who always sees Brahman in action.\",\"transliteration\":\"brahmārpaṇaṃ brahma havirbrahmāgnau brahmaṇā hutam . brahmaiva tena gantavyaṃ brahmakarmasamādhinā ||4-24||\"}}},\"verse25\":{\"verse25\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 25\",\"description\":\"Bhagavad Gita Chapter 4 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 25\",\"description\":\"Bhagavad Gita Chapter 4 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-25\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 25\",\"Gita 4.25\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-25\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 25\",\"description\":\"Bhagavad Gita Chapter 4 Verse 25 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-25\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"दैवमेवापरे यज्ञं योगिनः पर्युपासते | ब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति ||४-२५||\",\"verse\":{\"sanskrit\":\"दैवमेवापरे यज्ञं योगिनः पर्युपासते | ब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति ||४-२५||\",\"translation\":\"4.25 Some Yogies perform sacrifice to the gods alone; while others (who have realised the Self) offer the self as sacrifice by the Self in the fire of Brahman alone.\",\"transliteration\":\"daivamevāpare yajñaṃ yoginaḥ paryupāsate . brahmāgnāvapare yajñaṃ yajñenaivopajuhvati ||4-25||\"}}},\"verse26\":{\"verse26\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 26\",\"description\":\"Bhagavad Gita Chapter 4 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 26\",\"description\":\"Bhagavad Gita Chapter 4 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-26\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 26\",\"Gita 4.26\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-26\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 26\",\"description\":\"Bhagavad Gita Chapter 4 Verse 26 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-26\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"श्रोत्रादीनीन्द्रियाण्यन्ये संयमाग्निषु जुह्वति | शब्दादीन्विषयानन्य इन्द्रियाग्निषु जुह्वति ||४-२६||\",\"verse\":{\"sanskrit\":\"श्रोत्रादीनीन्द्रियाण्यन्ये संयमाग्निषु जुह्वति | शब्दादीन्विषयानन्य इन्द्रियाग्निषु जुह्वति ||४-२६||\",\"translation\":\"4.26 Some again offer the organ of hearing and other senses as sacrifice in the fire of restraint; others offer sound and other objects of the senses as sacrifice in the fire of the senses.\",\"transliteration\":\"śrotrādīnīndriyāṇyanye saṃyamāgniṣu juhvati . śabdādīnviṣayānanya indriyāgniṣu juhvati ||4-26||\"}}},\"verse27\":{\"verse27\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 27\",\"description\":\"Bhagavad Gita Chapter 4 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 27\",\"description\":\"Bhagavad Gita Chapter 4 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-27\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 27\",\"Gita 4.27\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-27\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 27\",\"description\":\"Bhagavad Gita Chapter 4 Verse 27 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-27\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"सर्वाणीन्द्रियकर्माणि प्राणकर्माणि चापरे | आत्मसंयमयोगाग्नौ जुह्वति ज्ञानदीपिते ||४-२७||\",\"verse\":{\"sanskrit\":\"सर्वाणीन्द्रियकर्माणि प्राणकर्माणि चापरे | आत्मसंयमयोगाग्नौ जुह्वति ज्ञानदीपिते ||४-२७||\",\"translation\":\"4.27 Others again sacrifice all the functions of the senses and those of the breath (vital energy or Prana) in the fire of the Yoga of self-restraint kindled by knowledge.\",\"transliteration\":\"sarvāṇīndriyakarmāṇi prāṇakarmāṇi cāpare . ātmasaṃyamayogāgnau juhvati jñānadīpite ||4-27||\"}}},\"verse28\":{\"verse28\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 28\",\"description\":\"Bhagavad Gita Chapter 4 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 28\",\"description\":\"Bhagavad Gita Chapter 4 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-28\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 28\",\"Gita 4.28\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-28\"},\"introduction\":\"$45\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 28\",\"description\":\"Bhagavad Gita Chapter 4 Verse 28 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-28\"},\"philosophical_explanation\":\"$46\",\"scripture_text\":\"द्रव्ययज्ञास्तपोयज्ञा योगयज्ञास्तथापरे | स्वाध्यायज्ञानयज्ञाश्च यतयः संशितव्रताः ||४-२८||\",\"verse\":{\"sanskrit\":\"द्रव्ययज्ञास्तपोयज्ञा योगयज्ञास्तथापरे | स्वाध्यायज्ञानयज्ञाश्च यतयः संशितव्रताः ||४-२८||\",\"translation\":\"4.28 Others again offer wealth, austerity and Yoga as sacrifice, while the ascetics of self-restraint and rigid vows offer study of scriptures and knowledge as sacrifice.\",\"transliteration\":\"dravyayajñāstapoyajñā yogayajñāstathāpare . svādhyāyajñānayajñāśca yatayaḥ saṃśitavratāḥ ||4-28||\"}}},\"verse29\":{\"verse29\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 29\",\"description\":\"Bhagavad Gita Chapter 4 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 29\",\"description\":\"Bhagavad Gita Chapter 4 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-29\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 29\",\"Gita 4.29\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-29\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 29\",\"description\":\"Bhagavad Gita Chapter 4 Verse 29 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-29\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"अपाने जुह्वति प्राणं प्राणेऽपानं तथापरे | प्राणापानगती रुद्ध्वा प्राणायामपरायणाः ||४-२९||\",\"verse\":{\"sanskrit\":\"अपाने जुह्वति प्राणं प्राणेऽपानं तथापरे | प्राणापानगती रुद्ध्वा प्राणायामपरायणाः ||४-२९||\",\"translation\":\"4.29 Others offer as sacrifice the outgoing breath in the incoming, and the incoming in the outgoing, restraining the course of the outgoing and the incoming breaths, solely absorbed in the restraint of the breath.\",\"transliteration\":\"apāne juhvati prāṇaṃ prāṇe.apānaṃ tathāpare . prāṇāpānagatī ruddhvā prāṇāyāmaparāyaṇāḥ ||4-29||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 3\",\"description\":\"Bhagavad Gita Chapter 4 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 3\",\"description\":\"Bhagavad Gita Chapter 4 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 3\",\"Gita 4.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-3\"},\"introduction\":\"$49\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 3\",\"description\":\"Bhagavad Gita Chapter 4 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-3\"},\"philosophical_explanation\":\"$4a\",\"scripture_text\":\"स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः | भक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम् ||४-३||\",\"verse\":{\"sanskrit\":\"स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः | भक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम् ||४-३||\",\"translation\":\"4.3 That same ancient Yoga has been today taught to thee by Me, for thou art My devotee and My friend; it is the supreme secret.\",\"transliteration\":\"sa evāyaṃ mayā te.adya yogaḥ proktaḥ purātanaḥ . bhakto.asi me sakhā ceti rahasyaṃ hyetaduttamam ||4-3||\"}}},\"verse30\":{\"verse30\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 30\",\"description\":\"Bhagavad Gita Chapter 4 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 30\",\"description\":\"Bhagavad Gita Chapter 4 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-30\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 30\",\"Gita 4.30\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-30\"},\"introduction\":\"$4b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 30\",\"description\":\"Bhagavad Gita Chapter 4 Verse 30 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-30\"},\"philosophical_explanation\":\"$4c\",\"scripture_text\":\"अपरे नियताहाराः प्राणान्प्राणेषु जुह्वति | सर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः ||४-३०||\",\"verse\":{\"sanskrit\":\"अपरे नियताहाराः प्राणान्प्राणेषु जुह्वति | सर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः ||४-३०||\",\"translation\":\"4.30 Others who regulate their diet offer life-breaths in life-breaths. All these are knowers of sacrifice, whose sins are destroyed by sacrifice.\",\"transliteration\":\"apare niyatāhārāḥ prāṇānprāṇeṣu juhvati . sarve.apyete yajñavido yajñakṣapitakalmaṣāḥ ||4-30||\"}}},\"verse31\":{\"verse31\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 31\",\"description\":\"Bhagavad Gita Chapter 4 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 31\",\"description\":\"Bhagavad Gita Chapter 4 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-31\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 31\",\"Gita 4.31\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-31\"},\"introduction\":\"$4d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 31\",\"description\":\"Bhagavad Gita Chapter 4 Verse 31 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-31\"},\"philosophical_explanation\":\"$4e\",\"scripture_text\":\"यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम् | नायं लोकोऽस्त्ययज्ञस्य कुतोऽन्यः कुरुसत्तम ||४-३१||\",\"verse\":{\"sanskrit\":\"यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम् | नायं लोकोऽस्त्ययज्ञस्य कुतोऽन्यः कुरुसत्तम ||४-३१||\",\"translation\":\"4.31 Those who eat the remnants of the sacrifice, which are like nectar, go to the eternal Brahman. This world is not for the man who does not perform sacrifice; how then can he have the other, O Arjuna?\",\"transliteration\":\"yajñaśiṣṭāmṛtabhujo yānti brahma sanātanam . nāyaṃ loko.astyayajñasya kuto.anyaḥ kurusattama ||4-31||\"}}},\"verse32\":{\"verse32\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 32\",\"description\":\"Bhagavad Gita Chapter 4 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 32\",\"description\":\"Bhagavad Gita Chapter 4 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-32\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 32\",\"Gita 4.32\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-32\"},\"introduction\":\"$4f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 32\",\"description\":\"Bhagavad Gita Chapter 4 Verse 32 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-32\"},\"philosophical_explanation\":\"$50\",\"scripture_text\":\"एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे | कर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे ||४-३२||\",\"verse\":{\"sanskrit\":\"एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे | कर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे ||४-३२||\",\"translation\":\"4.32 Thus, manifold sacrifices are spread out before Brahman (literally) at the mouth or face of Brahman). Know them all as born of action and thus knowing, thou shalt be liberated.\",\"transliteration\":\"evaṃ bahuvidhā yajñā vitatā brahmaṇo mukhe . karmajānviddhi tānsarvānevaṃ jñātvā vimokṣyase ||4-32||\"}}},\"verse33\":{\"verse33\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 33\",\"description\":\"Bhagavad Gita Chapter 4 Verse 33 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 33\",\"description\":\"Bhagavad Gita Chapt Verse 34\",\"Gita 4.34\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-34\"},\"introduction\":\"$53\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 34\",\"description\":\"Bhagavad Gita Chapter 4 Verse 34 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-34\"},\"philosophical_explanation\":\"$54\",\"scripture_text\":\"तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया | उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ||४-३४||\",\"verse\":{\"sanskrit\":\"तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया | उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ||४-३४||\",\"translation\":\"4.34 Know That by long prostration, by estion and by service; the wise who have realised the Truth will instruct thee in (that) knowledge.\",\"transliteration\":\"tadviddhi praṇipātena paripraśnena sevayā . upadekṣyanti te jñānaṃ jñāninastattvadarśinaḥ ||4-34||\"}}},\"verse35\":{\"verse35\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 35\",\"description\":\"Bhagavad Gita Chapter 4 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 35\",\"description\":\"Bhagavad Gita Chapter 4 Verse 35 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-35\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 35\",\"Gita 4.35\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\ a Chapter 4 Verse 36\",\"description\":\"Bhagavad Gita Chapter 4 Verse 36 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-36\"},\"philosophical_explanation\":\"$58\",\"scripture_text\":\"अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः | सर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि ||४-३६||\",\"verse\":{\"sanskrit\":\"अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः | सर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि ||४-३६||\",\"translation\":\"4.36 Even if thou art the most sinful of all sinners, yet thou shalt verily cross all sins by the raft of knowledge.\",\"transliteration\":\"api cedasi pāpebhyaḥ sarvebhyaḥ pāpakṛttamaḥ . sarvaṃ jñānaplavenaiva vṛjinaṃ santariṣyasi ||4-36||\"}}},\"verse37\":{\"verse37\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 37\",\"description\":\"Bhagavad Gita Chapter 4 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 37\",\"description\":\"Bhagavad Gita Chapter 4 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-37\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 37\",\"Gita 4.37\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-37\"},\"introduction\":\"$59\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 37\",\"description\":\"Bhagavad Gita Chapter 4 Verse 37 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-37\"},\"philosophical_explanation\":\"$5a\",\"scripture_text\":\"यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन | ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा ||४-३७||\",\"verse\":{\"sanskrit\":\"यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन | ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा ||४-३७||\",\"translation\":\"4.37 As the blazing fire reduces fuel to ashes, O Arjuna, so does the fire of knowledge reduce all actions to ashes.\",\"transliteration\":\"yathaidhāṃsi samiddho.agnirbhasmasātkurute.arjuna . jñānāgniḥ sarvakarmāṇi bhasmasātkurute tathā ||4-37||\"}}},\"verse38\":{\"verse38\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 38\",\"description\":\"Bhagavad Gita Chapter 4 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 38\",\"description\":\"Bhagavad Gita Chapter 4 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-38\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 38\",\"Gita 4.38\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-38\"},\"introduction\":\"$5b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 38\",\"description\":\"Bhagavad Gita Chapter 4 Verse 38 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-38\"},\"philosophical_explanation\":\"$5c\",\"scripture_text\":\"न हि ज्ञानेन सदृशं पवित्रमिह विद्यते | तत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति ||४-३८||\",\"verse\":{\"sanskrit\":\"न हि ज्ञानेन सदृशं पवित्रमिह विद्यते | तत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति ||४-३८||\",\"translation\":\"4.38 Verily, there is no purifier in this world like knowledge. He who is perfected in Yoga finds it in the Self in time.\",\"transliteration\":\"na hi jñānena sadṛśaṃ pavitramiha vidyate . tatsvayaṃ yogasaṃsiddhaḥ kālenātmani vindati ||4-38||\"}}},\"verse39\":{\"verse39\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 39\",\"description\":\"Bhagavad Gita Chapter 4 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 39\",\"description\":\"Bhagavad Gita Chapter 4 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-39\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 39\",\"Gita 4.39\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-39\"},\"introduction\":\"$5d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 39\",\"description\":\"Bhagavad Gita Chapter 4 Verse 39 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-39\"},\"philosophical_explanation\":\"$5e\",\"scripture_text\":\"श्रद्धावाँल्लभते ज्ञानं तत्परः संयतेन्द्रियः | ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति ||४-३९||\",\"verse\":{\"sanskrit\":\"श्रद्धावाँल्लभते ज्ञानं तत्परः संयतेन्द्रियः | ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधि sukhaṃ saṃśayātmanaḥ ||4-40||\"}}},\"verse41\":{\"verse41\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 41\",\"description\":\"Bhagavad Gita Chapter 4 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 41\",\"description\":\"Bhagavad Gita Chapter 4 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-41\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 41\",\"Gita 4.41\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-41\"},\"introduction\":\"$63\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 41\",\"description\":\"Bhagavad Gita Chapter 4 Verse 41 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-41\"},\"philosophical_explanation\":\"$64\",\"scripture_text\":\"योगसंन्यस्तकर्माणं ज्ञानसञ्छिन्नसंशयम् | आत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय ||४-४१||\",\"verse\":{\"sanskrit\":\"योगसंन्यस्तकर्माणं ज्ञानसञ्छिन्नसंशयम् | आत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय ||४-४१||\",\"translation\":\"4.41 He who has renounced actions by Yoga, whose doubts are rent asunder by knowledge, and who is self-possessed actions do not bind him, O Arjuna.\",\"transliteration\":\"yogasaṃnyastakarmāṇaṃ jñānasañchinnasaṃśayam . ātmavantaṃ na karmāṇi nibadhnanti dhanañjaya ||4-41||\"}}},\"verse42\":{\"verse42\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 42\",\"description\":\"Bhagavad Gita Chapter 4 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 42\",\"description\":\"Bhagavad Gita Chapter 4 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-42\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 42\",\"Gita 4.42\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-42\"},\"introduction\":\"$65\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 42\",\"description\":\"Bhagavad Gita Chapter 4 Verse 42 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-42\"},\"philosophical_explanation\":\"$66\",\"scripture_text\":\"तस्मादज्ञानसम्भूतं हृत्स्थं ज्ञानासिनात्मनः | छित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत ||४-४२||\",\"verse\":{\"sanskrit\":\"तस्मादज्ञानसम्भूतं हृत्स्थं ज्ञानासिनात्मनः | छित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत ||४-४२||\",\"translation\":\"4.42 Therefore with the sword of the knowledge (of the Self) cut asunder the doubt of the self born of ignorance, residing in thy heart, and take refuge in Yoga. Arise, O Arjuna.\",\"transliteration\":\"tasmādajñānasambhūtaṃ hṛtsthaṃ jñānāsinātmanaḥ . chittvainaṃ saṃśayaṃ yogamātiṣṭhottiṣṭha bhārata ||4-42||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 5\",\"description\":\"Bhagavad Gita Chapter 4 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhaga ranslation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-6\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 6\",\"Gita 4.6\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-6\"},\"introduction\":\"$69\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 6\",\"description\":\"Bhagavad Gita Chapter 4 Verse 6 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-6\"},\"philosophical_explanation\":\"$6a\",\"scripture_text\":\"अजोऽपि सन्नव्ययात्मा भूतानामीश्वरोऽपि सन् | प्रकृतिं स्वामधिष्ठाय सम्भवाम्यात्ममायया ||४-६||\",\"verse\":{\"sanskrit\":\"अजोऽपि सन्नव्ययात्मा भूतानामीश्वरोऽपि सन् | प्रकृतिं स्वामधिष्ठाय सम्भवाम्यात्ममायया ||४-६||\",\"translation\":\"4.6 Though I am unborn, of imperishable nature, and though I am the Lord of all beings, yet, governing My own Nature, I am born by My own Maya.\",\"transliteration\":\"ajo.api sannavyayātmā bhūtānāmīśvaro.api san . prakṛtiṃ svāmadhiṣṭhāya sambhavāmyātmamāyayā ||4-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 7\",\"description\":\"Bhagavad Gita Chapter 4 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 7\",\"description\":\"Bhagavad Gita Chapter 4 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-7\",\"keywords\":[\"Bhagavad Gita Cha ta/chapter-4/verse-8\"},\"introduction\":\"$6d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 8\",\"description\":\"Bhagavad Gita Chapter 4 Verse 8 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-8\"},\"philosophical_explanation\":\"$6e\",\"scripture_text\":\"परित्राणाय साधूनां विनाशाय च दुष्कृताम् | धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ||४-८||\",\"verse\":{\"sanskrit\":\"परित्राणाय साधूनां विनाशाय च दुष्कृताम् | धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ||४-८||\",\"translation\":\"4.8 For the protection of the good, for the destruction of the wicked and for the establishment of righteousness, I am born in every age.\",\"transliteration\":\"paritrāṇāya sādhūnāṃ vināśāya ca duṣkṛtām . dharmasaṃsthāpanārthāya sambhavāmi yuge yuge ||4-8||\"}}},\"verse9\":{\"verse9\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 9\",\"description\":\"Bhagavad Gita Chapter 4 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 9\",\"description\":\"Bhagavad Gita Chapter 4 Verse 9 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-9\",\"keywords\":[\"Bhagavad Gita Chapter 4 Verse 9\",\"Gita 4.9\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-4/verse-9\"},\"introduction\":\"$6f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 4 Verse 9\",\"description\":\"Bhagavad Gita Chapter 4 Verse 9 with original Sanskrit, IAST transliteration, E
