original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-13\"},\"philosophical_explanation\":\"$26\",\"scripture_text\":\"इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम् | इदमस्तीदमपि मे भविष्यति पुनर्धनम् ||१६-१३||\",\"verse\":{\"sanskrit\":\"इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम् | इदमस्तीदमपि मे भविष्यति पुनर्धनम् ||१६-१३||\",\"translation\":\"16.13 \\\"This has been gained by me today; this desire of mine I shall fuffil; this is mine and this wealth also shall be mine in future.\\\"\",\"transliteration\":\"idamadya mayā labdhamimaṃ prāpsye manoratham . idamastīdamapi me bhaviṣyati punardhanam ||16-13||\"}}},\"verse14\":{\"verse14\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 14\",\"description\":\"Bhagavad Gita Chapter 16 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 14\",\"description\":\"Bhagavad Gita Chapter 16 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-14\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 14\",\"Gita 16.14\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-14\"},\"introduction\":\"$27\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 14\",\"description\":\"Bhagavad Gita Chapter 16 Verse 14 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-14\"},\"philosophical_explanation\":\"$28\",\"scripture_text\":\"असौ मया हतः शत्रुर्हनिष्ये चापरानपि | ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी ||१६-१४||\",\"verse\":{\"sanskrit\":\"असौ मया हतः शत्रुर्हनिष्ये चापरानपि | ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी ||१६-१४||\",\"translation\":\"16.14 \\\"That enemy has been slain by me; and others also I shall slay. I am the lord. I enjoy. I am perfect, powerful and happy.\\\"\",\"transliteration\":\"asau mayā hataḥ śatrurhaniṣye cāparānapi . īśvaro.ahamahaṃ bhogī siddho.ahaṃ balavānsukhī ||16-14||\"}}},\"verse15\":{\"verse15\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 15\",\"description\":\"Bhagavad Gita Chapter 16 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 15\",\"description\":\"Bhagavad Gita Chapter 16 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-15\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 15\",\"Gita 16.15\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-15\"},\"introduction\":\"$29\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 15\",\"description\":\"Bhagavad Gita Chapter 16 Verse 15 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-15\"},\"philosophical_explanation\":\"$2a\",\"scripture_text\":\"आढ्योऽभिजनवानस्मि कोऽन्योऽस्ति सदृशो मया | यक्ष्ये दास्यामि मोदिष्य इत्यज्ञानविमोहिताः ||१६-१५||\",\"verse\":{\"sanskrit\":\"आढ्योऽभिजनवानस्मि कोऽन्योऽस्ति सदृशो मया | यक्ष्ये दास्यामि मोदिष्य इत्यज्ञानविमोहिताः ||१६-१५||\",\"translation\":\"16.15 \\\"I am rich and born in a noble family. Who else is equal to me? I shall perform sacrifices. I shall give (charity). I shall rejoice,\\\" thus deluded by ignorance.\",\"transliteration\":\"āḍhyo.abhijanavānasmi ko.anyo.asti sadṛśo mayā . yakṣye dāsyāmi modiṣya ityajñānavimohitāḥ ||16-15||\"}}},\"verse16\":{\"verse16\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 16\",\"description\":\"Bhagavad Gita Chapter 16 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 16\",\"description\":\"Bhagavad Gita Chapter 16 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-16\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 16\",\"Gita 16.16\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-16\"},\"introduction\":\"$2b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 16\",\"description\":\"Bhagavad Gita Chapter 16 Verse 16 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-16\"},\"philosophical_explanation\":\"$2c\",\"scripture_text\":\"अनेकचित्तविभ्रान्ता मोहजालसमावृताः | प्रसक्ताः कामभोगेषु पतन्ति नरकेऽशुचौ ||१६-१६||\",\"verse\":{\"sanskrit\":\"अनेकचित्तविभ्रान्ता मोहजालसमावृताः | प्रसक्ताः कामभोगेषु पतन्ति नरकेऽशुचौ ||१६-१६||\",\"translation\":\"16.16 Bewildered by many a fancy, entangled in the snare of delusion, addicted to the gratification of lust, they fall into a foul hell.\",\"transliteration\":\"anekacittavibhrāntā mohajālasamāvṛtāḥ . prasaktāḥ kāmabhogeṣu patanti narake.aśucau ||16-16||\"}}},\"verse17\":{\"verse17\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 17\",\"description\":\"Bhagavad Gita Chapter 16 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 17\",\"description\":\"Bhagavad Gita Chapter 16 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-17\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 17\",\"Gita 16.17\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-17\"},\"introduction\":\"$2d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 17\",\"description\":\"Bhagavad Gita Chapter 16 Verse 17 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-17\"},\"philosophical_explanation\":\"$2e\",\"scripture_text\":\"आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः | यजन्ते नामयज्ञैस्ते दम्भेनाविधिपूर्वकम् ||१६-१७||\",\"verse\":{\"sanskrit\":\"आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः | यजन्ते नामयज्ञैस्ते दम्भेनाविधिपूर्वकम् ||१६-१७||\",\"translation\":\"16.17 Self-conceited, stubborn, filled with the pride and intoxication of wealth, they perform sacrifices in name out of ostentation, contrary to scriptural ordinances.\",\"transliteration\":\"ātmasambhāvitāḥ stabdhā dhanamānamadānvitāḥ . yajante nāmayajñaiste dambhenāvidhipūrvakam ||16-17||\"}}},\"verse18\":{\"verse18\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 18\",\"description\":\"Bhagavad Gita Chapter 16 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 18\",\"description\":\"Bhagavad Gita Chapter 16 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-18\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 18\",\"Gita 16.18\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-18\"},\"introduction\":\"$2f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 18\",\"description\":\"Bhagavad Gita Chapter 16 Verse 18 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-18\"},\"philosophical_explanation\":\"$30\",\"scripture_text\":\"अहंकारं बलं दर्पं कामं क्रोधं च संश्रिताः | मामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः ||१६-१८||\",\"verse\":{\"sanskrit\":\"अहंकारं बलं दर्पं कामं क्रोधं च संश्रिताः | मामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः ||१६-१८||\",\"translation\":\"16.18 Given over to egoism, power, haughtiness, lust and anger, these malicious people hate Me in their own bodies and in those of others.\",\"transliteration\":\"ahaṃkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ ca saṃśritāḥ . māmātmaparadeheṣu pradviṣanto.abhyasūyakāḥ ||16-18||\"}}},\"verse19\":{\"verse19\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 19\",\"description\":\"Bhagavad Gita Chapter 16 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 19\",\"description\":\"Bhagavad Gita Chapter 16 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-19\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 19\",\"Gita 16.19\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-19\"},\"introduction\":\"$31\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 19\",\"description\":\"Bhagavad Gita Chapter 16 Verse 19 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-19\"},\"philosophical_explanation\":\"$32\",\"scripture_text\":\"तानहं द्विषतः क्रुरान्संसारेषु नराधमान् | क्षिपाम्यजस्रमशुभानासुरीष्वेव योनिषु ||१६-१९||\",\"verse\":{\"sanskrit\":\"तानहं द्विषतः क्रुरान्संसारेषु नराधमान् | क्षिपाम्यजस्रमशुभानासुरीष्वेव योनिषु ||१६-१९||\",\"translation\":\"16.19 Those cruel haters, worst among men in the world, I hurl those evil-doers into the wombs of demons only.\",\"transliteration\":\"tānahaṃ dviṣataḥ krurānsaṃsāreṣu narādhamān . kṣipāmyajasramaśubhānāsurīṣveva yoniṣu ||16-19||\"}}},\"verse2\":{\"verse2\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 2\",\"description\":\"Bhagavad Gita Chapter 16 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 2\",\"description\":\"Bhagavad Gita Chapter 16 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-2\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 2\",\"Gita 16.2\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-2\"},\"introduction\":\"$33\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 2\",\"description\":\"Bhagavad Gita Chapter 16 Verse 2 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-2\"},\"philosophical_explanation\":\"$34\",\"scripture_text\":\"अहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम् | दया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम् ||१६-२||\",\"verse\":{\"sanskrit\":\"अहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम् | दया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम् ||१६-२||\",\"translation\":\"16.2 Harmlessness, truth, absence of anger, renunciation, peacefulness, absence of crookedness, compassion towards beings, non-covetousness, gentleness, modesty, absence of fickleness.\",\"transliteration\":\"ahiṃsā satyamakrodhastyāgaḥ śāntirapaiśunam . dayā bhūteṣvaloluptvaṃ mārdavaṃ hrīracāpalam ||16-2||\"}}},\"verse20\":{\"verse20\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 20\",\"description\":\"Bhagavad Gita Chapter 16 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 20\",\"description\":\"Bhagavad Gita Chapter 16 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-20\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 20\",\"Gita 16.20\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-20\"},\"introduction\":\"$35\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 20\",\"description\":\"Bhagavad Gita Chapter 16 Verse 20 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-20\"},\"philosophical_explanation\":\"$36\",\"scripture_text\":\"आसुरीं योनिमापन्ना मूढा जन्मनि जन्मनि | मामप्राप्यैव कौन्तेय ततो यान्त्यधमां गतिम् ||१६-२०||\",\"verse\":{\"sanskrit\":\"आसुरीं योनिमापन्ना मूढा जन्मनि जन्मनि | मामप्राप्यैव कौन्तेय ततो यान्त्यधमां गतिम् ||१६-२०||\",\"translation\":\"16.20 Entering into demoniacal wombs and deluded, birth after birth, not attaining Me, they thus fall, O Arjuna, into a condition still lower than that.\",\"transliteration\":\"āsurīṃ yonimāpannā mūḍhā janmani janmani . māmaprāpyaiva kaunteya tato yāntyadhamāṃ gatim ||16-20||\"}}},\"verse21\":{\"verse21\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 21\",\"description\":\"Bhagavad Gita Chapter 16 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 21\",\"description\":\"Bhagavad Gita Chapter 16 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-21\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 21\",\"Gita 16.21\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-21\"},\"introduction\":\"$37\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 21\",\"description\":\"Bhagavad Gita Chapter 16 Verse 21 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-21\"},\"philosophical_explanation\":\"$38\",\"scripture_text\":\"त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः | कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत् ||१६-२१||\",\"verse\":{\"sanskrit\":\"त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः | कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत् ||१६-२१||\",\"translation\":\"16.21 Triple is the gate of this hell, destructive of the self lust, anger and greed; therefore one should abandon these three.\",\"transliteration\":\"trividhaṃ narakasyedaṃ dvāraṃ nāśanamātmanaḥ . kāmaḥ krodhastathā lobhastasmādetattrayaṃ tyajet ||16-21||\"}}},\"verse22\":{\"verse22\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 22\",\"description\":\"Bhagavad Gita Chapter 16 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 22\",\"description\":\"Bhagavad Gita Chapter 16 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-22\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 22\",\"Gita 16.22\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-22\"},\"introduction\":\"$39\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 22\",\"description\":\"Bhagavad Gita Chapter 16 Verse 22 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-22\"},\"philosophical_explanation\":\"$3a\",\"scripture_text\":\"एतैर्विमुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः | आचरत्यात्मनः श्रेयस्ततो याति परां गतिम् ||१६-२२||\",\"verse\":{\"sanskrit\":\"एतैर्विमुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः | आचरत्यात्मनः श्रेयस्ततो याति परां गतिम् ||१६-२२||\",\"translation\":\"16.22 A man who is liberated from these three gates to darkness, O Arjuna, practises what is good for him and thus goes to the Supreme Goal.\",\"transliteration\":\"etairvimuktaḥ kaunteya tamodvāraistribhirnaraḥ . ācaratyātmanaḥ śreyastato yāti parāṃ gatim ||16-22||\"}}},\"verse23\":{\"verse23\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 23\",\"description\":\"Bhagavad Gita Chapter 16 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 23\",\"description\":\"Bhagavad Gita Chapter 16 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-23\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 23\",\"Gita 16.23\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-23\"},\"introduction\":\"$3b\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 23\",\"description\":\"Bhagavad Gita Chapter 16 Verse 23 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-23\"},\"philosophical_explanation\":\"$3c\",\"scripture_text\":\"यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः | न स सिद्धिमवाप्नोति न सुखं न परां गतिम् ||१६-२३||\",\"verse\":{\"sanskrit\":\"यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः | न स सिद्धिमवाप्नोति न सुखं न परां गतिम् ||१६-२३||\",\"translation\":\"16.23 He who, having cast aside the ordinances of the scriptures, acts under the impulse of desire, attains not perfection, nor happiness nor the Supreme Goal.\",\"transliteration\":\"yaḥ śāstravidhimutsṛjya vartate kāmakārataḥ . na sa siddhimavāpnoti na sukhaṃ na parāṃ gatim ||16-23||\"}}},\"verse24\":{\"verse24\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 24\",\"description\":\"Bhagavad Gita Chapter 16 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 24\",\"description\":\"Bhagavad Gita Chapter 16 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-24\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 24\",\"Gita 16.24\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-24\"},\"introduction\":\"$3d\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 24\",\"description\":\"Bhagavad Gita Chapter 16 Verse 24 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-24\"},\"philosophical_explanation\":\"$3e\",\"scripture_text\":\"तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ | ज्ञात्वा शास्त्रविधानोक्तं कर्म कर्तुमिहार्हसि ||१६-२४||\",\"verse\":{\"sanskrit\":\"तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ | ज्ञात्वा शास्त्रविधानोक्तं कर्म कर्तुमिहार्हसि ||१६-२४||\",\"translation\":\"16.24 Therefore, let the scripture be thy authority in determining what ought to be done and what ought not to be done. Having known what is said in the ordinance of the scriptures, thou shouldst act here in this world.\",\"transliteration\":\"tasmācchāstraṃ pramāṇaṃ te kāryākāryavyavasthitau . jñātvā śāstravidhānoktaṃ karma kartumihārhasi ||16-24||\"}}},\"verse3\":{\"verse3\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 3\",\"description\":\"Bhagavad Gita Chapter 16 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 3\",\"description\":\"Bhagavad Gita Chapter 16 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-3\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 3\",\"Gita 16.3\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-3\"},\"introduction\":\"$3f\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 3\",\"description\":\"Bhagavad Gita Chapter 16 Verse 3 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-3\"},\"philosophical_explanation\":\"$40\",\"scripture_text\":\"तेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता | भवन्ति सम्पदं दैवीमभिजातस्य भारत ||१६-३||\",\"verse\":{\"sanskrit\":\"तेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता | भवन्ति सम्पदं दैवीमभिजातस्य भारत ||१६-३||\",\"translation\":\"16.3 Vigour, forgiveness, fortitude, purity, absence of hatred, absence of pride these belong to the one born for a divine state, O Arjuna.\",\"transliteration\":\"tejaḥ kṣamā dhṛtiḥ śaucamadroho nātimānitā . bhavanti sampadaṃ daivīmabhijātasya bhārata ||16-3||\"}}},\"verse4\":{\"verse4\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 4\",\"description\":\"Bhagavad Gita Chapter 16 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 4\",\"description\":\"Bhagavad Gita Chapter 16 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-4\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 4\",\"Gita 16.4\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-4\"},\"introduction\":\"$41\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 4\",\"description\":\"Bhagavad Gita Chapter 16 Verse 4 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-4\"},\"philosophical_explanation\":\"$42\",\"scripture_text\":\"दम्भो दर्पोऽभिमानश्च क्रोधः पारुष्यमेव च | अज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम् ||१६-४||\",\"verse\":{\"sanskrit\":\"दम्भो दर्पोऽभिमानश्च क्रोधः पारुष्यमेव च | अज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम् ||१६-४||\",\"translation\":\"16.4 Hypocrisy, arrogance and self-conceit, anger and also harshness and ignorance, belong to one who is born for a demoniacal state, O Partha (Arjuna).\",\"transliteration\":\"dambho darpo.abhimānaśca krodhaḥ pāruṣyameva ca . ajñānaṃ cābhijātasya pārtha sampadamāsurīm ||16-4||\"}}},\"verse5\":{\"verse5\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 5\",\"description\":\"Bhagavad Gita Chapter 16 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 5\",\"description\":\"Bhagavad Gita Chapter 16 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-5\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 5\",\"Gita 16.5\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-5\"},\"introduction\":\"$43\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 5\",\"description\":\"Bhagavad Gita Chapter 16 Verse 5 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-5\"},\"philosophical_explanation\":\"$44\",\"scripture_text\":\"दैवी सम्पद्विमोक्षाय निबन्धायासुरी मता | मा शुचः सम्पदं दैवीमभिजातोऽसि पाण्डव ||१६-५||\",\"v ld, the divine and the demoniacal; the divine has been described at length; hear from Me, O Arjuna, of the demoniacal.\",\"transliteration\":\"dvau bhūtasargau loke.asmindaiva āsura eva ca . daivo vistaraśaḥ prokta āsuraṃ pārtha me śṛṇu ||16-6||\"}}},\"verse7\":{\"verse7\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 7\",\"description\":\"Bhagavad Gita Chapter 16 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"meta\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 7\",\"description\":\"Bhagavad Gita Chapter 16 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"canonical\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-7\",\"keywords\":[\"Bhagavad Gita Chapter 16 Verse 7\",\"Gita 16.7\",\"Bhagavad Gita Sanskrit\",\"IAST transliteration\",\"Gita English meaning\",\"Vedantic interpretation\",\"Dharma teaching\",\"Krishna upadesha\"],\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-7\"},\"introduction\":\"$47\",\"openGraph\":{\"title\":\"Bhagavad Gita Chapter 16 Verse 7\",\"description\":\"Bhagavad Gita Chapter 16 Verse 7 with original Sanskrit, IAST transliteration, English translation, and philosophical insight for Sanatana Dharma practice.\",\"siteName\":\"Sanatanadharmam\",\"type\":\"article\",\"url\":\"https://sanatanadharmam.in/itihasa/bhagavad-gita/chapter-16/verse-7\"},\"philosophical_explanation\":\"$48\",\"scripture_text\":\"प्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः | न शौचं नापि चाचारो न सत्यं तेषु विद्यते ||१६-७||\",\"verse\":{\"sanskrit\":\"प्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः | न शौचं नापि चाचारो न सत्यं तेषु विद्यते ||१६-७||\",\"translation\":\"16.7 The demoniacal know not what to do and what to refrain from; neither purity, nor right conduct nor truth is found in them.\",\"transliteration\":\"pravṛttiṃ ca nivṛttiṃ ca janā na vidurāsurāḥ
