name: Deploy to GitHub Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: production

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: https://sanatanadharmam.in
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          cp CNAME out/CNAME
          touch out/.nojekyll

      - name: Publish to GitHub Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C out init --initial-branch=gh-pages
          git -C out config user.name "github-actions[bot]"
          git -C out config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C out add --all
          git -C out commit -m "Deploy ${GITHUB_SHA}"
          git -C out -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
